# Planetiler custom schema – vrstevnice a skaly z digitálneho modelu terénu.
#
# OpenStreetMap výškové dáta neobsahuje (okrem bodového tagu `ele` na
# vrcholoch, prameňoch a pod.) a vrstevnice sa doň zámerne nenahrávajú.
# Terén preto ide z externého DEM: Sonny's LiDAR DTM (presnejší, bez stromov
# a budov) alebo Copernicus GLO-30 (celosvetový).
#
# Vstupy vyrába workflow build-map.yml:
#   gdal_contour → ogr2ogr (dopočíta `level`)        → data/contours.gpkg
#   gdaldem slope → gdal_contour -p → ogr2ogr        → data/rock.gpkg
#
# `level` rozdeľuje vrstevnice na tri triedy, aby sa dali zapínať postupne
# podľa zoomu a hlavné vrstevnice sa dali kresliť hrubšie:
#   major = násobky 100 m, mid = násobky 50 m, minor = ostatné
#
# `class` pri skalách rozlišuje strmý svah (`steep`) od výraznej steny
# (`cliff`), nech sa dajú kresliť rôzne tmavo.
schema_name: FricoMaps vrstevnice a skaly
schema_description: Vrstevnice, nadmorská výška a skalné plochy z DEM
attribution: <a href="https://sonny.4lima.de/">Sonny's LiDAR DTM</a> / <a href="https://spacedata.copernicus.eu/">Copernicus DEM</a>

sources:
  contours:
    type: geopackage
    local_path: data/contours.gpkg
    projection: EPSG:4326
  rock:
    type: geopackage
    local_path: data/rock.gpkg
    projection: EPSG:4326

layers:
  - id: contour
    features:
      # hlavné vrstevnice (100 m) – viditeľné už z diaľky
      - source: contours
        geometry: line
        min_zoom: 10
        include_when:
          level: major
        attributes:
          - key: ele
            type: integer
          - key: level
      # polovičné (50 m)
      - source: contours
        geometry: line
        min_zoom: 12
        include_when:
          level: mid
        attributes:
          - key: ele
            type: integer
          - key: level
      # základný interval – až na detailnom zoome, inak by mapa zčernela
      - source: contours
        geometry: line
        min_zoom: 13
        include_when:
          level: minor
        attributes:
          - key: ele
            type: integer
          - key: level

  # Skalné plochy – najstrmšie úseky terénu (sklon nad prahom). Obrys je
  # izolínia sklonu, takže plocha má tvar, aký terén naozaj má. Kde je vnútri
  # steny miesto pod prahom (polica, terasa), má polygón dieru a nezafarbí sa.
  #
  # min_zoom 9, nie 13: skaly majú byť vidieť všade, kde sú – veľká stena je
  # čitateľná aj z prehľadového zoomu. Malé plochy sa nižšími zoomami netreba
  # báť, Planetiler zahodí všetko pod pixel sám (min_feature_size platí na
  # každom zoome okrem najvyššieho, kde ho zámerne vypíname).
  - id: rock
    features:
      - source: rock
        geometry: polygon
        min_zoom: 9
        attributes:
          - key: class
          - key: slope
            type: integer
          # plocha v m² – nech sa dá v štýle rozlíšiť bralo od odrobinky
          - key: area
            type: integer
