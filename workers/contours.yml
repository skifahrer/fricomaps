# Planetiler custom schema – vrstevnice z digitálneho modelu terénu.
#
# OpenStreetMap výškové dáta neobsahuje (okrem bodového tagu `ele` na
# vrcholoch, prameňoch a pod.) a vrstevnice sa doň zámerne nenahrávajú.
# Terén preto ide z externého DEM: Copernicus GLO-30 (AWS Open Data).
#
# Vstup vyrába workflow build-map.yml:
#   gdal_contour → ogr2ogr (dopočíta `level`) → data/contours.gpkg
#
# `level` rozdeľuje vrstevnice na tri triedy, aby sa dali zapínať postupne
# podľa zoomu a hlavné vrstevnice sa dali kresliť hrubšie:
#   major = násobky 100 m, mid = násobky 50 m, minor = ostatné
schema_name: FricoMaps vrstevnice
schema_description: Vrstevnice a nadmorská výška z Copernicus GLO-30
attribution: <a href="https://spacedata.copernicus.eu/">Copernicus DEM</a>

sources:
  contours:
    type: geopackage
    local_path: data/contours.gpkg
    projection: EPSG:4326

layers:
  - id: contour
    features:
      # hlavné vrstevnice (100 m) – viditeľné už z diaľky
      - source: contours
        geometry: line
        min_zoom: 10
        include_when:
          level: major
        attributes:
          - key: ele
            type: integer
          - key: level
      # polovičné (50 m)
      - source: contours
        geometry: line
        min_zoom: 12
        include_when:
          level: mid
        attributes:
          - key: ele
            type: integer
          - key: level
      # základný interval – až na detailnom zoome, inak by mapa zčernela
      - source: contours
        geometry: line
        min_zoom: 13
        include_when:
          level: minor
        attributes:
          - key: ele
            type: integer
          - key: level
