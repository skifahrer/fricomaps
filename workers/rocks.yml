# Planetiler custom schema – SAMOTNÉ skalné plochy, vlastný .pmtiles.
#
# PREČO ZVLÁŠŤ, A NIE SPOLU S VRSTEVNICAMI: každý .pmtiles má jeden maxzoom
# a tie dve vrstvy ho chcú úplne iný. Vrstevnice sú čiary cez celý kraj –
# každý zoom navyše ich zdvojnásobí a rozpočet stránky sa minie okolo z14.
# Skaly sú plochy len tam, kde je terén strmý, takže sa do vyššieho zoomu
# zmestia bez problémov – a práve pri priblížení je vidieť, či obrys sedí na
# terén. Kým boli v jednom súbore, museli sa obe uskromniť na to nižšie.
#
# Nad `maxzoom` sa dlaždice naťahujú overzoomom, takže sa skaly zobrazujú až
# do maximálneho zoomu mapy; z vyššieho maxzoomu je ostrejší tvar, nie väčší
# rozsah zoomov.
#
# Vstup `data/rock.gpkg` vyrába vždy `workers/rock-areas.py`:
#   gdaldem slope → gdal_contour -p → ogr2ogr
# Skala je teda vždy pásmo sklonu nad prahom. `rock_source: tienovanie` to
# navyše OREŽE tmavými plochami z hillshade dlaždíc
# (`workers/shading-rocks.py`) – tie sú maska, nie skaly: hillshade je
# osvetlený z jednej strany, takže tmavý je aj úplne mierny odvrátený svah
# a samotná tmavosť pokryla na testovacom výreze 34 % územia.
#
# JEDNA TRIEDA: obe cesty predvolene vyrábajú plochy v jedinej triede, teda
# žiadnu plochu vnútri inej. Kým sa `steep` a `cliff` kreslili rôzne tmavo,
# malo zmysel mať dve pásma – `cliff` ležal v diere `steep`u a spolu dláždili
# územie bez prekryvu. Odkedy je všetko jedna sivá bez priehľadnosti, je
# z dvoch pásiem len dvojnásobok práce a riziko, že sa niekde prekryjú
# a plocha vyjde tmavšia. Atribút `class` ostáva (vždy `steep`), nech sa
# schéma nemení pri každom preladení.
#
# DIERY V PLOCHÁCH SÚ SÚČASŤ TVARU: police vnútri stien a medzery medzi
# vláknami siete žliabkov. Krátko sa zapĺňali a zo skál boli súvislé plochy
# bez detailu; odvtedy ostávajú a zapĺňanie je vlastná (vypnutá) voľba.
schema_name: FricoMaps skaly
schema_description: Skalné plochy z výškového modelu alebo z tieňovaných dlaždíc
attribution: <a href="https://sonny.4lima.de/">Sonny's LiDAR DTM</a> / <a href="https://spacedata.copernicus.eu/">Copernicus DEM</a> / <a href="https://www.freemap.sk/">freemap.sk</a>

sources:
  rock:
    type: geopackage
    local_path: data/rock.gpkg
    projection: EPSG:4326

layers:
  # min_zoom 9, nie 13: skaly majú byť vidieť všade, kde sú – veľká stena je
  # čitateľná aj z prehľadového zoomu. Malé plochy sa nižšími zoomami netreba
  # báť, Planetiler zahodí všetko pod pixel sám (min_feature_size platí na
  # každom zoome okrem najvyššieho, kde ho zámerne vypíname).
  - id: rock
    features:
      - source: rock
        geometry: polygon
        min_zoom: 9
        attributes:
          - key: class
          # prah sklonu v stupňoch
          - key: slope
            type: integer
          # o koľko stupňov šedej pod prahom. Ostáva kvôli surovému výstupu
          # workflowu „Skaly z tieňovaných dlaždíc" (dá sa pozrieť v QGISe);
          # v mape je `rock.gpkg` vždy pásmo sklonu, takže tam býva prázdny.
          - key: dark
            type: integer
          # plocha v m² – nech sa dá v štýle rozlíšiť bralo od odrobinky
          - key: area
            type: integer
