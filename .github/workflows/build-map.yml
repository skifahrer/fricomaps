name: Build map (PBF → PMTiles) & deploy Pages

# Stiahne PBF export IBA zvoleného regiónu z osm.fr regionálnych exportov
# (https://download.openstreetmap.fr/extracts/ – Európa aj svet, rezané po
# administratívnych hraniciach, denne aktualizované).
# Potom Planetiler → PMTiles → GitHub Pages.
#
# Detail a zoom:
#   Planetiler má tvrdý limit `maxzoom <= 16` (PlanetilerConfig.MAX_MAXZOOM).
#   Vyšší zoom (až z20) sa NEGENERUJE do dlaždíc – rieši ho MapLibre overzoomom
#   nad dlaždicami z16. Aby overzoom vyzeral ostro, generujeme najvyšší zoom
#   s nulovou simplifikáciou a bez zahadzovania malých prvkov.
#
# Ľubovoľný iný región Európy/sveta: vyplň input `custom_pbf_url`
# (URL na .osm.pbf z download.openstreetmap.fr/extracts/...) + `custom_name`.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Región (ignoruje sa, ak je vyplnené custom_pbf_url)"
        required: true
        default: slovensko
        type: choice
        options:
          - slovensko
          - bratislavsky
          - trnavsky
          - trenciansky
          - nitriansky
          - zilinsky
          - banskobystricky
          - presovsky
          - kosicky
      maxzoom:
        description: "Max zoom dlaždíc – Planetiler zvládne najviac 16 (mapa sa aj tak priblíži na z20 overzoomom)"
        required: false
        default: "16"
        type: string
      crop_bbox:
        description: "Orezať na menšie územie: west,south,east,north (odporúčané pre maxzoom 16)"
        required: false
        default: ""
        type: string
      size_limit_mb:
        description: "Rozpočet na celú stránku v MB – dlaždice + vrstevnice + fonty (GitHub Pages zvládne ~1 GB)"
        required: false
        default: "900"
        type: string
      auto_shrink:
        description: "Ak sa dlaždice do rozpočtu nezmestia, automaticky skús nižší zoom"
        required: false
        default: true
        type: boolean
      contours:
        description: "Vygenerovať vrstevnice a skaly z DEM (pozor na veľkosť pri celom Slovensku)"
        required: false
        default: true
        type: boolean
      contour_interval:
        description: "Interval vrstevníc v metroch (10 = štandard pre 30 m DEM)"
        required: false
        default: "10"
        type: string
      contour_maxzoom:
        description: "Max zoom dlaždíc s vrstevnicami (14 stačí, sú to hladké krivky)"
        required: false
        default: "14"
        type: string
      contour_smoothing:
        description: "Zjemnenie DEM pred vrstevnicami v oblúkových sekundách (0 = vypnuté, plné rozlíšenie; 2 = pôvodné hladenie)"
        required: false
        default: "0"
        type: string
      rocks:
        description: "Vygenerovať skalné plochy (najstrmšie úseky terénu z DEM)"
        required: false
        default: true
        type: boolean
      rock_slope:
        description: "Od akého sklonu (°) je terén skala – 50 = steny (odporúčané), 40 = aj strmé svahy, teda oveľa väčšie plochy"
        required: false
        default: "50"
        type: string
      rock_res:
        description: "Mriežka na výpočet sklonu skál v metroch (2 = jemný obrys; 1 len na malé územie, kraj by trval hodiny)"
        required: false
        default: "2"
        type: string
      rock_piece:
        description: "Skaly ako malé kúsky – veľkosť kúska v metroch (10 = ~100 m² kúsky, 0 = súvislé plochy)"
        required: false
        default: "10"
        type: string
      rocks_rebuild:
        description: "Vždy prepočítať skaly, aj keď sú pre tento región a nastavenia už uložené"
        required: false
        default: false
        type: boolean
      terrain:
        description: "Tieňovanie reliéfu a 3D terén zo Sonnyho ako PNG dlaždice"
        required: false
        default: true
        type: boolean
      terrain_maxzoom:
        description: "Max zoom výškových dlaždíc (13 stačí – jemnejšie už 20 m DEM neunesie)"
        required: false
        default: "13"
        type: string
      terrain_rebuild:
        description: "Vždy pregenerovať výškové dlaždice, aj keď sú už uložené v release"
        required: false
        default: false
        type: boolean
      custom_pbf_url:
        description: "Vlastný región – URL .osm.pbf (napr. https://download.openstreetmap.fr/extracts/europe/austria.osm.pbf)"
        required: false
        default: ""
        type: string
      custom_name:
        description: "Vlastný región – zobrazované meno (napr. Rakúsko)"
        required: false
        default: ""
        type: string
      custom_bbox:
        description: "Vlastný región – bbox west,south,east,north (voliteľné, inak sa prečíta z PBF hlavičky)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  OSMFR_BASE: https://download.openstreetmap.fr/extracts
  # Glyfy (fonty) si hostíme sami – verejná služba fonts.openmaptiles.org je
  # jediný bod zlyhania, pri ktorom sa mapa vykreslí bez akýchkoľvek nápisov.
  # (Zdroje ikoniek sú v poc/web/icon-sources.js.)
  GLYPHS_ZIP: https://github.com/openmaptiles/fonts/releases/download/v2.0/noto-sans.zip
  # Release s dlaždicami Sonny's LiDAR DTM (napĺňa ho workflow "Update DEM").
  DEM_RELEASE: dem-sonny
  # Skaly = najstrmšie úseky terénu, ako vektorové plochy. Ladenie je tu
  # v env, aby inputov workflowu nebolo priveľa. Predvolené hodnoty idú na
  # maximálnu presnosť – nič sa nezahladzuje ani nezahadzuje:
  # Release s hotovými výškovými (hillshade) dlaždicami – aby sa nerobili znova.
  TERRAIN_RELEASE: dem-terrain
  # Release s hotovými skalami. Sú to desiatky minút výpočtu, ale závisia len
  # od územia a nastavení – tie sú preto v mene assetu a hotové skaly sa
  # nabudúce len stiahnu.
  ROCK_RELEASE: dem-rocks
  ROCK_RES: "2" # záložná mriežka na sklon (m), keď input rock_res chýba
  ROCK_MIN_AREA: "1" # najmenšia skalná plocha (m²) – teda bez filtra
  # Akú časť bunky kúsok vyplní. 0,8 znamená 8×8 m kúsok v 10 m bunke, takže
  # sa susedné nedotýkajú a medzi nimi presvitá podklad – v mape z toho je
  # skalné šrafovanie namiesto jednej sivej plochy.
  ROCK_PIECE_FILL: "0.8"
  ROCK_SIMPLIFY: "0" # zjednodušenie obrysu (m); 0 = presný obrys izolínie
  ROCK_CLIFF_PLUS: "15" # o koľko ° nad prahom začína trieda `cliff` (tmavšia)
  # Koľko buniek naraz. Sklon sa počíta po častiach, lebo bbox kraja má pri
  # 2 m vyše 3 miliardy buniek (~13 GB na jeden raster) – naraz sa to do
  # runnera nezmestí. 150 miliónov je ~600 MB na raster, čo je bezpečné.
  ROCK_CHUNK_CELLS: "150000000"

jobs:
  # ---------- je v release terén pre toto územie? ----------
  # Iný zdroj výšok nemáme (Copernicus je zámerne vypnutý), takže bez dlaždíc
  # by build po pár minútach zlyhal. Radšej sa najprv pozrieme, či v release
  # niečo pre náš bbox je – a keď nie, doplní ho `mirror-dem` ešte predtým.
  check-dem:
    name: Kontrola výškového modelu
    runs-on: ubuntu-latest
    if: ${{ inputs.contours }}
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      demkey: ${{ steps.check.outputs.demkey }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sú v release dlaždice pre bbox?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BBOX=''
          if [ -n '${{ inputs.custom_pbf_url }}' ]; then
            BBOX='${{ inputs.custom_bbox }}'
          else
            BBOX=$(jq -r --arg r '${{ inputs.region }}' '.[$r].bbox // [] | join(",")' workers/regions.json)
          fi
          if [ -n '${{ inputs.crop_bbox }}' ]; then BBOX='${{ inputs.crop_bbox }}'; fi

          ASSETS=$(gh release view "$DEM_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --json assets -q '.assets[].name' 2>/dev/null || echo '')

          if [ -z "$BBOX" ]; then
            # Vlastný región bez bboxu – zoznam dlaždíc sa nedá zistiť, tak sa
            # pozeráme len na to, či v release vôbec niečo je.
            NEED=$([ -z "$ASSETS" ] && echo true || echo false)
            echo "Bbox nie je známy; release $DEM_RELEASE má $(printf '%s' "$ASSETS" | grep -c . || true) assetov → doplniť: $NEED"
          else
            IFS=, read -r W S E N <<< "$BBOX"
            TILES=$(python3 - "$W" "$S" "$E" "$N" <<'PY'
          import math, sys
          w, s, e, n = map(float, sys.argv[1:5])
          for lat in range(math.floor(s), math.floor(n) + 1):
              for lon in range(math.floor(w), math.floor(e) + 1):
                  ns, ew = ("N" if lat >= 0 else "S"), ("E" if lon >= 0 else "W")
                  print(f"{ns}{abs(lat):02d}{ew}{abs(lon):03d}")
          PY
          )
            HAVE=0
            for t in $TILES; do
              printf '%s\n' "$ASSETS" | grep -qx "$t.tif" && HAVE=$(( HAVE + 1 )) || true
            done
            TOTAL=$(printf '%s\n' "$TILES" | grep -c .)
            # Doplňujeme, len keď nie je ani jedna použiteľná dlaždica. Bbox je
            # obdĺžnik, ale produkt pokrýva krajinu – rohové bunky (u Slovenska
            # napr. N47E016 v Maďarsku) v ňom nikdy nebudú, takže „chýba jedna,
            # tak sťahuj znova" by mirrorovalo pri každom builde.
            NEED=$([ "$HAVE" -eq 0 ] && echo true || echo false)
            echo "Dlaždíc pre bbox: $TOTAL, v release $DEM_RELEASE: $HAVE → doplniť: $NEED"
          fi
          echo "needed=$NEED" >> "$GITHUB_OUTPUT"

          # Otlačok obsahu releasu ide do kľúča cache vrstevníc. Bez neho by
          # sa po doplnení terénu vrátili z cache staré vrstevnice počítané
          # ešte z Copernicusu.
          # `|| true` vnútri zátvoriek: keď release ešte neexistuje, gh skončí
          # nenulovo a `set -o pipefail` by zhodil celý krok.
          DEMKEY=$({ gh release view "$DEM_RELEASE" --repo "$GITHUB_REPOSITORY" --json assets \
            -q '[.assets[] | .name + ":" + (.size|tostring)] | sort | join(",")' 2>/dev/null \
            || true; } | sha256sum | cut -c1-12)
          echo "demkey=$DEMKEY" >> "$GITHUB_OUTPUT"
          echo "Otlačok releasu: $DEMKEY"

  # ---------- doplnenie terénu (rovnaký workflow ako Update DEM) ----------
  mirror-dem:
    name: Doplniť výškový model
    needs: check-dem
    if: ${{ !cancelled() && needs.check-dem.outputs.needed == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/update-dem.yml

  build:
    needs: [check-dem, mirror-dem]
    # `contents: write` kvôli ukladaniu hotových výškových dlaždíc do releasu
    permissions:
      contents: write
      pages: write
      id-token: write
    # Kontrola aj doplnenie sa môžu preskočiť (vypnuté vrstevnice, terén už
    # v release) – build musí bežať aj tak. Keď doplnenie zlyhá (napr. Drive
    # limituje sťahovanie), build sa spustí tiež a zastaví sa až na kroku
    # s DEM, kde presne napíše, ktoré dlaždice chýbajú.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GITHUB_TOKEN nemá admin práva na vytvorenie Pages site, preto sa
      # Pages musí zapnúť raz ručne: Settings → Pages → Source: GitHub Actions.
      # Kontrola hneď na začiatku, aby build nezlyhal až po konverzii dlaždíc.
      - name: Over, že GitHub Pages je zapnuté
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "::error::GitHub Pages nie je zapnuté. Zapni ho ručne: Settings → Pages → Build and deployment → Source: 'GitHub Actions' a spusti workflow znova."
            exit 1
          fi
          echo "Pages je zapnuté ✓"

      # PBF sa mení denne, tak je v kľúči dátum – v ten istý deň sa už
      # nesťahuje znova (kraj má 36–63 MB, celé Slovensko ~380 MB).
      - name: Dnešný dátum do kľúča cache
        id: day
        run: echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache PBF regiónu
        uses: actions/cache@v4
        with:
          path: data/region.osm.pbf
          key: pbf-${{ inputs.region }}-${{ inputs.custom_pbf_url }}-${{ inputs.crop_bbox }}-${{ steps.day.outputs.d }}

      - name: Stiahni PBF iba daného regiónu
        id: region
        run: |
          mkdir -p data
          CUSTOM_URL='${{ inputs.custom_pbf_url }}'

          # Cache: keď PBF (už aj orezané) leží z predošlého behu, sťahovať ani
          # rezať netreba – kľúč nesie región, orez aj dátum.
          CACHED=""
          if [ -s data/region.osm.pbf ]; then
            CACHED=1
            echo "PBF z cache ✓ ($(du -h data/region.osm.pbf | cut -f1))"
          fi

          download() { # $1 = URL
            [ -n "$CACHED" ] && return 0
            echo "Skúšam: $1"
            curl -fL --retry 3 --retry-delay 5 -o data/region.osm.pbf "$1"
          }

          if [ -n "$CUSTOM_URL" ]; then
            # ----- vlastný región (Európa / svet) -----
            NAME='${{ inputs.custom_name }}'
            [ -n "$NAME" ] || NAME=$(basename "$CUSTOM_URL" .osm.pbf)
            KEY=$(echo "$NAME" | LC_ALL=C.UTF-8 iconv -f utf8 -t ascii//TRANSLIT | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '_' | sed 's/^_//;s/_*$//')
            download "$CUSTOM_URL" || { echo "::error::Nepodarilo sa stiahnuť $CUSTOM_URL"; exit 1; }

            BBOX='${{ inputs.custom_bbox }}'
            if [ -z "$BBOX" ]; then
              sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
              BBOX=$(osmium fileinfo -g header.boxes data/region.osm.pbf | head -1 | tr -d '() ')
            fi
            if [ -z "$BBOX" ]; then
              echo "::error::PBF nemá bbox v hlavičke – vyplň input custom_bbox (west,south,east,north)."
              exit 1
            fi
          else
            # ----- prednastavený región z workers/regions.json -----
            KEY='${{ inputs.region }}'
            NAME=$(jq -r --arg r "$KEY" '.[$r].name' workers/regions.json)
            BBOX=$(jq -r --arg r "$KEY" '.[$r].bbox | join(",")' workers/regions.json)
            DIR=$(jq -r --arg r "$KEY" '.[$r].osmfr.dir' workers/regions.json)
            if [ "$NAME" = "null" ]; then echo "::error::Neznámy región: $KEY"; exit 1; fi

            OK=""
            # osm.fr regionálne exporty (skúšaj kandidátske názvy súborov)
            for SLUG in $(jq -r --arg r "$KEY" '.[$r].osmfr.slugs[]' workers/regions.json); do
              if download "$OSMFR_BASE/$DIR/$SLUG.osm.pbf"; then OK=1; break; fi
            done
            if [ -z "$OK" ]; then
              echo "::error::PBF pre '$KEY' sa nepodarilo stiahnuť. Obsah $OSMFR_BASE/$DIR/ (uprav slugs vo workers/regions.json):"
              curl -sL "$OSMFR_BASE/$DIR/" | grep -oE 'href="[^"]+\.osm\.pbf"' | sort -u || true
              echo "…alebo vyplň custom_pbf_url s priamou URL na .osm.pbf."
              exit 1
            fi
          fi

          # ----- voliteľné orezanie na menšie územie -----
          # Menšie územie = výrazne menší .pmtiles, takže sa dá ísť na maxzoom 16.
          CROP='${{ inputs.crop_bbox }}'
          if [ -n "$CROP" ]; then
            if [ -z "$CACHED" ]; then
              command -v osmium >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool; }
              echo "Orezávam na bbox $CROP …"
              if ! osmium extract --overwrite -b "$CROP" -s smart \
                   -o data/region-crop.osm.pbf data/region.osm.pbf; then
                echo "::error::Orezanie na bbox '$CROP' zlyhalo – očakávaný formát je west,south,east,north (napr. 18.98,49.18,19.20,49.28)."
                exit 1
              fi
              mv data/region-crop.osm.pbf data/region.osm.pbf
            fi
            BBOX="$CROP"
            KEY="${KEY}_crop"
            NAME="$NAME (výrez)"
          fi

          echo "key=$KEY"   >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "bbox=$BBOX" >> "$GITHUB_OUTPUT"
          # bezpečná podoba bboxu do kľúča cache
          echo "bboxkey=$(echo "$BBOX" | tr ',.-' '___')" >> "$GITHUB_OUTPUT"
          echo "Región: $NAME (key=$KEY, bbox=$BBOX)"
          ls -lh data/region.osm.pbf

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache – zdrojové dáta Planetileru (water polygons, Natural Earth)
        uses: actions/cache@v4
        with:
          path: data/sources
          key: planetiler-sources-v1

      - name: Cache Planetileru
        uses: actions/cache@v4
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ steps.day.outputs.d }}

      - name: Stiahni Planetiler
        run: |
          [ -s planetiler.jar ] && { echo "Planetiler z cache ✓"; exit 0; }
          curl -fL --retry 4 --retry-delay 5 -o planetiler.jar \
            https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar

      # ---------- vrstevnice a skaly ----------
      # OSM výškový model neobsahuje (má len bodový tag `ele`), takže terén
      # ide z externého DEM: **Sonny's LiDAR DTM** z releasu `dem-sonny`
      # (napĺňa ho workflow "Update DEM"). Je to LiDAR *model terénu*, teda
      # bez stromov a striech.
      #
      # Copernicus GLO-30 ako záloha je zámerne VYPNUTÝ. Je to model povrchu:
      # vrstevnice by v lese viedli po korunách stromov a skaly by vychádzali
      # z vegetácie. Miešať to s LiDARom v jednej mape znamená, že polovica
      # mapy klame a nikde nie je vidieť, ktorá. Keď dlaždica chýba, build
      # radšej zlyhá s hláškou. (Späť sa dá zapnúť tým, že sa sem vráti
      # sťahovanie z copernicus-dem-30m.s3.amazonaws.com – viď história.)
      #
      # Z toho istého DEM vznikajú aj skalné plochy – husté vrstevnice sú len
      # obraz veľkého sklonu, takže sa počítajú priamo zo sklonu terénu.
      #
      # Robia sa PRED dlaždicami zámerne: obe idú na tú istú stránku a musia
      # sa zmestiť do jedného rozpočtu. Keď sa vrstevnice urobia prvé, vie
      # Planetiler dostať presne toľko miesta, koľko naozaj zvýšilo – inak by
      # sa build po hodine tilovania zabil na tom, že súčet je nad limitom.
      - name: Cache vrstevníc
        id: contours-cache
        if: ${{ inputs.contours }}
        uses: actions/cache@v4
        with:
          path: contours-out
          key: contours-v5-${{ needs.check-dem.outputs.demkey }}-${{ steps.region.outputs.bboxkey }}-i${{ inputs.contour_interval }}-z${{ inputs.contour_maxzoom }}-s${{ inputs.contour_smoothing }}-r${{ inputs.rocks }}${{ inputs.rock_slope }}p${{ inputs.rock_piece }}z${{ inputs.rock_res }}-${{ hashFiles('workers/contours.yml') }}

      # DEM dlaždice sú desiatky MB na kus a menia sa len vtedy, keď sa zmení
      # release – čo je presne to, čo hovorí `demkey`.
      - name: Cache DEM dlaždíc
        if: ${{ inputs.contours }}
        uses: actions/cache@v4
        with:
          path: dem/tiles
          key: demtiles-${{ needs.check-dem.outputs.demkey }}-${{ steps.region.outputs.bboxkey }}

      - name: Vrstevnice a skaly z DEM
        if: ${{ inputs.contours && steps.contours-cache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin libsqlite3-mod-spatialite zstd
          python3 -m pip install --quiet numpy
          # Stiahnuté DEM dlaždice majú vlastný adresár: medzivýsledky
          # (clip, slope…) sú tiež .tif a nesmú sa dostať do mozaiky.
          mkdir -p dem/tiles data contours-out

          BBOX='${{ steps.region.outputs.bbox }}'
          IFS=, read -r W S E N <<< "$BBOX"
          INTERVAL='${{ inputs.contour_interval }}'
          case "$INTERVAL" in ''|*[!0-9]*) INTERVAL=10 ;; esac
          # Dlaždice sú 1°×1°, pomenované podľa juhozápadného rohu
          # (konvencia SRTM): N49E019.
          python3 - "$W" "$S" "$E" "$N" > dem/list.txt <<'PY'
          import math, sys
          w, s, e, n = map(float, sys.argv[1:5])
          for lat in range(math.floor(s), math.floor(n) + 1):
              for lon in range(math.floor(w), math.floor(e) + 1):
                  ns, ew = ("N" if lat >= 0 else "S"), ("E" if lon >= 0 else "W")
                  print(f"{ns}{abs(lat):02d}{ew}{abs(lon):03d}")
          PY
          echo "DEM dlaždíc pre bbox: $(wc -l < dem/list.txt)"

          # Zoznam dlaždíc v release si vypýtame naraz – nemá zmysel skúšať
          # sťahovať to, čo tam nie je.
          SONNY_ASSETS=$(gh release view "$DEM_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --json assets -q '.assets[].name' 2>/dev/null || echo '')

          sonny_ok=0
          missing=""
          while IFS= read -r t; do
            if printf '%s\n' "$SONNY_ASSETS" | grep -qx "$t.tif" && \
               gh release download "$DEM_RELEASE" --repo "$GITHUB_REPOSITORY" \
                 --pattern "$t.tif" --dir dem/tiles --clobber >/dev/null 2>&1; then
              sonny_ok=$(( sonny_ok + 1 ))
            else
              missing="$missing $t"
            fi
          done < dem/list.txt

          DEM_USED=sonny
          if [ "$sonny_ok" -eq 0 ]; then
            echo "::error::V release $DEM_RELEASE nie je pre toto územie ani jedna dlaždica."
            echo "Zálohu z Copernicusu zámerne nepoužívame (je to model povrchu so stromami, nie terén)."
            echo "Spusti workflow 'Update DEM' s priečinkom, ktorý toto územie pokrýva – alebo mu vyplň direct_urls."
            exit 1
          fi
          if [ -n "$missing" ]; then
            # Bbox je obdĺžnik, produkt pokrýva krajinu – rohové bunky za
            # hranicou v ňom byť nemusia. Tam jednoducho nebude terén; radšej
            # diera, ktorú vidno, než výplň z modelu povrchu.
            echo "::warning::V release $DEM_RELEASE nie sú dlaždice:$missing – tam vrstevnice ani skaly nebudú. Ak to územie má mať terén, spusti 'Update DEM' s priečinkom, ktorý ho pokrýva."
          fi
          echo "Sonny's LiDAR DTM: $sonny_ok z $(wc -l < dem/list.txt) dlaždíc z release $DEM_RELEASE ✓"

          shopt -s nullglob
          tifs=(dem/tiles/*.tif)
          if [ ${#tifs[@]} -eq 0 ]; then
            echo "::error::Nepodarilo sa získať žiadnu DEM dlaždicu pre bbox $BBOX."
            exit 1
          fi
          echo "DEM dlaždíc k dispozícii: ${#tifs[@]} (zdroj: $DEM_USED)"

          # -resolution highest: dlaždice môžu mať rôznu mriežku (20m model má
          # obdĺžnikové pixely) – mozaika ide na to jemnejšie.
          gdalbuildvrt -q -resolution highest dem/all.vrt "${tifs[@]}"

          # Zjemnenie DEM pred trasovaním vrstevníc. Priemerovanie na hrubšiu
          # mriežku vyhladí šum, ale
          # zároveň zje detail terénu. Default 0 = žiadne zjemnenie, len orez
          # na bbox v plnom rozlíšení.
          SMOOTH='${{ inputs.contour_smoothing }}'
          case "$SMOOTH" in ''|*[!0-9.]*) SMOOTH=0 ;; esac
          if [ "${SMOOTH%%.*}" -gt 0 ] 2>/dev/null; then
            RES=$(python3 -c "print(f'{$SMOOTH / 3600:.8f}')")
            echo "Zjemnenie DEM: ${SMOOTH}″ (mriežka $RES°)"
            gdalwarp -q -overwrite -te "$W" "$S" "$E" "$N" \
              -tr "$RES" "$RES" -r average dem/all.vrt dem/clip.tif
          else
            echo "Zjemnenie DEM: vypnuté – vrstevnice sa trasujú z plného rozlíšenia."
            gdalwarp -q -overwrite -te "$W" "$S" "$E" "$N" dem/all.vrt dem/clip.tif
          fi

          gdal_contour -q -a ele -i "$INTERVAL" -f GPKG -nln contours \
            dem/clip.tif dem/raw.gpkg

          # `level` rozdelí vrstevnice na hlavné/polovičné/základné, aby sa
          # dali zapínať podľa zoomu a kresliť rôzne hrubo.
          ogr2ogr -f GPKG data/contours.gpkg dem/raw.gpkg -nln contours \
            -dialect SQLITE -sql "SELECT *, CASE
                 WHEN CAST(ele AS INTEGER) % 100 = 0 THEN 'major'
                 WHEN CAST(ele AS INTEGER) % 50  = 0 THEN 'mid'
                 ELSE 'minor' END AS level
               FROM contours WHERE ele IS NOT NULL"
          ls -lh data/contours.gpkg

          # ---------- skaly: najstrmšie úseky terénu ----------
          # Celý výpočet je vo workers/rock-areas.py – po častiach, aby sa
          # jemná mriežka zmestila do pamäte aj na disk. Bbox kraja má pri
          # 2 m vyše 3 miliardy buniek (~13 GB na jeden raster), takže naraz
          # sa to spočítať nedá.
          ROCK_SLOPE='${{ inputs.rock_slope }}'
          case "$ROCK_SLOPE" in ''|*[!0-9]*) ROCK_SLOPE=50 ;; esac
          ROCK_CLIFF=$(( ROCK_SLOPE + ROCK_CLIFF_PLUS ))
          RR='${{ inputs.rock_res }}'
          case "$RR" in ''|*[!0-9.]*) RR="$ROCK_RES" ;; esac
          RP='${{ inputs.rock_piece }}'
          case "$RP" in ''|*[!0-9.]*) RP=10 ;; esac

          make_empty_rock() {
            # Schéma na skaly odkazuje vždy, takže súbor musí existovať aj
            # vtedy, keď sa žiadna skala nenašla alebo sú vypnuté.
            echo '{"type":"FeatureCollection","features":[]}' > dem/empty.geojson
            ogr2ogr -f GPKG data/rock.gpkg dem/empty.geojson -nln rock -overwrite \
              -nlt POLYGON -a_srs EPSG:4326 -lco GEOMETRY_NAME=geom
          }

          if [ '${{ inputs.rocks }}' = 'true' ]; then
            if [ "${RP%%.*}" -gt 0 ] 2>/dev/null; then
              PIECE_MSG="kúsky ${RP}×${RP} m"
            else
              PIECE_MSG="súvislé plochy"
            fi

            # Hotové skaly pre tento región a tieto nastavenia sú v release –
            # nastavenia sú v mene assetu, takže sa nikdy nepomiešajú. Výpočet
            # je na desiatky minút, stiahnutie na sekundy.
            ROCK_ASSET="rock-${{ steps.region.outputs.key }}-s${ROCK_SLOPE}-p${RP}-r${RR}.gpkg.zst"
            ROCK_READY=""
            if [ '${{ inputs.rocks_rebuild }}' = 'true' ]; then
              echo "rocks_rebuild=áno – skaly sa počítajú nanovo."
            elif gh release download "$ROCK_RELEASE" --repo "$GITHUB_REPOSITORY" \
                   --pattern "$ROCK_ASSET" --dir /tmp --clobber >/dev/null 2>&1; then
              unzstd -q -f -o data/rock.gpkg "/tmp/$ROCK_ASSET" && ROCK_READY=1
              [ -n "$ROCK_READY" ] && echo "Skaly z releasu $ROCK_RELEASE ✓ ($ROCK_ASSET)"
            fi

            if [ -z "$ROCK_READY" ]; then
              echo "::group::Skaly – sklon ≥ ${ROCK_SLOPE}° (steny od ${ROCK_CLIFF}°), mriežka ${RR} m, ${PIECE_MSG}"
              # Skaly sú bonus nad vrstevnicami: keby ich výpočet zlyhal (alebo
              # v rovine nič nenašiel), nemá to zhodiť hodinový build.
              if python3 workers/rock-areas.py --dem=dem/all.vrt --bbox="$BBOX" \
                   --res="$RR" --slope="$ROCK_SLOPE" --cliff="$ROCK_CLIFF" \
                   --min-area="$ROCK_MIN_AREA" --simplify="$ROCK_SIMPLIFY" \
                   --piece="$RP" --piece-fill="$ROCK_PIECE_FILL" \
                   --chunk-cells="$ROCK_CHUNK_CELLS" --out=data/rock.gpkg; then
                ls -lh data/rock.gpkg
                # Ulož ich, nech ich nabudúce netreba počítať znova.
                zstd -q -19 -T0 -f -o "/tmp/$ROCK_ASSET" data/rock.gpkg
                gh release view "$ROCK_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
                  gh release create "$ROCK_RELEASE" --repo "$GITHUB_REPOSITORY" \
                    --title "Skalné plochy z DEM" \
                    --notes "Vektorové skaly počítané zo sklonu Sonny DEM. Meno assetu nesie región a nastavenia (prah sklonu, veľkosť kúska, mriežka)." || true
                gh release upload "$ROCK_RELEASE" "/tmp/$ROCK_ASSET" \
                  --repo "$GITHUB_REPOSITORY" --clobber \
                  && echo "Uložené do releasu $ROCK_RELEASE ako $ROCK_ASSET" \
                  || echo "::warning::Skaly sa nepodarilo uložiť do releasu."
              else
                echo "::warning::Skalné plochy sa nevygenerovali – vrstva bude prázdna."
                make_empty_rock
              fi
              echo "::endgroup::"
            fi
          else
            make_empty_rock
            echo "Skaly: vypnuté (prázdna vrstva)."
          fi

          CZ='${{ inputs.contour_maxzoom }}'
          case "$CZ" in ''|*[!0-9]*) CZ=14 ;; esac
          if [ "$CZ" -gt 16 ]; then CZ=16; fi

          # Vrstevnice a mapa idú na tú istú stránku, takže si rozpočet delia.
          # Viac než ~40 % naň nesmú zobrať, inak by na mapu ostalo tak málo,
          # že by sa musela orezať o niekoľko zoomov. Prepočet z hotového GPKG
          # je lacný (sekundy), na rozdiel od sťahovania DEM.
          LIMIT_MB='${{ inputs.size_limit_mb }}'
          case "$LIMIT_MB" in ''|*[!0-9]*) LIMIT_MB=900 ;; esac
          CBUDGET_MB=$(( LIMIT_MB * 40 / 100 ))

          while : ; do
            java -Xmx5g -jar planetiler.jar generate-custom \
              --schema=workers/contours.yml \
              --output=contours-out/contours.pmtiles \
              --maxzoom="$CZ" --render_maxzoom="$CZ" \
              --simplify_tolerance_at_max_zoom=0 \
              --min_feature_size_at_max_zoom=0 \
              --force

            CMB=$(( $(stat -c%s contours-out/contours.pmtiles) / 1048576 ))
            echo "Vrstevnice maxzoom $CZ → ${CMB} MB (strop ${CBUDGET_MB} MB)"
            [ "$CMB" -le "$CBUDGET_MB" ] && break

            if [ "$CZ" -le 10 ]; then
              echo "::warning::Vrstevnice majú ${CMB} MB ani pri maxzoome 10 – zvýš contour_interval (napr. 20 m) alebo ich pre toto územie vypni."
              break
            fi
            CZ=$(( CZ - 1 ))
            echo "::warning::Vrstevnice sú nad stropom ${CBUDGET_MB} MB – skúšam maxzoom ${CZ}."
          done

          # Skutočne použitý maxzoom si odloží aj cache, nech štýl vie, po
          # ktorý zoom vrstevnice naozaj existujú. To isté platí pre zdroj
          # výšok (ide do atribúcie mapy) a prah sklonu skál (do manifestu).
          echo "$CZ" > contours-out/maxzoom.txt
          echo "$DEM_USED" > contours-out/dem-source.txt
          if [ '${{ inputs.rocks }}' = 'true' ]; then
            echo "$ROCK_SLOPE" > contours-out/rock-slope.txt
          else
            echo "off" > contours-out/rock-slope.txt
          fi
          ls -lh contours-out/

      - name: Zaraď vrstevnice do webu
        id: contours
        if: ${{ inputs.contours }}
        run: |
          set -euo pipefail
          mkdir -p _site/tiles
          SRC=contours-out/contours.pmtiles
          if [ ! -s "$SRC" ]; then
            echo "::warning::Vrstevnice sa nevygenerovali – mapa pôjde bez nich."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp "$SRC" "_site/tiles/${{ steps.region.outputs.key }}-contours.pmtiles"
          # Maxzoom berieme z toho, čo sa naozaj vygenerovalo (mohol sa znížiť
          # kvôli veľkosti); ak súbor chýba, padáme späť na vstup.
          CZ=$(cat contours-out/maxzoom.txt 2>/dev/null || echo '')
          case "$CZ" in ''|*[!0-9]*) CZ='${{ inputs.contour_maxzoom }}' ;; esac
          case "$CZ" in ''|*[!0-9]*) CZ=14 ;; esac
          if [ "$CZ" -gt 16 ]; then CZ=16; fi
          # Zdroj výšok a prah sklonu skál si nesie cache spolu s dlaždicami –
          # pri cache hite sa krok s DEM vôbec nespustí.
          DEM_USED=$(cat contours-out/dem-source.txt 2>/dev/null || echo '')
          case "$DEM_USED" in sonny|copernicus) ;; *) DEM_USED=sonny ;; esac
          RSLOPE=$(cat contours-out/rock-slope.txt 2>/dev/null || echo off)
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "maxzoom=$CZ" >> "$GITHUB_OUTPUT"
          echo "dem_source=$DEM_USED" >> "$GITHUB_OUTPUT"
          echo "rock_slope=$RSLOPE" >> "$GITHUB_OUTPUT"
          echo "size_mb=$(( $(stat -c%s "$SRC") / 1048576 ))" >> "$GITHUB_OUTPUT"
          echo "Vrstevnice do z$CZ, výšky: $DEM_USED, skaly: $RSLOPE"
          ls -lh "_site/tiles/${{ steps.region.outputs.key }}-contours.pmtiles"

      # ---------- tieňovanie reliéfu a 3D terén ----------
      # MapLibre nevie čítať výšky z GeoTIFFu – potrebuje pyramídu PNG dlaždíc
      # (kódovanie terrarium). Robia sa z toho istého Sonny DEM ako vrstevnice,
      # aby 3D reliéf nedvíhal koruny stromov, kým vrstevnice vedú po zemi.
      #
      # Sú drahé na výpočet, ale závisia len od územia – preto sa raz uložia
      # do releasu `dem-terrain` ako jeden .tar.zst a nabudúce sa len stiahnu.
      # `terrain_rebuild` ich prepíše nanovo.
      - name: Cache výškových dlaždíc
        id: terrain-cache
        if: ${{ inputs.terrain }}
        uses: actions/cache@v4
        with:
          path: terrain-out
          key: terrain-v1-${{ needs.check-dem.outputs.demkey }}-${{ steps.region.outputs.bboxkey }}-z${{ inputs.terrain_maxzoom }}

      - name: Tieňovanie reliéfu (PNG dlaždice zo Sonnyho)
        id: terrain
        if: ${{ inputs.terrain }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TZ='${{ inputs.terrain_maxzoom }}'
          case "$TZ" in ''|*[!0-9]*) TZ=13 ;; esac
          BBOX='${{ steps.region.outputs.bbox }}'
          ASSET="terrain-${{ steps.region.outputs.key }}-z${TZ}.tar.zst"
          REBUILD='${{ inputs.terrain_rebuild }}'

          have_tiles() { [ -d terrain-out ] && [ -n "$(ls -A terrain-out 2>/dev/null)" ]; }

          if [ "$REBUILD" = 'true' ]; then
            echo "terrain_rebuild=áno – dlaždice sa počítajú nanovo."
            rm -rf terrain-out
          elif have_tiles; then
            echo "Výškové dlaždice sú v cache behu ✓"
          else
            # Skús release – uložené dlaždice sú lacnejšie než ich prepočítať.
            if gh release download "$TERRAIN_RELEASE" --repo "$GITHUB_REPOSITORY" \
                 --pattern "$ASSET" --dir /tmp --clobber >/dev/null 2>&1; then
              mkdir -p terrain-out
              tar --use-compress-program=unzstd -xf "/tmp/$ASSET" -C terrain-out
              echo "Výškové dlaždice stiahnuté z releasu $TERRAIN_RELEASE ✓"
            fi
          fi

          if ! have_tiles; then
            if [ ! -s dem/all.vrt ]; then
              echo "::warning::DEM nie je k dispozícii (vrstevnice sa brali z cache) – tieňovanie sa preskočí."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sudo apt-get install -y -qq zstd >/dev/null 2>&1 || true
            python3 -m pip install --quiet numpy
            echo "::group::Výškové dlaždice do z$TZ"
            python3 workers/build-terrain.py --dem=dem/all.vrt --bbox="$BBOX" \
              --minzoom=5 --maxzoom="$TZ" --out=terrain-out
            echo "$TZ" > terrain-out/maxzoom.txt
            echo "::endgroup::"

            # Ulož do releasu, nech ich nabudúce netreba počítať znova.
            tar --use-compress-program='zstd -19 -T0' -cf "/tmp/$ASSET" -C terrain-out .
            gh release view "$TERRAIN_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
              gh release create "$TERRAIN_RELEASE" --repo "$GITHUB_REPOSITORY" \
                --title "Výškové dlaždice (tieňovanie a 3D terén)" \
                --notes "Terrarium PNG dlaždice zo Sonny's LiDAR DTM. Jeden .tar.zst na región a maxzoom; vyrába ich workflow Build map." || true
            gh release upload "$TERRAIN_RELEASE" "/tmp/$ASSET" \
              --repo "$GITHUB_REPOSITORY" --clobber \
              && echo "Uložené do releasu $TERRAIN_RELEASE ako $ASSET" \
              || echo "::warning::Výškové dlaždice sa nepodarilo uložiť do releasu."
          fi

          TZ=$(cat terrain-out/maxzoom.txt 2>/dev/null || echo "$TZ")
          mkdir -p _site/terrain
          find terrain-out -mindepth 1 -maxdepth 1 -type d -exec cp -r {} _site/terrain/ \;
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "maxzoom=$TZ" >> "$GITHUB_OUTPUT"
          echo "Výškové dlaždice: $(find _site/terrain -name '*.png' | wc -l) ks do z$TZ, $(du -sm _site/terrain | cut -f1) MB"

      # Hotové skaly a vrstevnice ako artefakt – na stiahnutie a prezretie
      # v QGISe, bez čakania na ďalší build. 90 dní je maximum, ktoré GitHub
      # pre artefakty dovolí.
      - name: Odlož skaly a vrstevnice ako artefakt
        if: ${{ inputs.contours && hashFiles('data/rock.gpkg') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: teren-${{ steps.region.outputs.key }}-s${{ inputs.rock_slope }}-p${{ inputs.rock_piece }}
          path: |
            data/rock.gpkg
            data/contours.gpkg
            contours-out/contours.pmtiles
          retention-days: 90
          compression-level: 9
          if-no-files-found: ignore

      - name: PBF → PMTiles (Planetiler, OpenMapTiles schéma)
        id: tiles
        run: |
          set -euo pipefail
          mkdir -p _site/tiles
          OUT="_site/tiles/${{ steps.region.outputs.key }}.pmtiles"

          # Planetiler: PlanetilerConfig.MAX_MAXZOOM = 16 → vyššie hodnoty
          # zhodia build s "Max zoom must be <= 16". Radšej orežeme s hláškou.
          MAXZOOM='${{ inputs.maxzoom }}'
          case "$MAXZOOM" in ''|*[!0-9]*) MAXZOOM=16 ;; esac
          if [ "$MAXZOOM" -gt 16 ]; then
            echo "::warning::Planetiler vie vygenerovať dlaždice najviac po zoom 16 (zadané: $MAXZOOM). Používam 16 – priblíženie až na z20 zabezpečí overzoom v MapLibre."
            MAXZOOM=16
          fi
          if [ "$MAXZOOM" -lt 8 ]; then MAXZOOM=8; fi

          # Rozpočet je na CELÚ stránku, nielen na tieto dlaždice: Pages zvládne
          # ~1 GB a do toho sa musia zmestiť aj vrstevnice, fonty a sprity.
          # Vrstevnice sú už v _site, fonty a sprity pribudnú neskôr – na tie
          # sa nechá rezerva.
          LIMIT_MB='${{ inputs.size_limit_mb }}'
          case "$LIMIT_MB" in ''|*[!0-9]*) LIMIT_MB=900 ;; esac
          RESERVE_MB=40
          USED_MB=$(du -sm _site 2>/dev/null | cut -f1 || echo 0)
          BUDGET_MB=$(( LIMIT_MB - USED_MB - RESERVE_MB ))
          echo "Rozpočet stránky ${LIMIT_MB} MB − obsadené ${USED_MB} MB − rezerva ${RESERVE_MB} MB = ${BUDGET_MB} MB na dlaždice"

          if [ "$BUDGET_MB" -lt 50 ]; then
            echo "::error::Na dlaždice zostáva len ${BUDGET_MB} MB – ${USED_MB} MB už zaberajú vrstevnice. Zväčš contour_interval, zníž contour_maxzoom, vypni contours alebo zdvihni size_limit_mb."
            exit 1
          fi
          if [ "$USED_MB" -gt $(( LIMIT_MB / 2 )) ]; then
            echo "::warning::Vrstevnice zaberajú ${USED_MB} MB z rozpočtu ${LIMIT_MB} MB – na mapu ostáva málo. Zvážiť sa dá contour_interval 20 alebo contour_maxzoom 12."
          fi
          LIMIT=$(( BUDGET_MB * 1024 * 1024 ))

          Z=$MAXZOOM
          while : ; do
            echo "::group::Planetiler – maxzoom $Z"
            java -Xmx5g -jar planetiler.jar \
              --osm-path=data/region.osm.pbf \
              --output="$OUT" \
              --download --download-dir=data/sources \
              --minzoom=0 \
              --maxzoom="$Z" \
              --render_maxzoom="$Z" \
              --min_feature_size_at_max_zoom=0 \
              --simplify_tolerance_at_max_zoom=0 \
              --transportation_z13_paths=true \
              --building_merge_z13=false \
              --languages=sk,en \
              --force
            echo "::endgroup::"

            BYTES=$(stat -c%s "$OUT")
            MB=$(( BYTES / 1048576 ))
            echo "maxzoom $Z → ${MB} MB (na dlaždice je ${BUDGET_MB} MB)"

            if [ "$BYTES" -le "$LIMIT" ]; then break; fi

            if [ '${{ inputs.auto_shrink }}' != 'true' ] || [ "$Z" -le 12 ]; then
              echo "::error::Dlaždice majú ${MB} MB, na stránku sa ich zmestí ${BUDGET_MB} MB (rozpočet ${LIMIT_MB} MB, vrstevnice ${USED_MB} MB). Možnosti: zníž maxzoom, vyber menší región, použi crop_bbox alebo uber vrstevniciam."
              exit 1
            fi

            # O koľko zoomov ísť dolu: každý nižší zoom zmenší dlaždice zhruba
            # 3,5×. Skákať po jednom by pri celom Slovensku znamenalo aj tri
            # hodinové behy Planetileru za sebou; naraz ale ideme najviac o dva,
            # nech sa detail nezahodí zbytočne.
            DROP=1
            EST=$MB
            while [ "$DROP" -lt 2 ] && [ $(( EST * 10 / 35 )) -gt "$BUDGET_MB" ]; do
              EST=$(( EST * 10 / 35 ))
              DROP=$(( DROP + 1 ))
            done
            NEXT=$(( Z - DROP ))
            if [ "$NEXT" -lt 12 ]; then NEXT=12; fi
            echo "::warning::${MB} MB je nad rozpočtom ${BUDGET_MB} MB – skúšam maxzoom ${NEXT}."
            Z=$NEXT
          done

          echo "maxzoom=$Z" >> "$GITHUB_OUTPUT"
          echo "size_mb=$(( $(stat -c%s "$OUT") / 1048576 ))" >> "$GITHUB_OUTPUT"
          ls -lh _site/tiles/

      - name: Cache glyfov a spritov
        uses: actions/cache@v4
        with:
          path: |
            _site/fonts
            _site/sprites
          key: assets-${{ hashFiles('poc/web/icon-sources.js', 'workers/build-sdf-sprite.mjs') }}-${{ env.GLYPHS_ZIP }}

      - name: Stiahni a priprav sady ikoniek
        id: sprite
        run: |
          set -uo pipefail
          mkdir -p _site/sprites /tmp/icons

          # Cache: hotové sprity sa nemenia, kým sa nezmení zoznam zdrojov ani
          # generátor – v kľúči je hash oboch.
          # find, nie ls: `ls vzor*` bez zhody končí kódom 2 a `pipefail`
          # by ním zhodil celý krok (find nad existujúcim adresárom vráti 0).
          CACHED_SPRITES=$(find _site/sprites -maxdepth 1 -name '*.json' | wc -l)

          # Zoznam zdrojov je v poc/web/icon-sources.js – jedno miesto pre web
          # aj pipeline. Z každého sa vyrobí SDF sprite: symboly bez koliesok
          # a podkladov, ktorým sa dá nastaviť farba.
          node -e "
            import('./poc/web/icon-sources.js').then((m) => {
              for (const s of m.ICON_SOURCES) console.log(s.id + ' ' + s.sprite);
            });
          " > /tmp/icons/list.txt
          cat /tmp/icons/list.txt

          ok=""
          while read -r id url; do
            [ -n "$id" ] || continue
            if [ "$CACHED_SPRITES" -gt 0 ] && [ -s "_site/sprites/$id.json" ]; then
              echo "── $id (z cache)"
              ok="$ok $id"
              continue
            fi
            echo "── $id"
            got=1
            for ext in .json .png; do
              curl -fL --retry 4 --retry-delay 5 -o "/tmp/icons/$id$ext" "$url$ext" || got=0
            done
            # @2x je voliteľné – bez neho mapa funguje, len je na retine mäkšia.
            for ext in '@2x.json' '@2x.png'; do
              curl -fL --retry 2 --retry-delay 3 -o "/tmp/icons/$id$ext" "$url$ext" \
                || rm -f "/tmp/icons/$id$ext"
            done
            if [ "$got" != 1 ]; then
              echo "::warning::Sadu ikoniek $id sa nepodarilo stiahnuť – preskakujem."
              continue
            fi
            if node workers/build-sdf-sprite.mjs --in="/tmp/icons/$id" --out="_site/sprites/$id"; then
              ok="$ok $id"
            else
              echo "::warning::Sadu ikoniek $id sa nepodarilo prerobiť na SDF – preskakujem."
            fi
          done < /tmp/icons/list.txt

          if [ -z "$ok" ]; then
            echo "::error::Nepodarilo sa pripraviť ani jednu sadu ikoniek – mapa by bola bez ikon."
            exit 1
          fi

          # Ktorú sadu má použiť štýl, hovoria úpravy z developer módu.
          WANT=$(node -e "
            Promise.all([import('./poc/web/themes.js'), import('node:fs')]).then(([m, fs]) => {
              let raw = {};
              try { raw = JSON.parse(fs.readFileSync('poc/web/style-overrides.json', 'utf8')); } catch {}
              console.log(m.selectedIconSource(m.normalizeOverrides(raw).overrides));
            });
          ")
          if [ ! -s "_site/sprites/$WANT.json" ]; then
            WANT=$(echo $ok | awk '{print $1}')
            echo "::warning::Zvolená sada ikoniek nie je k dispozícii – používam $WANT."
          fi
          echo "name=$WANT" >> "$GITHUB_OUTPUT"
          echo "available=$(echo $ok | xargs)" >> "$GITHUB_OUTPUT"
          echo "Nasadené sady:$ok, štýl použije $WANT"

      - name: Stiahni glyfy (fonty) k sebe na Pages
        run: |
          set -euo pipefail
          mkdir -p _site/fonts
          if [ -n "$(ls -A _site/fonts 2>/dev/null)" ]; then
            echo "Glyfy z cache ✓"
          elif curl -fL --retry 4 --retry-delay 5 -o /tmp/glyphs.zip "$GLYPHS_ZIP"; then
            unzip -q /tmp/glyphs.zip -d /tmp/glyphs

            # Fontstack = adresár, ktorý obsahuje 0-255.pbf. Presné mená
            # adresárov v balíku sa môžu líšiť, preto vyberáme postupne:
            # 1) presne to, čo štýl chce, 2) čokoľvek "Noto Sans", 3) všetko.
            mapfile -t stacks < <(find /tmp/glyphs -name '0-255.pbf' -printf '%h\n' | sort -u)
            echo "V balíku je ${#stacks[@]} fontstackov."

            copy_matching() { # $1 = grep -E vzor na názov adresára
              local copied=0 d
              for d in "${stacks[@]}"; do
                if printf '%s' "$(basename "$d")" | grep -qiE "$1"; then
                  cp -r "$d" _site/fonts/ && copied=$(( copied + 1 ))
                fi
              done
              [ "$copied" -gt 0 ]
            }

            copy_matching '^Noto Sans (Regular|Bold|Italic)$' \
              || copy_matching 'noto.?sans' \
              || cp -r "${stacks[@]}" _site/fonts/ 2>/dev/null \
              || true
          else
            echo "::warning::Balík glyfov sa nepodarilo stiahnuť."
          fi

          if [ -z "$(ls -A _site/fonts 2>/dev/null)" ]; then
            echo "::warning::Lokálne glyfy nie sú k dispozícii – štýl použije fonts.openmaptiles.org (ak služba vypadne, mapa bude bez nápisov)."
          else
            du -sh _site/fonts
            ls _site/fonts
          fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Vygeneruj statické style.json (web + iOS)
        run: |
          node workers/build-styles.mjs \
            --base-url='${{ steps.pages.outputs.base_url }}' \
            --region='${{ steps.region.outputs.key }}' \
            --name='${{ steps.region.outputs.name }}' \
            --maxzoom='${{ steps.tiles.outputs.maxzoom }}' \
            --contours='${{ steps.contours.outputs.enabled || 'false' }}' \
            --contours-maxzoom='${{ steps.contours.outputs.maxzoom || '14' }}' \
            --dem-source='${{ steps.contours.outputs.dem_source || 'sonny' }}' \
            ${{ steps.terrain.outputs.enabled == 'true' && format('--dem-tiles={0}/terrain/{{z}}/{{x}}/{{y}}.png --dem-maxzoom={1}', steps.pages.outputs.base_url, steps.terrain.outputs.maxzoom) || '' }} \
            --sprites-dir=_site/sprites \
            --overrides=poc/web/style-overrides.json \
            --fonts-dir=_site/fonts \
            --out=_site/styles

      - name: Dopeč vzory plôch a čiar do spritu
        run: |
          # Vzory z developer módu sú generované z predpisu v názve obrázka.
          # Web si ich dokreslí sám, statický štýl pre iOS ich potrebuje
          # priamo v sprite.
          for id in ${{ steps.sprite.outputs.available }}; do
            node workers/add-sprite-patterns.mjs \
              --sprite="_site/sprites/$id" --styles=_site/styles
          done

      - name: Poskladaj web (viewer + manifest)
        run: |
          set -euo pipefail
          cp poc/web/index.html poc/web/app.js poc/web/themes.js \
             poc/web/devmode.js poc/web/patterns.js poc/web/icon-sources.js \
             poc/web/style-overrides.json _site/

          BASE='${{ steps.pages.outputs.base_url }}'
          BASE="${BASE%/}"
          if [ -d _site/fonts ] && [ -n "$(ls -A _site/fonts)" ]; then
            GLYPHS="$BASE/fonts/{fontstack}/{range}.pbf"
          else
            GLYPHS="https://fonts.openmaptiles.org/{fontstack}/{range}.pbf"
          fi

          jq -n \
            --arg region '${{ steps.region.outputs.key }}' \
            --arg name '${{ steps.region.outputs.name }}' \
            --arg bbox '${{ steps.region.outputs.bbox }}' \
            --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg glyphs "$GLYPHS" \
            --arg sprite "$BASE/sprites/${{ steps.sprite.outputs.name }}" \
            --argjson icon_sources "$(node -e "
              import('./poc/web/icon-sources.js').then((m) => {
                const ok = '${{ steps.sprite.outputs.available }}'.split(/\s+/).filter(Boolean);
                console.log(JSON.stringify(m.ICON_SOURCES.filter((s) => ok.includes(s.id))
                  .map((s) => ({ id: s.id, label: s.label, sprite: 'sprites/' + s.id,
                                 license: s.license, source: s.source, suffix: s.suffix, note: s.note }))));
              });
            ")" \
            --argjson maxzoom '${{ steps.tiles.outputs.maxzoom }}' \
            --argjson size_mb '${{ steps.tiles.outputs.size_mb }}' \
            --argjson contours '${{ steps.contours.outputs.enabled || 'false' }}' \
            --argjson cmaxzoom '${{ steps.contours.outputs.maxzoom || '14' }}' \
            --argjson cinterval '${{ inputs.contour_interval || '10' }}' \
            --arg demsource '${{ steps.contours.outputs.dem_source || 'sonny' }}' \
            --arg dem '${{ steps.terrain.outputs.enabled == 'true' && format('{0}/terrain/{{z}}/{{x}}/{{y}}.png', steps.pages.outputs.base_url) || '' }}' \
            --argjson demmaxzoom '${{ steps.terrain.outputs.maxzoom || 15 }}' \
            --arg rockslope '${{ steps.contours.outputs.rock_slope || 'off' }}' \
            '{
              default_region: $region,
              built_at: $built,
              maxzoom: $maxzoom,
              glyphs: $glyphs,
              sprite: $sprite,
              icon_sources: $icon_sources,
              default_icons: "${{ steps.sprite.outputs.name }}",
              dem: $dem,
              dem_maxzoom: $demmaxzoom,
              regions: {
                ($region): ({
                  name: $name,
                  bbox: ($bbox | split(",") | map(tonumber)),
                  pmtiles: ("tiles/" + $region + ".pmtiles"),
                  maxzoom: $maxzoom,
                  size_mb: $size_mb
                } + (if $contours then {
                  contours: ("tiles/" + $region + "-contours.pmtiles"),
                  contours_maxzoom: $cmaxzoom,
                  contour_interval: $cinterval,
                  dem_source: $demsource
                } + (if $rockslope == "off" then {} else { rock_slope: ($rockslope | tonumber) } end)
                else {} end))
              }
            }' > _site/tiles/manifest.json
          cat _site/tiles/manifest.json

      - name: Skontroluj, že štýl odkazuje len na existujúce súbory
        run: |
          set -euo pipefail
          fail=0
          shopt -s nullglob
          styles=(_site/styles/*.json)
          if [ ${#styles[@]} -eq 0 ]; then
            echo "::error::v _site/styles nie sú žiadne štýly"
            exit 1
          fi
          STYLE="${styles[0]}"
          echo "Kontrolujem $STYLE"

          # sprite (ten, na ktorý štýl naozaj odkazuje)
          SPRITE='${{ steps.sprite.outputs.name }}'
          for ext in .json .png; do
            [ -s "_site/sprites/$SPRITE$ext" ] || { echo "::error::chýba sprites/$SPRITE$ext"; fail=1; }
          done

          # glyfy – iba ak si ich hostíme sami.
          # Názvy fontstackov obsahujú medzery ("Noto Sans Regular"), preto read -r.
          if jq -e '.glyphs | contains("openmaptiles.org") | not' "$STYLE" >/dev/null; then
            while IFS= read -r stack; do
              if [ ! -s "_site/fonts/$stack/0-255.pbf" ]; then
                echo "::error::štýl používa fontstack '$stack', ale _site/fonts/$stack/0-255.pbf neexistuje"
                fail=1
              fi
            done < <(jq -r '[.layers[].layout["text-font"] // empty] | flatten | unique | .[]' "$STYLE")
          fi

          # ikonky – pevne zadané mená ikon musia byť v sprite (mená skladané
          # výrazom sa generujú priamo zo sprite indexu, tie kontrolovať netreba)
          while IFS= read -r icon; do
            [ -n "$icon" ] || continue
            jq -e --arg i "$icon" 'has($i)' "_site/sprites/$SPRITE.json" >/dev/null \
              || { echo "::error::štýl odkazuje na ikonu '$icon', ktorá v sprite nie je"; fail=1; }
          done < <(jq -r '[.layers[].layout["icon-image"]? | strings] | unique | .[]' "$STYLE")

          # vzory plôch a čiar musia byť v sprite (inak sa plocha nevykreslí)
          while IFS= read -r img; do
            [ -n "$img" ] || continue
            jq -e --arg i "$img" 'has($i)' "_site/sprites/$SPRITE.json" >/dev/null \
              || { echo "::error::štýl používa vzor '$img', ktorý v sprite nie je"; fail=1; }
          done < <(jq -r '[.layers[].paint["fill-pattern"]?, .layers[].paint["line-pattern"]? | strings] | unique | .[]' "$STYLE")

          # dlaždice
          PM="_site/tiles/${{ steps.region.outputs.key }}.pmtiles"
          [ -s "$PM" ] || { echo "::error::chýba $PM"; fail=1; }

          # vrstevnice, ak ich štýl používa
          if jq -e '.sources.contours' "$STYLE" >/dev/null; then
            CPM="_site/tiles/${{ steps.region.outputs.key }}-contours.pmtiles"
            [ -s "$CPM" ] || { echo "::error::štýl používa vrstevnice, ale chýba $CPM"; fail=1; }
          fi

          # Poistka na koniec: rozpočet drží krok pri dlaždiciach, tu sa už len
          # overí, že súčet naozaj sedí (Pages zvládne ~1 GB na celú stránku).
          LIMIT_MB='${{ inputs.size_limit_mb }}'
          case "$LIMIT_MB" in ''|*[!0-9]*) LIMIT_MB=900 ;; esac
          TOTAL_MB=$(du -sm _site | cut -f1)
          echo "Veľkosť _site: ${TOTAL_MB} MB (rozpočet ${LIMIT_MB} MB)"
          du -sm _site/tiles _site/fonts _site/sprites 2>/dev/null || true
          if [ "$TOTAL_MB" -gt "$LIMIT_MB" ]; then
            echo "::error::_site má ${TOTAL_MB} MB, rozpočet je ${LIMIT_MB} MB (GitHub Pages zvládne ~1 GB). Zníž maxzoom, vypni contours, zväčš contour_interval alebo použi menší región / crop_bbox."
            fail=1
          fi
          exit $fail

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test nasadenej mapy
        run: |
          set -uo pipefail
          BASE='${{ steps.deployment.outputs.page_url }}'
          BASE="${BASE%/}"
          REGION='${{ steps.region.outputs.key }}'
          fail=0

          check() { # $1 = URL, $2 = očakávaný kód, $3 = popis, $4 = extra curl args
            for attempt in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' ${4:-} "$1" || echo 000)
              [ "$code" = "$2" ] && break
              sleep $(( attempt * 5 ))
            done
            if [ "$code" = "$2" ]; then
              echo "  ✓ $3 ($code)"
            else
              echo "::error::$3 vrátilo HTTP $code (očakávané $2) – $1"
              fail=1
            fi
          }

          echo "Kontrolujem $BASE"
          check "$BASE/tiles/manifest.json" 200 "manifest.json"
          SPRITE='${{ steps.sprite.outputs.name }}'
          check "$BASE/sprites/$SPRITE.json" 200 "sprite index"
          check "$BASE/sprites/$SPRITE.png" 200 "sprite bitmapa"
          check "$BASE/styles/$REGION-svetla.json" 200 "style.json"
          check "$BASE/style-overrides.json" 200 "úpravy štýlu z developer módu"

          GLYPHS=$(curl -s "$BASE/tiles/manifest.json" | jq -r '.glyphs')
          case "$GLYPHS" in
            "$BASE"*) check "$BASE/fonts/Noto%20Sans%20Regular/0-255.pbf" 200 "glyfy" ;;
            *) echo "  ℹ glyfy sú externé: $GLYPHS" ;;
          esac

          # PMTiles sa číta HTTP Range requestmi – bez 206 sa mapa nenačíta.
          check "$BASE/tiles/$REGION.pmtiles" 206 "pmtiles (Range request)" "-H Range:bytes=0-1023"

          if [ '${{ steps.contours.outputs.enabled }}' = 'true' ]; then
            check "$BASE/tiles/$REGION-contours.pmtiles" 206 "vrstevnice (Range request)" "-H Range:bytes=0-1023"
          fi

          exit $fail
