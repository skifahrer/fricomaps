name: Build map (PBF → PMTiles) & deploy Pages

# Stiahne PBF export IBA zvoleného regiónu:
#   1. primárne z osm.fr regionálnych exportov
#      (https://download.openstreetmap.fr/extracts/ – Európa aj svet,
#      rezané po administratívnych hraniciach, denne aktualizované),
#   2. fallback: asset releasu `osm-extracts` (vyrába workflow
#      "Update OSM extracts").
# Potom Planetiler → PMTiles → GitHub Pages.
#
# Ľubovoľný iný región Európy/sveta: vyplň input `custom_pbf_url`
# (URL na .osm.pbf z download.openstreetmap.fr/extracts/...) + `custom_name`.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Región (ignoruje sa, ak je vyplnené custom_pbf_url)"
        required: true
        default: slovensko
        type: choice
        options:
          - slovensko
          - bratislavsky
          - trnavsky
          - trenciansky
          - nitriansky
          - zilinsky
          - banskobystricky
          - presovsky
          - kosicky
      maxzoom:
        description: "Maximálny zoom dlaždíc (14 = štandard, menej = menší súbor)"
        required: false
        default: "14"
        type: string
      custom_pbf_url:
        description: "Vlastný región – URL .osm.pbf (napr. https://download.openstreetmap.fr/extracts/europe/austria.osm.pbf)"
        required: false
        default: ""
        type: string
      custom_name:
        description: "Vlastný región – zobrazované meno (napr. Rakúsko)"
        required: false
        default: ""
        type: string
      custom_bbox:
        description: "Vlastný región – bbox west,south,east,north (voliteľné, inak sa prečíta z PBF hlavičky)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  OSMFR_BASE: https://download.openstreetmap.fr/extracts

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GITHUB_TOKEN nemá admin práva na vytvorenie Pages site, preto sa
      # Pages musí zapnúť raz ručne: Settings → Pages → Source: GitHub Actions.
      # Kontrola hneď na začiatku, aby build nezlyhal až po konverzii dlaždíc.
      - name: Over, že GitHub Pages je zapnuté
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "::error::GitHub Pages nie je zapnuté. Zapni ho ručne: Settings → Pages → Build and deployment → Source: 'GitHub Actions' a spusti workflow znova."
            exit 1
          fi
          echo "Pages je zapnuté ✓"

      - name: Stiahni PBF iba daného regiónu
        id: region
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          CUSTOM_URL='${{ inputs.custom_pbf_url }}'

          download() { # $1 = URL
            echo "Skúšam: $1"
            curl -fL --retry 3 --retry-delay 5 -o data/region.osm.pbf "$1"
          }

          if [ -n "$CUSTOM_URL" ]; then
            # ----- vlastný región (Európa / svet) -----
            NAME='${{ inputs.custom_name }}'
            [ -n "$NAME" ] || NAME=$(basename "$CUSTOM_URL" .osm.pbf)
            KEY=$(echo "$NAME" | LC_ALL=C.UTF-8 iconv -f utf8 -t ascii//TRANSLIT | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '_' | sed 's/^_//;s/_*$//')
            download "$CUSTOM_URL" || { echo "::error::Nepodarilo sa stiahnuť $CUSTOM_URL"; exit 1; }

            BBOX='${{ inputs.custom_bbox }}'
            if [ -z "$BBOX" ]; then
              sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
              BBOX=$(osmium fileinfo -g header.boxes data/region.osm.pbf | head -1 | tr -d '() ')
            fi
            if [ -z "$BBOX" ]; then
              echo "::error::PBF nemá bbox v hlavičke – vyplň input custom_bbox (west,south,east,north)."
              exit 1
            fi
          else
            # ----- prednastavený región z workers/regions.json -----
            KEY='${{ inputs.region }}'
            NAME=$(jq -r --arg r "$KEY" '.[$r].name' workers/regions.json)
            BBOX=$(jq -r --arg r "$KEY" '.[$r].bbox | join(",")' workers/regions.json)
            DIR=$(jq -r --arg r "$KEY" '.[$r].osmfr.dir' workers/regions.json)
            if [ "$NAME" = "null" ]; then echo "::error::Neznámy región: $KEY"; exit 1; fi

            OK=""
            # 1) osm.fr regionálne exporty (skúšaj kandidátske názvy súborov)
            for SLUG in $(jq -r --arg r "$KEY" '.[$r].osmfr.slugs[]' workers/regions.json); do
              if download "$OSMFR_BASE/$DIR/$SLUG.osm.pbf"; then OK=1; break; fi
            done
            # 2) fallback: náš release osm-extracts
            if [ -z "$OK" ]; then
              echo "::warning::osm.fr export sa nenašiel, skúšam release osm-extracts…"
              if gh release download osm-extracts --repo "$GITHUB_REPOSITORY" \
                   --pattern "$KEY.osm.pbf" --output data/region.osm.pbf; then
                OK=1
              fi
            fi
            if [ -z "$OK" ]; then
              echo "::error::PBF pre '$KEY' sa nepodarilo stiahnuť. Obsah $OSMFR_BASE/$DIR/ (uprav slugs vo workers/regions.json):"
              curl -sL "$OSMFR_BASE/$DIR/" | grep -oE 'href="[^"]+\.osm\.pbf"' | sort -u || true
              echo "…alebo spusti workflow 'Update OSM extracts' (release fallback)."
              exit 1
            fi
          fi

          echo "key=$KEY"   >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "bbox=$BBOX" >> "$GITHUB_OUTPUT"
          echo "Región: $NAME (key=$KEY, bbox=$BBOX)"
          ls -lh data/region.osm.pbf

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache – zdrojové dáta Planetileru (water polygons, Natural Earth)
        uses: actions/cache@v4
        with:
          path: data/sources
          key: planetiler-sources-v1

      - name: Stiahni Planetiler
        run: |
          curl -fL --retry 4 --retry-delay 5 -o planetiler.jar \
            https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar

      - name: PBF → PMTiles (Planetiler, OpenMapTiles schéma)
        run: |
          mkdir -p _site/tiles
          java -Xmx5g -jar planetiler.jar \
            --osm-path=data/region.osm.pbf \
            --output=_site/tiles/${{ steps.region.outputs.key }}.pmtiles \
            --download --download-dir=data/sources \
            --maxzoom=${{ inputs.maxzoom }} \
            --languages=sk,en \
            --force
          ls -lh _site/tiles/

      - name: Poskladaj web (viewer + manifest + sprity)
        run: |
          cp poc/web/index.html poc/web/app.js poc/web/themes.js _site/

          jq -n \
            --arg region '${{ steps.region.outputs.key }}' \
            --arg name '${{ steps.region.outputs.name }}' \
            --arg bbox '${{ steps.region.outputs.bbox }}' \
            --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              default_region: $region,
              built_at: $built,
              regions: {
                ($region): {
                  name: $name,
                  bbox: ($bbox | split(",") | map(tonumber)),
                  pmtiles: ("tiles/" + $region + ".pmtiles")
                }
              }
            }' > _site/tiles/manifest.json
          cat _site/tiles/manifest.json

          # Ikonky (maki) zo spritu osm-liberty – nakopírujeme k sebe,
          # aby web aj iOS mali stabilnú URL na našich Pages.
          mkdir -p _site/sprites
          BASE=https://maputnik.github.io/osm-liberty/sprites
          for f in osm-liberty.json osm-liberty.png osm-liberty@2x.json osm-liberty@2x.png; do
            curl -fL --retry 4 --retry-delay 5 -o "_site/sprites/$f" "$BASE/$f"
          done

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Vygeneruj statické style.json (web + iOS)
        run: |
          node workers/build-styles.mjs \
            --base-url='${{ steps.pages.outputs.base_url }}' \
            --region='${{ steps.region.outputs.key }}' \
            --name='${{ steps.region.outputs.name }}' \
            --out=_site/styles

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
