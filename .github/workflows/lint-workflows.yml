name: Lint workflows

# Chytá chyby, ktoré sa inak prejavia až tým, že beh skončí ako „failure"
# s nula jobmi – GitHub vtedy workflow ani neprijme a v logu nie je nič.
#
# Presne to sa stalo v behu 31012911958: `workflow_dispatch` dovolí najviac
# 10 inputov, mali sme ich 26. Bez tohto sa to zistí až pri merge do master,
# keď je neskoro. actionlint to povie do dvoch sekúnd.

on:
  push:
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: actionlint
        env:
          # shellcheck nevie o `${{ }}` – GitHub výrazy mu vyzerajú ako
          # rozbitá syntax (SC1083/1073/1072/1009/1089) a slovenské „úvodzovky"
          # v hláškach ako preklep (SC1111). To sú falošné poplachy, nie chyby;
          # skutočnú syntax kontroluje `bash -n` v ďalšom kroku, ktorý výrazy
          # najprv nahradí. SC2129 a SC2015 sú štýlové názory na `>>` a `&&`.
          #
          # SC2153 („ROCK_RES may not be assigned. Did you mean ROCK_DEM?")
          # je tu preto, že shellcheck nevidí `env:` workflowu. Do skriptov
          # ich chodí pätnásť (ROCK_RES, ROCK_ALGO, DEM_RELEASE…), takže
          # každá lokálna premenná s podobným menom vyrobí falošný poplach –
          # a prepisovať mená premenných podľa toho, čo sa shellchecku zdá,
          # je horšie než tento check nepoužívať.
          SHELLCHECK_OPTS: "-e SC1083,SC1073,SC1072,SC1009,SC1089,SC1111,SC2129,SC2015,SC2153"
        run: |
          set -euo pipefail
          VER=1.7.7
          curl -sSL --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint -color

      # Skutočná kontrola syntaxe: `${{ }}` sa nahradí zástupným textom
      # a `run:` blok sa dá bashu. Toto chytí naozajstný preklep tam, kde
      # shellcheck len nerozumel GitHub výrazu.
      - name: Syntax run blokov
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, re, subprocess, sys, yaml
          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              for job, jd in ((yaml.safe_load(open(path)) or {}).get("jobs") or {}).items():
                  for st in jd.get("steps") or []:
                      script = st.get("run")
                      if not script:
                          continue
                      clean = re.sub(r"\$\{\{[^}]*\}\}", "X", script)
                      p = subprocess.run(["bash", "-n"], input=clean, text=True,
                                         capture_output=True)
                      if p.returncode:
                          print(f"::error file={path}::{job} / {st.get('name')}: {p.stderr.strip()}")
                          bad += 1
          print(f"run blokov s chybnou syntaxou: {bad}")
          sys.exit(1 if bad else 0)
          PY

      # Strop na veľkosť súboru s workflowom je 128 KiB. Nad ním ho GitHub
      # NEPRIJME – a nepovie to: po pushi vznikne beh bez jobov, pomenovaný
      # cestou k súboru, s červeným krížikom, aj keď má workflow len
      # `workflow_dispatch`. Vyzerá to, že sa spustil sám po mergi.
      #
      # `build-map.yml` cez ten strop prešiel o 122 bajtov (beh 33) a stálo
      # to šesť kôl sond, kým sa to našlo: actionlint ani JSON schéma
      # o veľkosti nevedia. Preto radšej varovanie už od 120 KiB – veľký
      # `run:` blok patrí do `workers/`, nie do YAMLu.
      - name: Veľkosť súborov workflowov
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, sys
          LIMIT = 128 * 1024
          WARN = 120 * 1024
          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              n = os.path.getsize(path)
              if n > LIMIT:
                  print(f"::error file={path}::{n} B je nad stropom {LIMIT} B – "
                        f"GitHub taký súbor neprijme. Presuň veľký `run:` blok "
                        f"do workers/ a volaj ho jedným riadkom.")
                  bad += 1
              elif n > WARN:
                  print(f"::warning file={path}::{n} B, strop je {LIMIT} B "
                        f"(ostáva {LIMIT - n} B).")
              else:
                  print(f"{path}: {n} B ✓")
          sys.exit(1 if bad else 0)
          PY

      # `}}` v shellovom skripte bez `${{` pred ním. GitHub taký súbor
      # NEPRIJME: po pushnutí vznikne beh bez jobov, pomenovaný cestou
      # k súboru, s červeným krížikom – a to aj vtedy, keď má workflow len
      # `workflow_dispatch`, takže to vyzerá, že sa spustil sám po mergi.
      # V logu nie je nič, actionlint 1.7.7 ani oficiálna JSON schéma to
      # nezachytia.
      #
      # Vyrobí to celkom nevinná bashová vec – vnorená expanzia:
      #     echo "${A:-${B:-}}"      ← končí na `}}`
      # Stálo to štyri kolá sond po pushnutí, kým sa to našlo (behy 33–39).
      # Rozpis: `${{ … }}` sa vyhodí (aj s `{{z}}` vnútri reťazcov, ktoré
      # `format()` používa na escapovanie), a čo z `}}` ostane, je chyba.
      - name: Zátvorky výrazov v run blokoch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, yaml

          # Otvárací a zatvárací token sa SKLADAJÚ, nepíšu. Keby tu stáli
          # doslova, mal by tento súbor presne tú chybu, ktorú hľadá – a
          # kontrola by zhodila samu seba (aj actionlint, ktorý by ich skúsil
          # prečítať ako výraz).
          OPEN = "$" + "{" * 2
          CLOSE = "}" * 2

          def strip_exprs(s):
              """Vyhodí celé výrazy; vráti (zvyšok, neuzavretý výraz alebo None)."""
              out, i = [], 0
              while True:
                  j = s.find(OPEN, i)
                  if j < 0:
                      out.append(s[i:]); return "".join(out), None
                  out.append(s[i:j])
                  k, in_str = j + len(OPEN), False
                  while k < len(s):
                      # V reťazci vnútri výrazu môžu byť zdvojené zátvorky ako
                      # text – tak si ich escapuje `format()`.
                      if s[k] == "'":
                          in_str = not in_str; k += 1
                      elif not in_str and s.startswith(CLOSE, k):
                          k += len(CLOSE); break
                      else:
                          k += 1
                  else:
                      return "".join(out), s[j:j + 60]
                  i = k

          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              for job, jd in ((yaml.safe_load(open(path)) or {}).get("jobs") or {}).items():
                  for st in jd.get("steps") or []:
                      s = st.get("run")
                      if not s:
                          continue
                      rest, unclosed = strip_exprs(s)
                      if unclosed:
                          print(f"::error file={path}::{job} / {st.get('name')}: "
                                f"neuzavretý výraz: {unclosed}")
                          bad += 1
                          continue
                      for line in rest.split("\n"):
                          if CLOSE in line or OPEN in line:
                              print(f"::error file={path}::{job} / {st.get('name')}: "
                                    f"zdvojená zátvorka bez výrazu – GitHub taký "
                                    f"súbor neprijme: {line.strip()[:100]}")
                              bad += 1
          print(f"run blokov so zlomenými zátvorkami: {bad}")
          sys.exit(1 if bad else 0)
          PY

      # Výber pohorí vo formulári musí sedieť s workers/areas.json. Choice
      # options musia byť v YAML doslovne, takže sa to nedá generovať – ale
      # dá sa to strážiť, aby zoznam nezostarol.
      - name: Výber pohorí sedí s areas.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, yaml
          d = yaml.safe_load(open(".github/workflows/build-map.yml"))
          on = d[[k for k in d if k is True or k == "on"][0]]
          opts = on["workflow_dispatch"]["inputs"]["area"]["options"]
          areas = [k for k in json.load(open("workers/areas.json"))
                   if not k.startswith("_")]
          want = ["cely_region"] + areas
          if opts != want:
              print("::error::Výber `area` vo workflowe nesedí s workers/areas.json")
              print(f"  vo workflowe: {opts}")
              print(f"  malo by byť:  {want}")
              sys.exit(1)
          print(f"výber pohorí sedí ({len(opts)} položiek)")
          PY

      # A to isté pre oba workflowy, ktoré robia výškový model z DMR 5.0.
      # Robia ho práve pre tie územia, na ktoré potom Build map počíta skaly –
      # keby sa zoznamy rozišli, dá sa vyrobiť model pre pohorie, ktoré si
      # build nevie vypýtať (alebo naopak). Sú dva, lebo sú to dva zdroje
      # (archív ÚGKK cez ZIP a ETRS89 verzia na Drive), ale výber pohorí majú
      # ten istý a rozísť sa nesmie ani jeden.
      - name: Výber pohorí v DMR 5.0 workflowoch sedí s areas.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, yaml
          areas = [k for k in json.load(open("workers/areas.json"))
                   if not k.startswith("_")]
          want = ["cele_slovensko"] + areas
          bad = 0
          for path in (".github/workflows/dmr5.yml",
                       ".github/workflows/dmr5-drive.yml"):
              d = yaml.safe_load(open(path))
              on = d[[k for k in d if k is True or k == "on"][0]]
              opts = on["workflow_dispatch"]["inputs"]["area"]["options"]
              if opts != want:
                  print(f"::error file={path}::Výber `area` nesedí s workers/areas.json")
                  print(f"  vo workflowe: {opts}")
                  print(f"  malo by byť:  {want}")
                  bad += 1
              else:
                  print(f"{path}: výber pohorí sedí ({len(opts)} položiek)")
          sys.exit(1 if bad else 0)
          PY

      # A to isté pre „Skaly z tieňovaných dlaždíc". Ten hľadá skaly na tom
      # istom výreze, aký si potom Build map vypýta cez `rock_source: tienovanie`
      # – keby sa zoznamy rozišli, dali by sa vyrobiť polygóny pre pohorie,
      # ktoré build nevie zadať (alebo naopak). „Celý región" tu chýba
      # zámerne: bez výrezu nie je čo sťahovať, dlaždice sú konečné.
      - name: Výber pohorí v shading-rocks.yml sedí s areas.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, yaml
          d = yaml.safe_load(open(".github/workflows/shading-rocks.yml"))
          on = d[[k for k in d if k is True or k == "on"][0]]
          opts = on["workflow_dispatch"]["inputs"]["area"]["options"]
          want = [k for k in json.load(open("workers/areas.json"))
                  if not k.startswith("_")]
          if opts != want:
              print("::error::Výber `area` v shading-rocks.yml nesedí s workers/areas.json")
              print(f"  vo workflowe: {opts}")
              print(f"  malo by byť:  {want}")
              sys.exit(1)
          print(f"výber pohorí v shading-rocks.yml sedí ({len(opts)} položiek)")
          PY

      # To isté pre tri výbery výškového zdroja (`contour_source`,
      # `rock_source`, `shading_source`): musia sedieť s kľúčmi
      # v workers/dem-sources.json a s tým, pre ktoré vrstvy sa zdroj ponúka
      # (kľúč `for`). Bez toho sa dá pridať zdroj do JSONu a zabudnúť naň vo
      # formulári (alebo naopak) – a zistí sa to až tým, že build vezme
      # nesprávny release. Alebo sa `ugkk` objaví v tieňovaní, kde 1 m LiDAR
      # nie je (máme ho len na výrez, tieňovanie chce celý región).
      - name: Výbery výšok sedia s dem-sources.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, yaml
          d = yaml.safe_load(open(".github/workflows/build-map.yml"))
          on = d[[k for k in d if k is True or k == "on"][0]]
          inputs = on["workflow_dispatch"]["inputs"]
          srcs = {k: v.get("for", [])
                  for k, v in json.load(open("workers/dem-sources.json")).items()
                  if not k.startswith("_")}
          # (input, ktoré vrstvy, čo je vo výbere navyše k modelom)
          want = {
              "contour_source": ("contours", []),
              # Skaly majú okrem modelov ešte hotové polygóny z tieňovania.
              "rock_source": ("rocks", ["tienovanie"]),
              "shading_source": ("shading", []),
          }
          bad = 0
          for name, (layer, extra) in want.items():
              opts = inputs[name]["options"]
              expect = [k for k, f in srcs.items() if layer in f] + extra + ["ziadne"]
              if sorted(opts) != sorted(expect):
                  print(f"::error::Výber `{name}` nesedí s workers/dem-sources.json")
                  print(f"  vo workflowe: {opts}")
                  print(f"  malo by byť:  {expect}")
                  bad += 1
                  continue
              print(f"{name}: {len(opts)} možností ✓")
          # `ziadne` je hodnota, ktorou sa vrstva vypína – keby vypadla
          # z niektorého výberu, nedala by sa tá vrstva vôbec nezapnúť.
          sys.exit(1 if bad else 0)
          PY

      # actionlint kontroluje schému a výrazy, ale nie to, či `needs.X.outputs.Y`
      # naozaj existuje ako výstup jobu X. To je vlastná kontrola – práve na
      # tomto sa dá po rozdelení na joby ticho pomýliť.
      - name: Odkazy medzi jobmi
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, re, sys, yaml
          errs = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              txt = open(path).read()
              # Komentáre preč – kontrola je textová, takže by inak našla
              # `needs.…` aj v komentári, ktorý JU SAMU popisuje. (Presne
              # to sa aj stalo.) Zahadzujú sa len celé zakomentované riadky,
              # nie `#` uprostred príkazu, kde môže byť súčasťou textu.
              txt = re.sub(r"^[ \t]*#.*$", "", txt, flags=re.M)
              jobs = (yaml.safe_load(txt) or {}).get("jobs") or {}
              starts = {}
              for j in jobs:
                  m = re.search(r"^  " + re.escape(j) + r":$", txt, re.M)
                  if m:
                      starts[j] = m.start()
              if not starts:
                  continue
              def job_of(pos):
                  return max(((j, p) for j, p in starts.items() if p < pos),
                             key=lambda x: x[1])[0]
              for m in re.finditer(r"needs\.([a-zA-Z0-9_-]+)\.(outputs\.([a-zA-Z0-9_]+)|result)", txt):
                  tgt, cur = m.group(1), job_of(m.start())
                  needs = jobs[cur].get("needs") or []
                  if isinstance(needs, str):
                      needs = [needs]
                  if tgt not in needs:
                      print(f"::error file={path}::job '{cur}' používa needs.{tgt}, ale nemá ho v needs")
                      errs += 1
                      continue
                  key = m.group(3)
                  if key and key not in (jobs[tgt].get("outputs") or {}):
                      print(f"::error file={path}::job '{tgt}' nemá výstup '{key}' (chce ho '{cur}')")
                      errs += 1
          print(f"odkazov medzi jobmi: {errs} chýb")
          sys.exit(1 if errs else 0)
          PY
