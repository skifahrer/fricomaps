name: Lint workflows

# Chytá chyby, ktoré sa inak prejavia až tým, že beh skončí ako „failure"
# s nula jobmi – GitHub vtedy workflow ani neprijme a v logu nie je nič.
#
# Presne to sa stalo v behu 31012911958: `workflow_dispatch` dovolí najviac
# 10 inputov, mali sme ich 26. Bez tohto sa to zistí až pri merge do master,
# keď je neskoro. actionlint to povie do dvoch sekúnd.

on:
  push:
    paths:
      - ".github/workflows/**"
      - "workers/**"
      # Aj štýl: `fill` vrstva nad zmiešanou geometriou je tichý omyl, ktorý
      # sa inak nájde až v hotovej mape (viď `workers/lint-style.mjs`).
      - "poc/web/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "workers/**"
      - "poc/web/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: actionlint
        env:
          # shellcheck nevie o `${{ }}` – GitHub výrazy mu vyzerajú ako
          # rozbitá syntax (SC1083/1073/1072/1009/1089) a slovenské „úvodzovky"
          # v hláškach ako preklep (SC1111). To sú falošné poplachy, nie chyby;
          # skutočnú syntax kontroluje `bash -n` v ďalšom kroku, ktorý výrazy
          # najprv nahradí. SC2129 a SC2015 sú štýlové názory na `>>` a `&&`.
          #
          # SC2153 („ROCK_RES may not be assigned. Did you mean ROCK_DEM?")
          # je tu preto, že shellcheck nevidí `env:` workflowu. Do skriptov
          # ich chodí pätnásť (ROCK_RES, ROCK_ALGO, DEM_STORE…), takže
          # každá lokálna premenná s podobným menom vyrobí falošný poplach –
          # a prepisovať mená premenných podľa toho, čo sa shellchecku zdá,
          # je horšie než tento check nepoužívať.
          SHELLCHECK_OPTS: "-e SC1083,SC1073,SC1072,SC1009,SC1089,SC1111,SC2129,SC2015,SC2153"
        run: |
          set -euo pipefail
          VER=1.7.7
          curl -sSL --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint -color

      # Skutočná kontrola syntaxe: `${{ }}` sa nahradí zástupným textom
      # a `run:` blok sa dá bashu. Toto chytí naozajstný preklep tam, kde
      # shellcheck len nerozumel GitHub výrazu.
      - name: Syntax run blokov
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, re, subprocess, sys, yaml
          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              for job, jd in ((yaml.safe_load(open(path)) or {}).get("jobs") or {}).items():
                  for st in jd.get("steps") or []:
                      script = st.get("run")
                      if not script:
                          continue
                      clean = re.sub(r"\$\{\{[^}]*\}\}", "X", script)
                      p = subprocess.run(["bash", "-n"], input=clean, text=True,
                                         capture_output=True)
                      if p.returncode:
                          print(f"::error file={path}::{job} / {st.get('name')}: {p.stderr.strip()}")
                          bad += 1
          print(f"run blokov s chybnou syntaxou: {bad}")
          sys.exit(1 if bad else 0)
          PY

      # Strop na veľkosť súboru s workflowom je 128 KiB. Nad ním ho GitHub
      # NEPRIJME – a nepovie to: po pushi vznikne beh bez jobov, pomenovaný
      # cestou k súboru, s červeným krížikom, aj keď má workflow len
      # `workflow_dispatch`. Vyzerá to, že sa spustil sám po mergi.
      #
      # `build-map.yml` cez ten strop prešiel o 122 bajtov (beh 33) a stálo
      # to šesť kôl sond, kým sa to našlo: actionlint ani JSON schéma
      # o veľkosti nevedia. Preto radšej varovanie už od 120 KiB – veľký
      # `run:` blok patrí do `workers/`, nie do YAMLu.
      - name: Veľkosť súborov workflowov
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, sys
          LIMIT = 128 * 1024
          WARN = 120 * 1024
          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              n = os.path.getsize(path)
              if n > LIMIT:
                  print(f"::error file={path}::{n} B je nad stropom {LIMIT} B – "
                        f"GitHub taký súbor neprijme. Presuň veľký `run:` blok "
                        f"do workers/ a volaj ho jedným riadkom.")
                  bad += 1
              elif n > WARN:
                  print(f"::warning file={path}::{n} B, strop je {LIMIT} B "
                        f"(ostáva {LIMIT - n} B).")
              else:
                  print(f"{path}: {n} B ✓")
          sys.exit(1 if bad else 0)
          PY

      # `}}` v shellovom skripte bez `${{` pred ním. GitHub taký súbor
      # NEPRIJME: po pushnutí vznikne beh bez jobov, pomenovaný cestou
      # k súboru, s červeným krížikom – a to aj vtedy, keď má workflow len
      # `workflow_dispatch`, takže to vyzerá, že sa spustil sám po mergi.
      # V logu nie je nič, actionlint 1.7.7 ani oficiálna JSON schéma to
      # nezachytia.
      #
      # Vyrobí to celkom nevinná bashová vec – vnorená expanzia:
      #     echo "${A:-${B:-}}"      ← končí na `}}`
      # Stálo to štyri kolá sond po pushnutí, kým sa to našlo (behy 33–39).
      # Rozpis: `${{ … }}` sa vyhodí (aj s `{{z}}` vnútri reťazcov, ktoré
      # `format()` používa na escapovanie), a čo z `}}` ostane, je chyba.
      - name: Zátvorky výrazov v run blokoch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, yaml

          # Otvárací a zatvárací token sa SKLADAJÚ, nepíšu. Keby tu stáli
          # doslova, mal by tento súbor presne tú chybu, ktorú hľadá – a
          # kontrola by zhodila samu seba (aj actionlint, ktorý by ich skúsil
          # prečítať ako výraz).
          OPEN = "$" + "{" * 2
          CLOSE = "}" * 2

          def strip_exprs(s):
              """Vyhodí celé výrazy; vráti (zvyšok, neuzavretý výraz alebo None)."""
              out, i = [], 0
              while True:
                  j = s.find(OPEN, i)
                  if j < 0:
                      out.append(s[i:]); return "".join(out), None
                  out.append(s[i:j])
                  k, in_str = j + len(OPEN), False
                  while k < len(s):
                      # V reťazci vnútri výrazu môžu byť zdvojené zátvorky ako
                      # text – tak si ich escapuje `format()`.
                      if s[k] == "'":
                          in_str = not in_str; k += 1
                      elif not in_str and s.startswith(CLOSE, k):
                          k += len(CLOSE); break
                      else:
                          k += 1
                  else:
                      return "".join(out), s[j:j + 60]
                  i = k

          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              for job, jd in ((yaml.safe_load(open(path)) or {}).get("jobs") or {}).items():
                  for st in jd.get("steps") or []:
                      s = st.get("run")
                      if not s:
                          continue
                      rest, unclosed = strip_exprs(s)
                      if unclosed:
                          print(f"::error file={path}::{job} / {st.get('name')}: "
                                f"neuzavretý výraz: {unclosed}")
                          bad += 1
                          continue
                      for line in rest.split("\n"):
                          if CLOSE in line or OPEN in line:
                              print(f"::error file={path}::{job} / {st.get('name')}: "
                                    f"zdvojená zátvorka bez výrazu – GitHub taký "
                                    f"súbor neprijme: {line.strip()[:100]}")
                              bad += 1
          print(f"run blokov so zlomenými zátvorkami: {bad}")
          sys.exit(1 if bad else 0)
          PY

      # Popis inputu je vo formulári GitHubu jednoriadková nápoveda pod
      # poľom. Keď z neho spravíš odsek, formulár sa stane nečitateľným –
      # a práve to sa tu stalo: `options` v shading-rocks.yml mal 474 znakov,
      # čiže šesť riadkov textu pod jedným políčkom. Detail patrí do
      # komentára nad input (ten číta ten, kto workflow upravuje) alebo do
      # docs/pipeline.md, nie do formulára.
      - name: Popisy inputov sú jednoriadkové
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, yaml
          LIMIT = 100
          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              d = yaml.safe_load(open(path)) or {}
              on = d.get(True) or d.get("on") or {}
              for kind in ("workflow_dispatch", "workflow_call"):
                  for name, spec in ((on.get(kind) or {}) or {}).get("inputs", {}).items():
                      desc = (spec or {}).get("description") or ""
                      if "\n" in desc:
                          print(f"::error file={path}::input `{name}`: popis je "
                                f"viacriadkový – formulár ho zlepí do jedného odseku.")
                          bad += 1
                      elif len(desc) > LIMIT:
                          print(f"::error file={path}::input `{name}`: popis má "
                                f"{len(desc)} znakov, strop je {LIMIT}. Vo formulári "
                                f"je to nápoveda pod poľom, nie dokumentácia – "
                                f"detail daj do komentára nad input.")
                          bad += 1
          print(f"inputov s pridlhým popisom: {bad}")
          sys.exit(1 if bad else 0)
          PY

      # Výber pohorí vo formulári musí sedieť s workers/areas.json. Choice
      # options musia byť v YAML doslovne, takže sa to nedá generovať – ale
      # dá sa to strážiť, aby zoznam nezostarol.
      - name: Výber pohorí sedí s areas.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, yaml
          d = yaml.safe_load(open(".github/workflows/build-map.yml"))
          on = d[[k for k in d if k is True or k == "on"][0]]
          opts = on["workflow_dispatch"]["inputs"]["area"]["options"]
          areas = [k for k in json.load(open("workers/areas.json"))
                   if not k.startswith("_")]
          want = ["cely_region"] + areas
          if opts != want:
              print("::error::Výber `area` vo workflowe nesedí s workers/areas.json")
              print(f"  vo workflowe: {opts}")
              print(f"  malo by byť:  {want}")
              sys.exit(1)
          print(f"výber pohorí sedí ({len(opts)} položiek)")
          PY

      # A to isté pre workflow, ktorý robí výškový model z DMR 5.0. Robí ho
      # práve pre tie územia, na ktoré potom Build map počíta skaly – keby sa
      # zoznamy rozišli, dá sa vyrobiť model pre pohorie, ktoré si build nevie
      # vypýtať (alebo naopak).
      - name: Výber pohorí v DMR 5.0 z Drive sedí s areas.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, yaml
          areas = [k for k in json.load(open("workers/areas.json"))
                   if not k.startswith("_")]
          want = ["cele_slovensko"] + areas
          bad = 0
          for path in (".github/workflows/dmr5-drive.yml",):
              d = yaml.safe_load(open(path))
              on = d[[k for k in d if k is True or k == "on"][0]]
              opts = on["workflow_dispatch"]["inputs"]["area"]["options"]
              if opts != want:
                  print(f"::error file={path}::Výber `area` nesedí s workers/areas.json")
                  print(f"  vo workflowe: {opts}")
                  print(f"  malo by byť:  {want}")
                  bad += 1
              else:
                  print(f"{path}: výber pohorí sedí ({len(opts)} položiek)")
          sys.exit(1 if bad else 0)
          PY

      # A to isté pre „Skaly z tieňovaných dlaždíc". Ten hľadá skaly na tom
      # istom výreze, aký si potom Build map vypýta cez `rock_source: tienovanie`
      # – keby sa zoznamy rozišli, dali by sa vyrobiť polygóny pre pohorie,
      # ktoré build nevie zadať (alebo naopak). „Celý región" tu chýba
      # zámerne: bez výrezu nie je čo sťahovať, dlaždice sú konečné.
      - name: Výber pohorí v shading-rocks.yml sedí s areas.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, yaml
          d = yaml.safe_load(open(".github/workflows/shading-rocks.yml"))
          on = d[[k for k in d if k is True or k == "on"][0]]
          opts = on["workflow_dispatch"]["inputs"]["area"]["options"]
          want = [k for k in json.load(open("workers/areas.json"))
                  if not k.startswith("_")]
          if opts != want:
              print("::error::Výber `area` v shading-rocks.yml nesedí s workers/areas.json")
              print(f"  vo workflowe: {opts}")
              print(f"  malo by byť:  {want}")
              sys.exit(1)
          print(f"výber pohorí v shading-rocks.yml sedí ({len(opts)} položiek)")
          PY

      # KTORÁ VRSTVA PODÁVA KĽÚČ VÝREZU. Na tomto sa build už raz rozbil
      # (beh 31307163093) a je to tichý druh chyby, lebo obe strany vyzerajú
      # správne samy o sebe.
      #
      # `dmr5` má dve podoby a prepína medzi nimi kľúč výrezu, ktorý vrstva
      # podá do `fetch-dem.sh`: s kľúčom výrez z `dem-ugkk`, bez neho dlaždice
      # z `dem-dmr5`. Kontrola v `workers/check-dem.sh` musí o každej vrstve
      # predpokladať presne to, čo tá vrstva naozaj robí – inak build kontroluje
      # jeden release a sťahuje z druhého.
      #
      # Tabuľka `layer_area_key` v check-dem.sh hovorí, ktorá vrstva kľúč podáva.
      # Tu sa porovná s tým, koľko argumentov naozaj dáva každé volanie
      # `fetch-dem.sh`: 5 = s kľúčom výrezu, 4 = bez neho.
      - name: Vrstvy podávajú kľúč výrezu tak, ako to čaká kontrola
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          # Kde je volanie a ktorej vrstve patrí. Keď pribudne ďalšie, pridaj
          # ho sem aj do `layer_area_key` v workers/check-dem.sh.
          # Cesta sa mení, keď sa `run:` blok presunie do workers/ (a to sa
          # deje – build-map.yml má strop 128 KiB). Preto sa každá vrstva
          # hľadá vo VIACERÝCH kandidátoch a stačí, že ju nájde jeden;
          # keby sa hľadalo len na jednom mieste, presun by kontrolu umlčal.
          CALLS = {
              ("workers/contours-build.sh",): ("contours", "rocks"),
              ("workers/terrain-build.sh",
               ".github/workflows/build-map.yml"): ("terrain",),
          }
          # Vrstvy, o ktorých check-dem.sh tvrdí, že kľúč NEpodávajú.
          src = open("workers/check-dem.sh").read()
          m = re.search(r"layer_area_key\(\)\s*\{(.*?)\n\}", src, re.S)
          if not m:
              print("::error file=workers/check-dem.sh::`layer_area_key` sa nenašla")
              sys.exit(1)
          bez_kluca = set(re.findall(r"^\s*([a-z|]+]?)\)\s*echo cely\s*;;",
                                     m.group(1), re.M))
          bez_kluca = {v for entry in bez_kluca for v in entry.strip(")").split("|")}

          bad = 0
          for paths, layers in CALLS.items():
              calls, path = [], paths[0]
              for cand in paths:
                  if not os.path.exists(cand):
                      continue
                  # Komentáre preč – tieto súbory samy o `fetch-dem.sh` píšu
                  # a bez toho by sa veta z komentára počítala ako argumenty.
                  txt = re.sub(r"^[ \t]*#.*$", "", open(cand).read(), flags=re.M)
                  # Riadok s volaním aj s prípadným pokračovaním cez `\`.
                  found = [c for c in re.findall(
                      r"workers/fetch-dem\.sh((?:[^\n\\]|\\\n)*)", txt) if c.strip()]
                  if found:
                      calls, path = found, cand
                      break
              if not calls:
                  print(f"::error file={paths[0]}::volanie fetch-dem.sh sa "
                        f"nenašlo ani v jednom z {list(paths)} – vrstva "
                        f"{layers} si DEM nesťahuje, alebo sa presunula inam "
                        f"a treba ju dopísať do CALLS.")
                  bad += 1
                  continue
              for call in calls:
                  nargs = len(call.replace("\\\n", " ").split())
                  poda = nargs >= 5   # bbox, adresár, tsv, zdroj, kľúč výrezu
                  for layer in layers:
                      caka = layer not in bez_kluca
                      if poda != caka:
                          print(f"::error file={path}::vrstva `{layer}` volá "
                                f"fetch-dem.sh s {nargs} argumentmi (kľúč výrezu "
                                f"{'podáva' if poda else 'nepodáva'}), ale "
                                f"workers/check-dem.sh o nej predpokladá, že ho "
                                f"{'podáva' if caka else 'nepodáva'}. Zosúlaď to – "
                                f"inak build kontroluje jeden release a sťahuje "
                                f"z druhého (beh 31307163093).")
                          bad += 1
          print(f"vrstiev bez kľúča výrezu podľa check-dem.sh: "
                f"{sorted(bez_kluca)}; nesúladov: {bad}")
          sys.exit(1 if bad else 0)
          PY

      # DMR 5.0 sa nedá doplniť cez `update-dem.yml` – ten sťahuje archív na
      # runner a model má 145 GB. Kým sa tam `dmr5` posielal, doplnenie bolo
      # tiché nič: job zazelenal, nestiahol nič a build spadol až v jobe, ktorý
      # si model vypýtal. Tu sa stráži, že tá cesta ostane zavretá z oboch strán.
      - name: DMR 5.0 sa dopĺňa vlastnou pipeline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys, yaml
          bad = 0

          # 1. update-dem.yml musí na `dmr5` skončiť chybou, nie úspechom.
          txt = open(".github/workflows/update-dem.yml").read()
          m = re.search(r"^\s*dmr5\)(.*?);;", txt, re.S | re.M)
          if not m or "::error::" not in m.group(1) or "exit 1" not in m.group(1):
              print("::error file=.github/workflows/update-dem.yml::vetva `dmr5` "
                    "musí skončiť chybou – doplnenie, ktoré nedopĺňa, nesmie "
                    "zazelenať (beh 31307163093).")
              bad += 1

          # 2. dmr5-drive.yml musí byť volateľný a brať to, čo mu Build map dáva.
          d = yaml.safe_load(open(".github/workflows/dmr5-drive.yml"))
          on = d[[k for k in d if k is True or k == "on"][0]]
          call = (on.get("workflow_call") or {}).get("inputs") or {}
          bm = yaml.safe_load(open(".github/workflows/build-map.yml"))
          for name, job in (bm.get("jobs") or {}).items():
              if job.get("uses") != "./.github/workflows/dmr5-drive.yml":
                  continue
              for key in (job.get("with") or {}):
                  if key not in call:
                      print(f"::error file=.github/workflows/build-map.yml::job "
                            f"'{name}' podáva `{key}`, ktoré dmr5-drive.yml "
                            f"v `workflow_call` nemá")
                      bad += 1
          if not any(j.get("uses") == "./.github/workflows/dmr5-drive.yml"
                     for j in (bm.get("jobs") or {}).values()):
              print("::error file=.github/workflows/build-map.yml::DMR 5.0 nemá "
                    "kto doplniť – žiadny job nevolá dmr5-drive.yml")
              bad += 1

          # 3. VÝREZ SA DOPĹŇA BBOXOM, NIE KĽÚČOM POHORIA. Kľúč je meno
          # obdĺžnika z `areas.json`; čo sa má naozaj prečítať, vie len Build
          # map (výrez pretnutý s regiónom, pri rýchlom teste štvorec na pár
          # km²). Kým sem chodil kľúč, `dmr5-drive.yml` si ho vyriešil
          # druhýkrát a čítal z Drive celý obdĺžnik – test na 2 km² tak čítal
          # 541 km² Vysokých Tatier. Je to tá istá chyba ako beh 31307163093,
          # len nezhodila beh, iba ho predražila – a preto sa vráti ticho.
          for name, job in (bm.get("jobs") or {}).items():
              with_ = job.get("with") or {}
              if job.get("uses") != "./.github/workflows/dmr5-drive.yml":
                  continue
              if str(with_.get("tiles", "")).lower() == "true":
                  continue   # dlaždice sa zadávajú stupňami, meno je z nich
              area, asset = str(with_.get("area", "")), str(with_.get("asset", ""))
              if "mirror_dmr5_area" not in area:
                  print(f"::error file=.github/workflows/build-map.yml::job "
                        f"'{name}' podáva do dmr5-drive.yml `area: {area}` – "
                        f"výrez sa musí brať z `check-dem.outputs."
                        f"mirror_dmr5_area` (bbox toho, čo si beh vypýtal), "
                        f"inak sa z Drive číta celý obdĺžnik z areas.json.")
                  bad += 1
              if "mirror_dmr5_asset" not in asset:
                  print(f"::error file=.github/workflows/build-map.yml::job "
                        f"'{name}' nepodáva `asset` z `check-dem.outputs."
                        f"mirror_dmr5_asset`. Pri bboxe v `area` je povinný – "
                        f"meno sa z bboxu odvodiť nedá a build si súbor hľadá "
                        f"podľa kľúča výrezu.")
                  bad += 1

          # A druhá strana toho istého: kontrola to meno musí vedieť povedať.
          chk = open("workers/check-dem.sh").read()
          for out in ("mirror_dmr5_area", "mirror_dmr5_asset"):
              if f"{out}=" not in chk:
                  print(f"::error file=workers/check-dem.sh::chýba výstup "
                        f"`{out}`, ktorý build-map.yml podáva do dmr5-drive.yml")
                  bad += 1
          print(f"cesta k DMR 5.0: {bad} chýb")
          sys.exit(1 if bad else 0)
          PY

      # PRIHLÁSENIE NA DRIVE SA MUSÍ DOSTAŤ KU KAŽDÉMU KROKU, ČO Z DRIVE ČÍTA.
      # Keď chýba, nič nespadne – beh len ticho prepadne na verejný odkaz,
      # ktorý má denný limit sťahovania zdieľaný so všetkými klientmi, a zistí
      # sa to až vtedy, keď Drive prestane dávať dáta (beh 31315890474 na tom
      # visel 2 h 16 min). Presne ten druh tichého omylu, ktorý má mať
      # kontrolu – a je to o jeden krok ľahšie prehliadnuť, než sa zdá: skaly
      # z DMR 5.0 čítajú sklon rovno z Drive v úplne inom jobe než ten, ktorý
      # model dopĺňa.
      - name: Token vlastníka Drive sa dostane všade, kde sa z Drive číta
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, re, sys, yaml

          # Prihlásenie sa dá podať dvoma tvarmi: všetko v jednom secrete,
          # alebo po kusoch. Nekompletná dvojica/trojica sa NESMIE brať ako
          # „veď tam niečo je" – `drive-auth.py` na polovicu údajov spadne,
          # a keby to kontrola prepustila, spadol by až ten trojhodinový beh.
          #
          # Druhá skupina má len DVA prvky: `client_id` (DRIVE_CLIENT) medzi
          # secrets nepatrí – nie je to tajné, je to repository variable a
          # `vars.*` sa v tomto repozitári číta priamo, bez podávania cez
          # `workflow_call`/`secrets: inherit`. Táto kontrola preto overuje
          # len to, čo sa cez secrets naozaj musí prevliecť.
          BLOB = "GDRIVE_CREDENTIALS"
          GROUPS = (("GDRIVE_CLIENT_ID", "GDRIVE_CLIENT_SECRET",
                     "GDRIVE_REFRESH_TOKEN"),
                    ("DRIVE_SECRET", "DRIVE_REFRESH"))

          def authed(names):
              """Dá sa z týchto premenných prihlásiť?"""
              return (BLOB in names
                      or any(all(k in names for k in g) for g in GROUPS))

          def why_not(names):
              for g in GROUPS:
                  have = [k for k in g if k in names]
                  if have:
                      return (f"z {'/'.join(g)} tam je len "
                              f"{', '.join(have)} – prihlásenie s polovicou "
                              f"údajov `drive-auth.py` odmieta")
              return f"chýba {BLOB} alebo {'/'.join(GROUPS[1])}"

          # Volanie workera sa hľadá na ZAČIATKU riadku v `run:`, nie kdekoľvek
          # v texte – inak by kontrola našla samu seba a ostatné kontroly,
          # ktoré tie isté mená spomínajú ako dáta.
          # Interpret je NEPOVINNÝ: `run: workers/check-dem.sh` je celý riadok
          # bez `bash` pred ním a kým to regex vyžadoval, tento krok cez sieť
          # kontrolou prešiel. Pred cestou smú stáť len shellové kľúčové slová
          # a operátory (`elif python3 …`) – nie `\S*`, lebo to by našlo aj
          # `print(f"workers/slope-chunks.py …")` v INEJ kontrole tohto súboru
          # a hlásilo by chybu na kroku, ktorý so sieťou nemá nič.
          CMD = re.compile(r"^\s*(?:(?:if|elif|then|else|do|!|&&|\|\|)\s+)*"
                           r"(?:\w+=\$\()?(?:(?:python3?|bash|sh)\s+)?"
                           r"(?:\./)?[\w./-]*"
                           r"(?:dmr5-drive|slope-chunks|contours-build"
                           r"|terrain-build|check-dem|fetch-dem"
                           r"|drive-folder|drive-cache|drive-store"
                           r"|publish-map|publish-results)"
                           r"\.(?:py|sh)\b", re.M)
          # Cache leží na Drive, takže KAŽDÝ krok s ňou je krok, ktorý sa musí
          # vedieť prihlásiť. Bez tokenu sa nič nestratí, len sa nič nenájde
          # a nič neuloží – build počíta hodiny odznova a nikde to vidieť nie
          # je. Presne ten druh tichej chyby, na ktorý sú tieto kontroly.
          CACHE = "./.github/actions/cache-"
          # Workflowy, ktoré samy z Drive čítajú, takže im volajúci MUSÍ
          # prihlásenie podať. `update-dem.yml` sem pribudol s Sonnym: jeho
          # dlaždice sú tiež na Drive a ťahali sa anonymne, kým bol token
          # zapojený len do cesty k DMR 5.0. `shading-rocks.yml` s cache:
          # gigabajty stiahnutých dlaždíc sú tiež na Drive.
          CALLED = ("./.github/workflows/dmr5-drive" + ".yml",
                    "./.github/workflows/update-dem" + ".yml",
                    "./.github/workflows/shading-rocks" + ".yml")
          bad = 0

          for path in sorted(glob.glob(".github/workflows/*.yml")):
              d = yaml.safe_load(open(path)) or {}
              top = d.get("env") or {}
              for name, job in (d.get("jobs") or {}).items():
                  job = job or {}
                  # Volaný workflow si secret vyzdvihne sám, ale volajúci mu ho
                  # musí podať – `workflow_call` nededí nič automaticky.
                  if job.get("uses") in CALLED:
                      called = job["uses"].rsplit("/", 1)[1]
                      sec = job.get("secrets")
                      if not (sec == "inherit"
                              or (isinstance(sec, dict) and authed(sec))):
                          print(f"::error file={path}::job '{name}' volá "
                                f"{called} bez `secrets: inherit`, takže "
                                f"doplnenie by z Drive čítalo verejným odkazom "
                                f"s denným limitom.")
                          bad += 1
                      continue
                  jenv = job.get("env") or {}
                  for step in job.get("steps") or []:
                      step = step or {}
                      cache = str(step.get("uses") or "").startswith(CACHE)
                      if not cache and not CMD.search(str(step.get("run") or "")):
                          continue
                      names = set(top) | set(jenv) | set(step.get("env") or {})
                      if authed(names):
                          continue
                      print(f"::error file={path}::krok "
                            f"'{step.get('name', '?')}' v jobe '{name}' "
                            + ("pracuje s cache na Drive" if cache else
                               "číta z Drive")
                            + f", ale prihlásiť sa z toho nedá: "
                            f"{why_not(names)}. "
                            + ("Cache by sa nenašla ani neuložila a build by "
                               "počítal všetko odznova"
                               if cache else
                               "Bežal by na verejnom dennom limite")
                            + " – doplň to do `env:` toho kroku, jobu alebo "
                              "celého workflowu.")
                      bad += 1

          # A druhá strana toho istého: volaný workflow to musí prijať.
          for called in CALLED:
              d = yaml.safe_load(open(called[2:]))
              on = d[[k for k in d if k is True or k == "on"][0]]
              decl = (on.get("workflow_call") or {}).get("secrets") or {}
              if not authed(decl):
                  print(f"::error file={called[2:]}::`workflow_call` "
                        f"nedeklaruje prihlásenie na Drive ({why_not(decl)}), "
                        f"takže mu ho volajúci nemá ako podať.")
                  bad += 1
          print(f"prihlásenie na Drive: {bad} chýb")
          sys.exit(1 if bad else 0)
          PY

      # CACHE PATRÍ NA DRIVE. GitHubová má na repozitár 10 GB a keď sa naplní,
      # NIČ NEPOVIE – ticho vyhodí najstaršie záznamy. Jeden výrez do nej
      # ukladal desiatky GB (DEM dlaždice, sklad častí sklonu, vrstevnice,
      # tieňovanie, dlaždice tieňovania), takže si záznamy vyhadzovali
      # navzájom a hodinové výpočty sa rátali odznova bez toho, aby bolo na
      # čom to vidieť. Jedno vrátené `uses: actions/cache` by ten stav vrátilo
      # a poznalo by sa to len na tom, že build zase trvá dlho.
      - name: Cache je na Drive, nie v GitHube
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, sys, yaml

          CACHE = "./.github/actions/cache-"
          WORKER = "workers/drive-cache.py"
          bad = 0

          for path in sorted(glob.glob(".github/workflows/*.yml")):
              d = yaml.safe_load(open(path)) or {}
              for name, job in (d.get("jobs") or {}).items():
                  for st in (job or {}).get("steps") or []:
                      uses = str((st or {}).get("uses") or "")
                      if uses.split("@")[0] in ("actions/cache",
                                                "actions/cache/restore",
                                                "actions/cache/save"):
                          print(f"::error file={path}::krok "
                                f"'{st.get('name', '?')}' v jobe '{name}' "
                                f"používa `{uses}`. GitHubová cache má na "
                                f"repozitár 10 GB a pri naplnení ticho vyhadzuje "
                                f"najstaršie záznamy – použi "
                                f"`{CACHE}restore` / `{CACHE}save`.")
                          bad += 1
                      # Lokálna akcia, ktorá nemá súbor, je beh bez cache
                      # a chybová hláška až na runneri.
                      if uses.startswith("./") and not os.path.exists(
                              os.path.join(uses[2:], "action.yml")):
                          print(f"::error file={path}::krok "
                                f"'{st.get('name', '?')}' v jobe '{name}' volá "
                                f"`{uses}`, ale {uses[2:]}/action.yml "
                                f"neexistuje.")
                          bad += 1

          # Mazanie GitHub cache sa už nemá čoho chytiť: pri pregenerovaní
          # treba zmazať záznam na Drive, inak sa nový pod ten istý kľúč
          # neuloží a ďalší beh dostane ten starý.
          #
          # Hľadaný príkaz sa SKLADÁ, nepíše: keby tu stál celý, našla by táto
          # kontrola samu seba a hlásila by chybu navždy (tak ako pri `OPEN`
          # nižšie).
          NEEDLE = "gh cache" + " delete"
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              txt = open(path).read()
              if NEEDLE in txt:
                  print(f"::error file={path}::`{NEEDLE}` maže GitHub "
                        f"cache, ktorú už nikto nepoužíva. Zmaž záznam na "
                        f"Drive: `python3 {WORKER} --delete --key=…`.")
                  bad += 1

          # A druhá strana toho istého: obe akcie musia existovať a volať
          # tento worker – bez neho by boli prázdnym krokom, ktorý zazelená.
          for smer in ("restore", "save"):
              akcia = f".github/actions/cache-{smer}/action.yml"
              if not os.path.exists(akcia):
                  print(f"::error::chýba {akcia}")
                  bad += 1
                  continue
              text = open(akcia).read()
              if WORKER not in text:
                  print(f"::error file={akcia}::nevolá {WORKER}")
                  bad += 1
              d = yaml.safe_load(text) or {}
              if smer == "restore":
                  # Bez týchto výstupov by `steps.<id>.outputs.cache-hit` bolo
                  # ticho prázdne a všetko by sa počítalo znova.
                  for out in ("cache-hit", "cache-primary-key"):
                      if out not in (d.get("outputs") or {}):
                          print(f"::error file={akcia}::nemá výstup `{out}`, "
                                f"na ktorý sa workflowy odkazujú")
                          bad += 1
          print(f"cache na Drive: {bad} chýb")
          sys.exit(1 if bad else 0)
          PY

      # PUBLIKUJE SA LEN NA DRIVE. Do GitHubu nesmie ísť ani release, ani
      # artefakt, ktorý má prežiť beh – celý sklad je vo `workers/drive-store.py`.
      #
      # Prečo kontrola a nie len dohoda: `gh release upload` je jeden riadok
      # a keby sa vrátil, poznalo by sa to len tým, že v Releases pribúdajú
      # gigabajty, ktoré nikto nečíta, a že tá istá vec leží na dvoch miestach
      # (pravidlo 1). Rovnako `retention-days: 90` – artefakt s ním je uložený
      # výsledok, nie prepravka medzi jobmi jedného behu.
      #
      # Rozpis je vo `workers/lint-publishing.py`, nie tu: tento súbor je nad
      # stropom 800 riadkov, ktorý si sám kontroluje o pár krokov vyššie, a
      # ďalší storiadkový heredoc doň nepatrí (pravidlo 3). Skript sa dá
      # spustiť aj lokálne: `python3 workers/lint-publishing.py`.
      - name: Publikuje sa len na Drive, nie do releasov a artefaktov
        run: python3 workers/lint-publishing.py

      # `fill` vrstva nad vrstvou so ZMIEŠANOU geometriou musí vedieť, že chce
      # len plochy. MapLibre jej čiaru nepreskočí – earcutom z nej vyrobí
      # sebaprekrývajúci sa mnohouholník, mapa sa načíta a nikto nič nepovie.
      # Presne tak vznikli tie „prerezané" útvary od zoomu 13 (pedestrian-area
      # nad `transportation`, kde sú chodníky čiary). Rozpis a zoznam
      # zmiešaných vrstiev je vo `workers/lint-style.mjs`.
      - name: Výplne v štýle chcú len plochy
        run: node workers/lint-style.mjs

      # Shim nad Drive musí zniesť nápor súbežných gdalwarpov a GDAL sa musí
      # vedieť spamätať z jedného stratného spojenia. Obe veci sú tiché:
      # keď `socketserver`-u pretečie predvolená fronta piatich čakajúcich
      # spojení, jadro SYN zahodí BEZ chyby na oboch stranách – shim sa
      # o požiadavke nedozvie a GDAL po dvoch minútach retransmitov vypíše
      # `response_code=0`, čo vyzerá ako chyba Drive. Beh 31338803278 na tom
      # padol dve časti pred koncom (45 zo 47 spočítaných).
      - name: Shim nad Drive znesie nápor a GDAL to skúsi znova
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast, sys

          SRC = "workers/drive-serve.py"
          tree = ast.parse(open(SRC).read())
          bad = 0

          def num(node):
              """Konštanta, alebo `socket.SOMAXCONN`."""
              if isinstance(node, ast.Constant) and isinstance(node.value, int):
                  return node.value
              if isinstance(node, ast.Attribute) and node.attr == "SOMAXCONN":
                  return 4096
              return None

          queue = None
          for node in ast.walk(tree):
              if not (isinstance(node, ast.ClassDef) and node.name == "Server"):
                  continue
              for stmt in node.body:
                  if (isinstance(stmt, ast.Assign) and stmt.targets
                          and getattr(stmt.targets[0], "id", "")
                          == "request_queue_size"):
                      queue = num(stmt.value)
          if queue is None or queue < 64:
              print(f"::error file={SRC}::`Server.request_queue_size` je "
                    f"{queue if queue is not None else 'predvolených 5'} – "
                    f"pri šiestich súbežných gdalwarpoch taká fronta pretečie "
                    f"a jadro SYN ticho zahodí (beh 31338803278). Nechaj tam "
                    f"`socket.SOMAXCONN`.")
              bad += 1
          else:
              print(f"{SRC}: fronta spojení {queue} ✓")

          # Bazén na sťahovanie úsekov musí byť jeden na proces. Keď sa vyrába
          # v `_send_multipart`, nie je to strop, ale násobenie: pri `--jobs 6`
          # je z „12 vlákien" 72 a rastie to s tým, čo sa ladí kvôli rýchlosti.
          for node in ast.walk(tree):
              if (isinstance(node, ast.FunctionDef)
                      and node.name == "_send_multipart"):
                  for inner in ast.walk(node):
                      if (isinstance(inner, ast.Call)
                              and getattr(inner.func, "id", "")
                              == "ThreadPoolExecutor"):
                          print(f"::error file={SRC}::`_send_multipart` si "
                                f"vyrába vlastný ThreadPoolExecutor – potom "
                                f"FETCH_WORKERS neohraničuje nič. Ber ho "
                                f"z `fetch_pool()`.")
                          bad += 1

          # A GDAL musí mať povolené opakovanie a krátky čas na spojenie –
          # inak čaká, kým sa nevzdá jadro, a jedno stratené spojenie
          # z desaťtisícov je koncom hodinovej práce.
          env_src = open(SRC).read()
          for key in ("GDAL_HTTP_MAX_RETRY", "GDAL_HTTP_CONNECTTIMEOUT"):
              if key not in env_src:
                  print(f"::error file={SRC}::`gdal_env()` nenastavuje {key} "
                        f"– GDAL predvolene neopakuje nič.")
                  bad += 1
              else:
                  print(f"{SRC}: {key} ✓")

          # Časť sklonu sa musí dať skúsiť znova. Jedna stratená časť zo 47
          # nesmie zhodiť beh, ktorý má zvyšok hotový.
          tries = None
          for node in ast.walk(ast.parse(open("workers/slope-chunks.py").read())):
              if (isinstance(node, ast.Call)
                      and getattr(node.func, "attr", "") == "add_argument"
                      and node.args
                      and getattr(node.args[0], "value", "") == "--tries"):
                  for kw in node.keywords:
                      if kw.arg == "default":
                          tries = getattr(kw.value, "value", None)
          if not isinstance(tries, int) or tries < 2:
              print("::error file=workers/slope-chunks.py::`--tries` chýba "
                    "alebo je menšie než 2 – jedna stratená časť potom zhodí "
                    "celý beh (31338803278).")
              bad += 1
          else:
              print(f"workers/slope-chunks.py: pokusov na časť {tries} ✓")

          sys.exit(1 if bad else 0)
          PY

      # To isté pre tri výbery výškového zdroja (`contour_source`,
      # `rock_source`, `shading_source`): musia sedieť s kľúčmi
      # v workers/dem-sources.json a s tým, pre ktoré vrstvy sa zdroj ponúka
      # (kľúč `for`). Bez toho sa dá pridať zdroj do JSONu a zabudnúť naň vo
      # formulári (alebo naopak) – a zistí sa to až tým, že build vezme
      # nesprávny release. Alebo sa `ugkk` objaví v tieňovaní, kde 1 m LiDAR
      # nie je (máme ho len na výrez, tieňovanie chce celý región).
      - name: Výbery výšok sedia s dem-sources.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, yaml
          d = yaml.safe_load(open(".github/workflows/build-map.yml"))
          on = d[[k for k in d if k is True or k == "on"][0]]
          inputs = on["workflow_dispatch"]["inputs"]
          srcs = {k: v.get("for", [])
                  for k, v in json.load(open("workers/dem-sources.json")).items()
                  if not k.startswith("_")}
          # (input, ktoré vrstvy, čo je vo výbere navyše k modelom)
          want = {
              "contour_source": ("contours", []),
              # Skaly majú okrem modelov ešte hotové polygóny z tieňovania.
              "rock_source": ("rocks", ["tienovanie"]),
              "shading_source": ("shading", []),
          }
          bad = 0
          for name, (layer, extra) in want.items():
              opts = inputs[name]["options"]
              expect = [k for k, f in srcs.items() if layer in f] + extra + ["ziadne"]
              if sorted(opts) != sorted(expect):
                  print(f"::error::Výber `{name}` nesedí s workers/dem-sources.json")
                  print(f"  vo workflowe: {opts}")
                  print(f"  malo by byť:  {expect}")
                  bad += 1
                  continue
              print(f"{name}: {len(opts)} možností ✓")
          # `ziadne` je hodnota, ktorou sa vrstva vypína – keby vypadla
          # z niektorého výberu, nedala by sa tá vrstva vôbec nezapnúť.
          sys.exit(1 if bad else 0)
          PY

      # KROK, KTORÝ VOLÁ `workers/*.sh`, MU MUSÍ DAŤ VŠETKO, ČO SKRIPT ČÍTA.
      # Toto je tichá chyba presunu shellu z YAMLu do `workers/`: `${{ výraz }}`
      # sa zmení na `$PREMENNÚ`, tá sa zabudne dopísať do `env:` a skript beží
      # s prázdnym reťazcom. Nespadne – vyrobí prázdny bbox, prázdny kľúč cache
      # alebo asset s menom `ugkk-.tif`, a zistí sa to o desať minút inde.
      #
      # Zároveň sa kontroluje, že `steps.<id>.outputs` naozaj má svoj krok.
      # Kontrola „Odkazy medzi jobmi" nižšie pozerá na `needs.<job>.outputs`,
      # na `steps.<id>` nie – a práve premenovanie kroku pri takom presune to
      # rozbije: `id: tiles` → `id: pmtiles` a výstupy jobu ostanú prázdne.
      - name: Skripty vo workers dostávajú svoje env
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, re, sys, yaml

          # Dáva ich GitHub alebo shell sám; `GH_TOKEN` a spol. číta nástroj
          # pod skriptom, takže sa v jeho texte nemusia objaviť.
          BUILTIN = {
              "GITHUB_OUTPUT", "GITHUB_ENV", "GITHUB_PATH", "GITHUB_STEP_SUMMARY",
              "GITHUB_WORKSPACE", "GITHUB_REPOSITORY", "GITHUB_REF", "GITHUB_SHA",
              "GITHUB_RUN_ID", "GITHUB_RUN_NUMBER", "GITHUB_SERVER_URL",
              "GITHUB_ACTOR", "GITHUB_EVENT_NAME", "GITHUB_TOKEN", "RUNNER_OS",
              "RUNNER_TEMP", "AGENT_TOOLSDIRECTORY", "HOME", "PATH", "PWD",
              "TMPDIR", "USER", "SHELL", "IFS", "RANDOM", "LINENO", "OSTYPE",
              "GH_TOKEN", "GDAL_CACHEMAX", "PROJ_NETWORK", "PYTHONUNBUFFERED",
              "GDRIVE_CREDENTIALS", "DRIVE_CLIENT", "DRIVE_SECRET", "DRIVE_REFRESH",
          }

          def bez_komentarov(s):
              return "\n".join(l for l in s.split("\n") if not re.match(r"^\s*#", l))

          def bez_apostrofov(s):
              """`'…'` preč – bash v nich nič nerozvíja, takže `$r` z jq programu
              (`jq --arg r … '.[$r].name'`) nie je premenná prostredia."""
              out, i, in_d = [], 0, False
              while i < len(s):
                  c = s[i]
                  if c == "\\" and i + 1 < len(s):
                      out.append(s[i:i + 2]); i += 2; continue
                  if c == '"':
                      in_d = not in_d
                  if c == "'" and not in_d:
                      j = s.find("'", i + 1)
                      if j < 0:
                          break
                      i = j + 1; continue
                  out.append(c); i += 1
              return "".join(out)

          def nastavene(s):
              """Čo si skript nastaví sám (vrátane `local a b c` a `mapfile`)."""
              s = bez_komentarov(s)
              out = set(re.findall(
                  r"(?:^|[;&|(]|\bexport\s+|\blocal\s+|\bdeclare\s+-\w+\s+)"
                  r"\s*([A-Za-z_][A-Za-z0-9_]*)=", s, re.M))
              out |= set(re.findall(r"\bfor\s+([A-Za-z_][A-Za-z0-9_]*)\s+in\b", s))
              out |= set(re.findall(
                  r"\b(?:mapfile|readarray)\s+(?:-\w+\s+)*([A-Za-z_][A-Za-z0-9_]*)", s))
              for m in re.findall(r"\bread\b([^\n]*)$", s, re.M):
                  out |= set(re.findall(r"(?<!-)\b([A-Za-z_][A-Za-z0-9_]*)\b(?!=)", m))
              for m in re.findall(r"^\s*(?:local|declare|typeset)\s+(.+)$", s, re.M):
                  for tok in m.split():
                      out.add(re.split(r"=", tok)[0])
              # `source súbor` – čo z neho príde, sa staticky zistiť nedá
              if re.search(r"^\s*(?:source|\.)\s+\S", s, re.M):
                  out.add("__SOURCED__")
              return {v for v in out if re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", v)}

          def citane(s):
              """Čo skript číta a musí mu to niekto dať. `${VAR:-x}` sa neráta –
              na ten prípad má predvolenú hodnotu."""
              s = bez_apostrofov(bez_komentarov(s))
              volitelne = set(re.findall(r"\$\{([A-Za-z_][A-Za-z0-9_]*)(?::?[-=+])", s))
              out = set(re.findall(r"\$\{#?([A-Za-z_][A-Za-z0-9_]*)", s))
              out |= set(re.findall(r"\$([A-Za-z_][A-Za-z0-9_]*)", s))
              # vnorený node/python si prostredie číta po svojom
              out |= set(re.findall(r"process\.env\.([A-Za-z_][A-Za-z0-9_]*)", s))
              out |= set(re.findall(r"environ(?:\.get\(|\[)[\"']([A-Za-z_][A-Za-z0-9_]*)", s))
              return out - volitelne

          # Otvárací token sa SKLADÁ, nepíše. Keby tu stál doslova, mal by tento
          # súbor presne tú chybu, ktorú hľadá – actionlint by ho skúsil
          # prečítať ako výraz a zhodil by sa na ňom (a zhodil aj sám seba).
          OPEN = "$" + "{" * 2

          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              wf = yaml.safe_load(open(path)) or {}
              for job_name, job in (wf.get("jobs") or {}).items():
                  for st in job.get("steps") or []:
                      run = (st.get("run") or "").strip()
                      m = re.fullmatch(r"(?:bash\s+|sh\s+)?(workers/[\w.-]+\.sh)", run)
                      if not m:
                          continue
                      skript = m.group(1)
                      if not os.path.exists(skript):
                          print(f"::error file={path}::{job_name} / "
                                f"{st.get('name')}: {skript} neexistuje")
                          bad += 1
                          continue
                      text = open(skript).read()
                      if OPEN in text:
                          print(f"::error file={skript}::ostal v ňom výraz "
                                f"workflowu ({OPEN} …) – v shelli sa "
                                f"nevyhodnotí, skončí ako holý text")
                          bad += 1
                      dane = (set(wf.get("env") or {}) | set(job.get("env") or {})
                              | set(st.get("env") or {}) | nastavene(text) | BUILTIN)
                      chyba = sorted(v for v in citane(text)
                                     if v not in dane and not v.isdigit()
                                     and not ("__SOURCED__" in dane and v.islower()))
                      if chyba:
                          print(f"::error file={path}::{job_name} / "
                                f"{st.get('name')} → {skript}: skript číta "
                                f"{chyba} z prostredia, ale krok mu to nedáva. "
                                f"Doplň to do `env:` kroku – inak beží "
                                f"s prázdnym reťazcom a nespadne.")
                          bad += 1

              # `steps.<id>.outputs` musí mať svoj krok
              for job_name, job in (wf.get("jobs") or {}).items():
                  ids = {s["id"] for s in (job.get("steps") or []) if s.get("id")}
                  blob = yaml.dump(job, allow_unicode=True)
                  for ref in sorted(set(re.findall(
                          r"steps\.([A-Za-z0-9_-]+)\.outputs", blob))):
                      if ref not in ids:
                          print(f"::error file={path}::job '{job_name}' sa "
                                f"odkazuje na steps.{ref}.outputs, ale taký krok "
                                f"v ňom nie je (má: {sorted(ids)}). Premenovaný "
                                f"krok = ticho prázdny výstup jobu.")
                          bad += 1
          print(f"skripty vo workers a ich env: {bad} chýb")
          sys.exit(1 if bad else 0)
          PY

      # actionlint kontroluje schému a výrazy, ale nie to, či `needs.X.outputs.Y`
      # naozaj existuje ako výstup jobu X. To je vlastná kontrola – práve na
      # tomto sa dá po rozdelení na joby ticho pomýliť.
      - name: Odkazy medzi jobmi
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, re, sys, yaml
          errs = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              txt = open(path).read()
              # Komentáre preč – kontrola je textová, takže by inak našla
              # `needs.…` aj v komentári, ktorý JU SAMU popisuje. (Presne
              # to sa aj stalo.) Zahadzujú sa len celé zakomentované riadky,
              # nie `#` uprostred príkazu, kde môže byť súčasťou textu.
              txt = re.sub(r"^[ \t]*#.*$", "", txt, flags=re.M)
              jobs = (yaml.safe_load(txt) or {}).get("jobs") or {}
              starts = {}
              for j in jobs:
                  m = re.search(r"^  " + re.escape(j) + r":$", txt, re.M)
                  if m:
                      starts[j] = m.start()
              if not starts:
                  continue
              def job_of(pos):
                  return max(((j, p) for j, p in starts.items() if p < pos),
                             key=lambda x: x[1])[0]
              for m in re.finditer(r"needs\.([a-zA-Z0-9_-]+)\.(outputs\.([a-zA-Z0-9_]+)|result)", txt):
                  tgt, cur = m.group(1), job_of(m.start())
                  needs = jobs[cur].get("needs") or []
                  if isinstance(needs, str):
                      needs = [needs]
                  if tgt not in needs:
                      print(f"::error file={path}::job '{cur}' používa needs.{tgt}, ale nemá ho v needs")
                      errs += 1
                      continue
                  key = m.group(3)
                  if key and key not in (jobs[tgt].get("outputs") or {}):
                      print(f"::error file={path}::job '{tgt}' nemá výstup '{key}' (chce ho '{cur}')")
                      errs += 1
          print(f"odkazov medzi jobmi: {errs} chýb")
          sys.exit(1 if errs else 0)
          PY

      # POSLEDNÝ V JOBE ZÁMERNE. Táto kontrola je červená UŽ NA MASTERI – na
      # šiestich súboroch, ktoré sa ešte nerozdelili (`build-map.yml`,
      # `shading-rocks.py`, `lint-workflows.yml`, `dmr5-drive.py`,
      # `drive-auth.py`, `dmr5-raster.py`); commit 8b034a0 to hovorí a označuje
      # za samostatnú úlohu. Kým stála tretia, job na nej spadol a VŠETKY
      # kontroly za ňou sa preskočili – teda celý zmysel tohto workflowu.
      # (Zistilo sa to na behu 31377123600: nová kontrola štýlu ani
      # publikovania sa v ňom nikdy nespustila.)
      #
      # Nezmäkčuje sa a nevynímajú sa súbory: job je ďalej červený a strop
      # platí. Len sa to dozvieš SPOLU so všetkým ostatným, nie NAMIESTO toho.
      # Dlhý súbor sa nedá naraz prehliadnuť a platí preň to isté ako pre
      # veľkosť workflowu vyššie: keď run: blok alebo skript prerastie
      # rozumnú dĺžku, ďalšia zmena v ňom už nevidí, čo tam je, a pridáva
      # vedľa namiesto toho, aby použila to, čo tam už je (pravidlo 1
      # v CLAUDE.md). Dlhý krok/skript sa má rozdeliť na viac súborov alebo
      # jobov (pravidlo 5), nie rásť donekonečna v jednom.
      - name: Súbory pod 801 riadkov
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys
          LIMIT = 800
          bad = 0
          for pattern in (".github/workflows/*.yml",
                          "workers/*.py", "workers/*.sh", "workers/*.mjs"):
              for path in sorted(glob.glob(pattern)):
                  with open(path, encoding="utf-8") as f:
                      n = sum(1 for _ in f)
                  if n > LIMIT:
                      print(f"::error file={path}::{n} riadkov, strop je "
                            f"{LIMIT}. Rozdeľ na viac krokov/súborov "
                            f"(pravidlo 5 v CLAUDE.md) – v jednom dlhom "
                            f"súbore sa nedá rýchlo nájsť, čo sa zmenilo "
                            f"alebo prečo to spadlo.")
                      bad += 1
                  else:
                      print(f"{path}: {n} riadkov ✓")
          sys.exit(1 if bad else 0)
          PY
