      opt_rock_dem: ${{ steps.s.outputs.x }}
      opt_shading_source: ${{ steps.s.outputs.x }}
      opt_crop_bbox: ${{ steps.s.outputs.x }}
      opt_size_limit_mb: ${{ steps.s.outputs.x }}
      opt_auto_shrink: ${{ steps.s.outputs.x }}
