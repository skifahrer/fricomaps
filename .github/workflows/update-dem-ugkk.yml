name: Update DEM (ÚGKK 1 m)

# Zoženie 1 m LiDAR od ÚGKK (DMR 5.0) pre jeden výrez a odloží ho do releasu
# `dem-ugkk` ako jeden COG. Ďalší build ho už len stiahne – presne tak, ako to
# robí `Update DEM` pre Sonnyho.
#
# SPÚŠŤA SA SÁM. `Build map` s `dem_source: ugkk` sa najprv pozrie, či je výrez
# v releasi, a keď nie je, zavolá tento workflow ako svoju úlohu. Ručne ho
# treba spustiť len vtedy, keď chceš vopred pripraviť ďalšie pohorie alebo
# doplniť `direct_urls`.
#
# PREČO PO VÝREZOCH, A NIE PO 1° DLAŽDICIACH ako Sonny: pri 1 m má jedna 1°
# dlaždica cez 12 miliárd buniek, teda ~48 GB. Metrový model dáva zmysel na
# pohorie, nie na krajinu – asset sa preto volá podľa výrezu.

on:
  workflow_dispatch:
    inputs:
      area:
        description: "Pohorie z workers/areas.json (vysoke_tatry, belianske_tatry…) alebo bbox W,S,E,N"
        required: true
        default: vysoke_tatry
        type: string
      region_bbox:
        description: "Orezať na tento región (prázdne = celé Slovensko)"
        required: false
        default: "16.815,47.71,22.585,49.635"
        type: string
      direct_urls:
        description: "Posledná záchrana: čiarkami oddelené URL na .tif/.zip zo ZBGIS Mapového klienta alebo vládneho cloudu"
        required: false
        default: ""
        type: string
      force:
        description: "Prepísať, aj keď už výrez v release je"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      area:
        required: true
        type: string
      region_bbox:
        required: false
        default: "16.815,47.71,22.585,49.635"
        type: string
      direct_urls:
        required: false
        default: ""
        type: string
      force:
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  UGKK_RELEASE: dem-ugkk

jobs:
  mirror:
    name: Zrkadlo ÚGKK DMR 5.0
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nainštaluj GDAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin

      - name: Vyrieš výrez
        id: area
        run: |
          set -euo pipefail
          python3 workers/resolve-area.py \
            --region-bbox='${{ inputs.region_bbox }}' \
            --area='${{ inputs.area }}' --out="$GITHUB_OUTPUT"

      # Zrkadlo má zmysel len vtedy, keď tam ešte nič nie je. Sťahovanie je
      # na desiatky minút a asset má stovky MB – prepisovať ho pri každom
      # behu by bola len stratená kvóta.
      - name: Je výrez už v release?
        id: have
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          ASSET="ugkk-${{ steps.area.outputs.key }}.tif"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          if [ '${{ inputs.force }}' = 'true' ]; then
            echo "force=áno – sťahujem nanovo."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$UGKK_RELEASE" --repo "$GITHUB_REPOSITORY" \
               --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$ASSET"; then
            echo "V release $UGKK_RELEASE už je $ASSET – nesťahujem."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # `continue-on-error`: keď sa ÚGKK nedá stiahnuť, nie je to dôvod zhodiť
      # celý build. Build sa podľa výsledku rozhodne sám – buď spadne, alebo
      # dopočíta terén zo Sonnyho (input `ugkk_fallback`).
      - name: Stiahni DMR 5.0
        id: fetch
        continue-on-error: true
        if: ${{ steps.have.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          echo "Výrez: ${{ steps.area.outputs.name }} (${{ steps.area.outputs.bbox }}), ${{ steps.area.outputs.km2 }} km²"
          python3 workers/fetch-dem-ugkk.py \
            --bbox='${{ steps.area.outputs.bbox }}' \
            --out='${{ steps.have.outputs.asset }}' \
            --direct-urls='${{ inputs.direct_urls }}'

      - name: Ulož do releasu
        if: ${{ steps.have.outputs.skip != 'true' && steps.fetch.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET='${{ steps.have.outputs.asset }}'
          ls -lh "$ASSET"
          # Release assety majú strop 2 GB. Väčší výrez treba rozdeliť –
          # radšej to povedať tu, než nechať upload zlyhať bez vysvetlenia.
          SZ=$(stat -c%s "$ASSET")
          if [ "$SZ" -gt $((2 * 1024 * 1024 * 1024)) ]; then
            echo "::error::$ASSET má $(( SZ / 1048576 )) MB, GitHub release asset zvládne 2 GB. Zvoľ menší výrez."
            exit 1
          fi
          gh release view "$UGKK_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$UGKK_RELEASE" --repo "$GITHUB_REPOSITORY" \
              --title "ÚGKK DMR 5.0 (1 m LiDAR)" \
              --notes "Zrkadlo 1 m LiDAR modelu terénu od ÚGKK SR, po pohoriach. Jeden COG na výrez; meno assetu je kľúč výrezu z workers/areas.json. Zdroj: ÚGKK SR – DMR 5.0, voľné použitie pri uvedení zdroja."
          gh release upload "$UGKK_RELEASE" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Uložené: $UGKK_RELEASE / $ASSET"

      - name: Súhrn
        if: ${{ always() }}
        run: |
          {
            echo "# ÚGKK DMR 5.0 – ${{ steps.area.outputs.name }}"
            echo
            echo "| vec | hodnota |"
            echo "|---|---|"
            echo "| výrez | \`${{ steps.area.outputs.bbox }}\` |"
            echo "| plocha | ${{ steps.area.outputs.km2 }} km² |"
            echo "| buniek pri 1 m | ${{ steps.area.outputs.cells_1m }} |"
            echo "| asset | \`${{ steps.have.outputs.asset }}\` v release \`$UGKK_RELEASE\` |"
            if [ '${{ steps.have.outputs.skip }}' = 'true' ]; then
              echo "| stav | **už v release – nesťahovalo sa** |"
            elif [ '${{ steps.fetch.outcome }}' = 'success' ]; then
              echo "| stav | **stiahnuté a uložené** |"
            else
              echo "| stav | **nepodarilo sa** – viď log |"
              echo
              echo "ÚGKK dáta sa z GitHub runnera stiahnuť nepodarilo. Build"
              echo "z toho nespadne: s \`ugkk_fallback\` (default zapnuté)"
              echo "dopočíta terén zo Sonnyho 20 m a povie to v atribúcii."
              echo
              echo "**Ako to doplniť natrvalo** (raz, potom to už len sťahuje):"
              echo
              echo "1. ZBGIS Mapový klient → Terén → Export údajov → DMR 5.0,"
              echo "   vyber územie (do 400 km²)"
              echo "2. \`\`\`"
              echo "   gdalbuildvrt all.vrt *.tif"
              echo "   gdal_translate -of COG -co COMPRESS=DEFLATE -co PREDICTOR=3 \\"
              echo "     all.vrt ${{ steps.have.outputs.asset }}"
              echo "   gh release upload $UGKK_RELEASE ${{ steps.have.outputs.asset }} --clobber"
              echo "   \`\`\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
