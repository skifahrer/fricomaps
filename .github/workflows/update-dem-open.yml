name: Update DEM (ÚGKK otvorené dáta)

# Stiahne jeden ZIP z `opendata.skgeodesy.sk`, rozreže ho na 1°×1° dlaždice
# a odloží do releasu `dem-dmr35`. Ďalší build ich už len sťahuje – presne
# tou istou cestou ako Sonnyho, lebo majú tú istú pomenúvaciu schému
# (`N49E019.tif`). Build teda nemusí vedieť nič nové; rozhoduje meno releasu.
#
# SPÚŠŤA SA SÁM, keď `Build map` beží s `dem_source: dmr35` a dlaždice
# v releasi ešte nie sú. Ručne ho treba len na pregenerovanie (`force`).
#
# PREČO TENTO MODEL: 1 m LiDAR (DMR 5.0) sa z GitHub runnera stiahnuť nedá,
# `zbgis.skgeodesy.sk` aj `zbgisws.skgeodesy.sk` timeoutujú aj pri 30 s
# (behy 31072215798, 31075806874, 31096745697). `opendata.skgeodesy.sk` je
# iný stroj – statické súbory bez ArcGIS a bez WAF-u pred mapovým klientom.
# Model je hrubší než DMR 5.0, ale ak má mriežku 10 m, je aj tak dvakrát
# jemnejší než Sonny (20 m), a to je to jediné, čo stropuje detail skál.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL na ZIP (prázdne = z workers/dem-sources.json)"
        required: false
        default: ""
        type: string
      bbox:
        description: "Na aký rozsah krájať dlaždice (default celé Slovensko)"
        required: false
        default: "16.8,47.7,22.6,49.7"
        type: string
      force:
        description: "Pregenerovať, aj keď už dlaždice v release sú"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      url:
        required: false
        default: ""
        type: string
      bbox:
        required: false
        default: "16.8,47.7,22.6,49.7"
        type: string
      force:
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  DMR35_RELEASE: dem-dmr35

jobs:
  mirror:
    name: Zrkadlo ÚGKK DMR 3.5
    runs-on: ubuntu-latest
    # Celé Slovensko pri 10 m je ~490 mil. buniek. Sťahovanie plus krájanie
    # je desiatky minút, nie hodiny – ale ZIP môže byť veľký, tak s rezervou.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nainštaluj GDAL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin

      - name: Sú dlaždice už v release?
        id: have
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          N=$(gh release view "$DMR35_RELEASE" --repo "$GITHUB_REPOSITORY" \
                --json assets -q '.assets | length' 2>/dev/null || echo 0)
          if [ '${{ inputs.force }}' = 'true' ]; then
            echo "force=áno – sťahujem nanovo (v release je $N dlaždíc)."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "${N:-0}" -gt 0 ]; then
            echo "V release $DMR35_RELEASE už je $N dlaždíc – nesťahujem."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # `continue-on-error`: `opendata.skgeodesy.sk` sa z runnera ešte nikdy
      # neskúšal. Keď nepôjde, nie je to dôvod zhodiť beh – build to zistí
      # z prázdneho releasu a spadne späť na Sonnyho.
      - name: Stiahni a rozrež
        id: fetch
        if: ${{ steps.have.outputs.skip != 'true' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p tiles
          python3 workers/fetch-dem-open.py \
            --url='${{ inputs.url }}' \
            --bbox='${{ inputs.bbox }}' \
            --out=tiles \
            --stats=open-stats.txt
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Nahraj do releasu
        if: ${{ steps.have.outputs.skip != 'true' && steps.fetch.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COUNT=$(find tiles -maxdepth 1 -name '*.tif' | wc -l)
          [ "$COUNT" -gt 0 ] || { echo "::warning::Žiadne dlaždice."; exit 0; }
          gh release view "$DMR35_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$DMR35_RELEASE" --repo "$GITHUB_REPOSITORY" \
              --title "Výškový model – ÚGKK DMR 3.5 (otvorené dáta)" \
              --notes "1°×1° dlaždice z https://opendata.skgeodesy.sk. Zdroj: ÚGKK SR."
          find tiles -maxdepth 1 -name '*.tif' -print0 \
            | xargs -0 gh release upload "$DMR35_RELEASE" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Nahraných $COUNT dlaždíc do releasu $DMR35_RELEASE ✓"

      - name: Súhrn
        if: ${{ always() }}
        run: |
          set -uo pipefail
          {
            echo "# ÚGKK DMR 3.5 – otvorené dáta"
            echo
            echo "| vec | hodnota |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s open-stats.txt ]; then
            # shellcheck disable=SC1091
            . open-stats.txt
            {
              echo "| dlaždíc | ${tiles:-?} |"
              echo "| veľkosť | ${mb:-?} MB |"
              echo "| **skutočná mriežka** | **${cell_m:-?} m** (Sonny má 20 m) |"
              echo "| CRS zdroja | ${crs:-?} |"
              echo "| URL | ${url:-?} |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "| stav | nestiahlo sa nič |"
              echo
              echo "Podrobnosti v logu kroku *Stiahni a rozrež*. Ak je príčinou"
              echo "nedostupný hostiteľ, platí to isté ako pri DMR 5.0 a jedinou"
              echo "cestou ostáva ručné nahratie do releasu."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
