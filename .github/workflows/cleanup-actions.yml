name: Upratať Actions

# Zmaže behy, ktoré nie sú záznamom o ničom – a tým aj položky, ktoré po nich
# ostali v ľavom zozname Actions.
#
# PREČO WORKFLOW A NIE PULL REQUEST: behy a vetvy nie sú súbory v repozitári,
# takže sa nedajú zmazať zmenou kódu. Token mimo Actions na to nemá právo
# (`Resource not accessible by integration`), vnútri behu ho `GITHUB_TOKEN`
# má – keď mu to workflow dovolí nižšie v `permissions`.
#
# ČO MAŽE:
#   • behy zrušených workflowov – po zmazanom súbore ostane položka v zozname
#     Actions navždy, zmizne až keď má nula behov (sem patria sondy `zz-*`);
#   • behy odmietnutých súborov – keď je súbor workflowu neplatný, GitHub pri
#     pushi vyrobí beh BEZ JOBOV, pomenovaný cestou k súboru, a vyzerá to, že
#     sa workflow spustil sám po mergi;
#   • voliteľne vetvy `claude/*`, ktoré sú celé v hlavnej vetve.
#
# Čo je normálna história (behy so skutočným menom workflowu, ktorého súbor
# stále existuje), sa nemaže nikdy.

on:
  workflow_dispatch:
    inputs:
      co:
        description: "Čo upratať"
        required: false
        default: behy
        type: choice
        options:
          - behy
          - behy_a_vetvy
      dry_run:
        description: "Len vypísať, čo by sa zmazalo (nič sa nemaže)"
        required: false
        default: false
        type: boolean

permissions:
  actions: write    # mazanie behov
  contents: write   # mazanie vetiev (len pri `behy_a_vetvy`)

concurrency:
  # Dva behy naraz by si navzájom mazali to isté a hádzali 404.
  group: cleanup-actions
  cancel-in-progress: false

jobs:
  upratat:
    name: Upratať Actions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Checkout je tu kvôli jedinej veci: skript sa pozerá, či súbor
      # workflowu ešte existuje. Bez neho by mu všetky vyšli ako zrušené.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upratať
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.co }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 workers/cleanup-actions.py
