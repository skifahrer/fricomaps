name: Rozobrať DMR 5.0

# ÚGKK zverejnil DMR 5.0 (1 m LiDAR) ako otvorené dáta – jeden ZIP na celé
# Slovensko:
#   https://opendata.skgeodesy.sk/static/LLS/DMR5/DMR5_0_sjtsk03_bpv.zip
# Má ~198 GB (zmerané behom 31182614668) a je v S-JTSK [JTSK03], výšky Bpv.
#
# ČO JE V ŇOM (prečítané behom 31184095104, `mode: len plán`):
#
#   dmr5_0/dmr5_jtsk03.tif      151,43 GB  celé Slovensko, 1 m, JEDEN raster
#   dmr5_0/dmr5_jtsk03.tif.ovr   46,28 GB  prehľadové úrovne (pyramídy)
#   dmr5_0/dmr5_jtsk03.tfw                 world file
#   INFO_*.txt, 4× PDF, prehlad_lokalit_*  licencie a prehľad lokalít
#
# Čakali sme textové výškové body po blokoch – nie sú. Je to jeden súvislý
# raster, takže sa po položkách archívu deliť NEDÁ. Zato sa dá čítať priamo:
# GDAL vie `/vsizip//vsicurl/URL/cesta.tif`, ZIP číta cez HTTP Range a GeoTIFF
# je dlaždicovaný, takže si vypýta len to, čo potrebuje. Nič sa nesťahuje
# na disk – a to je dobre, lebo runner má voľných ~60 GB a asset releasu má
# strop 2 GB.
#
#   plan      prečíta centrálny adresár (pár MB) a vypíše CELÝ inventár.
#             Zároveň rozhodne, čo archív je:
#               jeden veľký raster → job `raster`
#               súbory po blokoch  → joby `chunk` + `assemble`
#   raster    jeden job, jeden prechod, hotový model do releasu:
#               výrez        → `ugkk-<vyrez>.tif` do `dem-ugkk`   (1 m)
#               celá krajina → dlaždice `N49E019.tif` do `dem-dmr5` (5 m)
#   chunk /   cesta pre archívy zložené zo samostatných súborov. DMR 5.0
#   assemble  taký nie je, ale mechanika je overená, tak tu ostáva.
#
# ČO STOJÍ ČÍTANIE: položka v ZIPe je zabalená deflate-om a v deflate prúde sa
# nedá skočiť dopredu – dá sa doň len rozbaliť od začiatku. Cena je preto
# úmerná tomu, AKO ĎALEKO V SÚBORE dáta ležia. Zmerané na napodobenine
# (44 MB ZIP, dlaždicovaný DEFLATE GeoTIFF, HTTP server s Range):
#
#   výrez na začiatku rastra     0,5 MB    1 % archívu
#   výrez na konci rastra       44,1 MB  100 % archívu
#   celý raster 1 m → 5 m       37,8 MB   (s .ovr, 1,1 s)
#   to isté bez .ovr            46,1 MB   (2,7 s)
#
# Preto sa celá krajina prevzorkúva JEDNÝM prechodom a na 1° dlaždice sa krája
# až hotový malý raster – N výrezov priamo zo zdroja by stálo N× cestu od
# začiatku súboru.
#
# DVA SPÔSOBY, AKO SI VYPÝTAŤ MENEJ:
#   `area`    pohorie alebo bbox. Pri rastri to rieši gdalwarp a funguje vždy.
#             Pri archíve po blokoch potrebuje vedieť, kde blok leží; keď sa
#             to z mena súboru nedá prečítať, plán skončí chybou a nie tichým
#             stiahnutím celého archívu (to sa stalo v behu 31182614668).
#   `folder`  priečinok (alebo vzor) v archíve. Funguje vždy – je to len meno.
#             Pri jednom veľkom rastri ale nemá čo zúžiť.
#
# ROZLÍŠENIE VS. ÚZEMIE. Pri 1 m má jedna 1°×1° dlaždica ~48 GB, takže:
#   * výrez (pohorie, do ~500 km²) sa dá spraviť v plnom 1 m rozlíšení,
#   * celé Slovensko musí ísť na hrubšiu mriežku (predvolene 5 m) – aj tak je
#     to štyrikrát jemnejšie než Sonny (20 m) a dvakrát než DMR 3.5 (10 m).
# Workflow to ustráži sám a povie, keď si vypýtaš niečo, čo sa do releasu
# nezmestí.
#
# Licencia ÚGKK: voľné použitie vrátane komerčného pri uvedení zdroja
# (ÚGKK SR) – atribúcia je v poc/web/themes.js.
#
# POZOR pri úpravách: `workflow_dispatch` dovolí najviac 10 inputov a tento
# workflow ich má PRESNE 10. Jedenásty by GitHub odmietol tak, že by workflow
# ani nenačítal – beh by skončil ako „failure" s nula jobmi a prázdnym logom
# (viď komentár v lint-workflows.yml). Ďalší input sa musí niečím nahradiť.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL archívu (statické úložisko musí vedieť HTTP Range)"
        required: false
        default: "https://opendata.skgeodesy.sk/static/LLS/DMR5/DMR5_0_sjtsk03_bpv.zip"
        type: string
      folder:
        description: "Len tento priečinok v archíve. Viac oddeľ čiarkou, dá sa aj vzor „*34-12*“. Pri DMR 5.0 nemá čo zúžiť – je to jeden raster. Prázdne = celý archív"
        required: false
        default: ""
        type: string
      area:
        description: "Územie: „cele“ = celé Slovensko (mriežka 5 m, do releasu dem-dmr5), alebo pohorie z workers/areas.json (1 m, do dem-ugkk), alebo bbox W,S,E,N"
        required: false
        default: cele
        type: string
      mode:
        description: "Čo z toho vypadne. Prvý beh na neznámom archíve nech je „len plán“"
        required: false
        default: "raster (DEM)"
        type: choice
        options:
          - "raster (DEM)"
          - "len plán – nič sa nesťahuje"
          - "body (raw) – pôvodné súbory ako artefakty"
          - "raster aj body"
      grid_m:
        description: "Mriežka v metroch; „auto“ = 1 m na výrez, 5 m na celé Slovensko"
        required: false
        default: auto
        type: string
      chunk_mb:
        description: "Len pre archívy po blokoch: koľko komprimovaných MB na jednu časť (= jeden job)"
        required: false
        default: "2048"
        type: string
      max_parallel:
        description: "Len pre archívy po blokoch: koľko častí naraz (aj ohľaduplnosť voči opendata.skgeodesy.sk)"
        required: false
        default: "8"
        type: string
      max_chunks:
        description: "Len pre archívy po blokoch: spracovať len prvých N častí (0 = všetky)"
        required: false
        default: "0"
        type: string
      retention_days:
        description: "Ako dlho držať artefakty s časťami"
        required: false
        default: "7"
        type: string
      release_tag:
        description: "Do ktorého releasu uložiť výsledok (prázdne = podľa územia)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  # Dva behy naraz by z toho istého servera ťahali dvojnásobok a prepisovali
  # si tie isté assety.
  group: dmr5-${{ inputs.area }}
  cancel-in-progress: false

jobs:
  # ---------- čo je v archíve a ako sa rozdelí ----------
  # Beží pár minút a nestiahne ani jeden výškový bod – číta len centrálny
  # adresár a z niekoľkých položiek prvé kilobajty.
  plan:
    name: Plán (čo je v archíve)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      matrix: ${{ steps.plan.outputs.matrix }}
      entries: ${{ steps.plan.outputs.entries }}
      download_bytes: ${{ steps.plan.outputs.download_bytes }}
      has_position: ${{ steps.plan.outputs.has_position }}
      layout: ${{ steps.plan.outputs.layout }}
      member: ${{ steps.plan.outputs.member }}
      area_key: ${{ steps.plan.outputs.area_key }}
      whole_country: ${{ steps.plan.outputs.whole_country }}
      grid: ${{ steps.cfg.outputs.grid }}
      mode: ${{ steps.cfg.outputs.mode }}
      release: ${{ steps.cfg.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nainštaluj pyproj
        run: python3 -m pip install --quiet --upgrade pyproj

      # Jedno miesto, kde sa z formulára stanú konkrétne čísla a mená. Ostatné
      # kroky už len čítajú výstupy – dvakrát počítať to isté sa vždy raz
      # rozíde.
      - name: Nastavenia
        id: cfg
        run: |
          set -euo pipefail
          AREA='${{ inputs.area }}'
          case '${{ inputs.mode }}' in
            "len plán"*)   MODE=plan ;;
            "body (raw)"*) MODE=raw ;;
            "raster aj"*)  MODE=both ;;
            *)             MODE=dem ;;
          esac

          # „cele" ide na dlaždice ako Sonny a DMR 3.5; výrez ide na jeden COG
          # presne tak, ako to už čaká workers/fetch-dem.sh pre `ugkk`.
          WHOLE=false
          case "${AREA,,}" in
            ""|cele|cele_slovensko|all|vsetko) WHOLE=true ;;
          esac

          GRID='${{ inputs.grid_m }}'
          if [ "${GRID,,}" = auto ]; then
            GRID=$([ "$WHOLE" = true ] && echo 5 || echo 1)
          fi
          case "$GRID" in
            ''|*[!0-9.]*|.|*.*.*)
              echo "::error::grid_m musí byť číslo v metroch alebo „auto“, nie „$GRID“."
              exit 1 ;;
          esac

          REL='${{ inputs.release_tag }}'
          if [ -z "${REL//[[:space:]]/}" ]; then
            REL=$([ "$WHOLE" = true ] && echo dem-dmr5 || echo dem-ugkk)
          fi

          # Strážca, ktorý ušetrí hodiny počítania: pri 1 m má jedna 1°×1°
          # dlaždica ~48 GB a asset releasu má strop 2 GB. Celé Slovensko
          # v jemnej mriežke sa teda nemá kam uložiť a je lepšie to povedať
          # teraz než po ôsmich hodinách sťahovania.
          if [ "$WHOLE" = true ] && awk "BEGIN{exit !($GRID < 3)}"; then
            echo "::error::Celé Slovensko pri mriežke ${GRID} m sa do releasu nezmestí (1°×1° dlaždica by mala vyše 5 GB, strop assetu je 2 GB). Daj grid_m aspoň 3 (odporúčané 5), alebo zvoľ výrez."
            exit 1
          fi

          {
            echo "mode=$MODE"
            echo "grid=$GRID"
            echo "release=$REL"
          } >> "$GITHUB_OUTPUT"
          echo "── režim $MODE, mriežka ${GRID} m, release $REL, územie ${AREA:-cele}"

      - name: Prečítaj obsah archívu
        id: plan
        run: |
          set -euo pipefail
          python3 workers/dmr5-plan.py \
            --url='${{ inputs.url }}' \
            --area='${{ inputs.area }}' \
            --include='${{ inputs.folder }}' \
            --chunk-mb='${{ inputs.chunk_mb }}' \
            --max-chunks='${{ inputs.max_chunks }}' \
            --out=plan.json --matrix=matrix.json --summary=plan-summary.md

      - name: Odlož plán
        uses: actions/upload-artifact@v4
        with:
          name: dmr5-plan
          path: plan.json
          retention-days: ${{ inputs.retention_days }}
          compression-level: 9

      - name: Súhrn
        if: ${{ always() }}
        run: |
          set -uo pipefail
          [ -s plan-summary.md ] && cat plan-summary.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo "| nastavenie | hodnota |"
            echo "|---|---|"
            echo "| režim | \`${{ steps.cfg.outputs.mode }}\` |"
            echo "| mriežka | ${{ steps.cfg.outputs.grid }} m |"
            echo "| release | \`${{ steps.cfg.outputs.release }}\` |"
            echo "| archív | ${{ inputs.url }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------- archív je jeden veľký raster ----------
  # Toto je cesta pre DMR 5.0. Archív nie sú body po blokoch, ale JEDEN
  # GeoTIFF (151 GB) – ten sa po položkách archívu deliť nedá, zato ho GDAL
  # prečíta priamo cez `/vsizip//vsicurl/`. Žiadny matrix, žiadne artefakty
  # s medzivýsledkami: jeden job, jeden prechod, hotový model do releasu.
  raster:
    name: Raster priamo z archívu
    needs: plan
    if: ${{ needs.plan.outputs.mode != 'plan' && needs.plan.outputs.layout == 'raster' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nainštaluj GDAL
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin jq

      - name: Uvoľni miesto na disku
        run: |
          set -uo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Vezmi plán
        uses: actions/download-artifact@v4
        with:
          name: dmr5-plan

      # Pri celej krajine je to jeden sekvenčný prechod cez 151 GB – deflate
      # v ZIPe sa preskakovať nedá, takže cena je daná tým, ako ďaleko
      # v súbore dáta ležia. Pri výreze číta gdalwarp len svoje okno.
      - name: Vyrež model
        id: cut
        run: |
          set -euo pipefail
          ASSET="ugkk-${{ needs.plan.outputs.area_key }}.tif"
          python3 workers/dmr5-raster.py \
            --url='${{ inputs.url }}' \
            --plan=plan.json \
            --member='${{ needs.plan.outputs.member }}' \
            --area='${{ inputs.area }}' \
            --grid-m='${{ needs.plan.outputs.grid }}' \
            --out=out --work=raster-work --asset="$ASSET" \
            --summary=raster-summary.md

      - name: Nahraj do releasu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='${{ needs.plan.outputs.release }}'
          shopt -s nullglob
          FILES=(out/*.tif)
          [ ${#FILES[@]} -gt 0 ] || { echo "::error::Nevznikol ani jeden súbor."; exit 1; }

          BIG=0
          for f in "${FILES[@]}"; do
            SZ=$(stat -c%s "$f")
            if [ "$SZ" -gt $((2 * 1024 * 1024 * 1024)) ]; then
              echo "::error::$f má $(( SZ / 1048576 )) MB, strop assetu je 2 GB. Zvoľ hrubšiu grid_m alebo menší výrez."
              BIG=1
            fi
          done
          [ "$BIG" -eq 0 ] || exit 1

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Výškový model – ÚGKK DMR 5.0 (LLS, otvorené dáta)" \
              --notes "Z archívu DMR5_0_sjtsk03_bpv.zip (~198 GB), čítaného priamo cez /vsizip//vsicurl/. Zdroj: ÚGKK SR, voľné použitie pri uvedení zdroja."

          jq -n \
            --arg src "ÚGKK SR – DMR 5.0 (LLS)" \
            --arg url '${{ inputs.url }}' \
            --arg member '${{ needs.plan.outputs.member }}' \
            --arg area '${{ needs.plan.outputs.area_key }}' \
            --arg grid '${{ needs.plan.outputs.grid }}' \
            --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson files "$(printf '%s\n' "${FILES[@]}" | xargs -n1 basename | jq -R . | jq -s .)" \
            '{source:$src, url:$url, member:$member, area:$area, cell_m:($grid|tonumber), built_at:$built, files:$files}' \
            > out/meta-dmr5.json
          cat out/meta-dmr5.json

          gh release upload "$TAG" "${FILES[@]}" out/meta-dmr5.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "V releasi $TAG: ${#FILES[@]} súborov ✓"

      - name: Súhrn
        if: ${{ always() }}
        run: |
          set -uo pipefail
          [ -s raster-summary.md ] && cat raster-summary.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo "Build mapy to vezme cez \`dem_source: ${{ needs.plan.outputs.whole_country == 'true' && 'dmr5' || 'ugkk' }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------- jedna časť = jeden súvislý prenos ----------
  # Cesta pre archívy, ktoré SÚ zložené zo samostatných súborov po blokoch.
  # DMR 5.0 taký nie je (viď job vyššie), ale iné zdroje výšok tak vyzerajú
  # a mechanika je overená – tak tu ostáva.
  chunk:
    name: Časť ${{ matrix.id }}
    needs: plan
    if: ${{ needs.plan.outputs.mode != 'plan' && needs.plan.outputs.layout != 'raster' && needs.plan.outputs.chunks != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nainštaluj GDAL a numpy
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin zstd
          python3 -m pip install --quiet --upgrade numpy pyproj

      # V režime `raw` a `raster aj body` sa pôvodné súbory ukladajú na disk
      # a predinštalovaný softvér runnera je zrazu to jediné, čo prekáža.
      - name: Uvoľni miesto na disku
        if: ${{ needs.plan.outputs.mode != 'dem' }}
        run: |
          set -uo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Vezmi plán
        uses: actions/download-artifact@v4
        with:
          name: dmr5-plan

      - name: Stiahni úsek a sprav raster
        run: |
          set -euo pipefail
          python3 workers/dmr5-chunk.py \
            --plan=plan.json --chunk='${{ matrix.id }}' \
            --mode='${{ needs.plan.outputs.mode }}' \
            --grid-m='${{ needs.plan.outputs.grid }}' \
            --out=chunk

      # Jeden .tar.zst namiesto stoviek malých súborov: upload aj download
      # artefaktu ide po súboroch a pri 500 blokoch je réžia väčšia než dáta.
      - name: Zbaľ
        id: pack
        run: |
          set -euo pipefail
          if [ -d chunk/dem ]; then
            tar -I 'zstd -9 -T0' -cf "dmr5-dem-${{ matrix.id }}.tar.zst" -C chunk dem
          fi
          if [ -d chunk/raw ]; then
            tar -cf "dmr5-raw-${{ matrix.id }}.tar" -C chunk raw
          fi
          ls -lh dmr5-*.tar* chunk/stats.json
          python3 -c "import json;s=json.load(open('chunk/stats.json'));print('\n'.join(f'{k}={v}' for k,v in s.items()))" \
            >> "$GITHUB_OUTPUT"

      - name: Odovzdaj časť
        uses: actions/upload-artifact@v4
        with:
          name: dmr5-chunk-${{ matrix.id }}
          path: |
            dmr5-dem-${{ matrix.id }}.tar.zst
            dmr5-raw-${{ matrix.id }}.tar
            chunk/stats.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
          # Obsah je už komprimovaný (zstd, gzip, DEFLATE v GeoTIFFe) –
          # zipovať ho druhýkrát je len stratený čas.
          compression-level: 0

      - name: Súhrn
        if: ${{ always() }}
        run: |
          set -uo pipefail
          {
            echo "### Časť ${{ matrix.id }}"
            echo
            echo "| rastrov | bodov | buniek | čas |"
            echo "|---|---|---|---|"
            echo "| ${{ steps.pack.outputs.rasters }} | ${{ steps.pack.outputs.points }} | ${{ steps.pack.outputs.cells }} | ${{ steps.pack.outputs.seconds }} s |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------- z častí jeden model, ktorý build mapy vie čítať ----------
  assemble:
    name: Zložiť výškový model
    needs: [plan, chunk]
    if: ${{ !cancelled() && needs.plan.outputs.mode != 'plan' && needs.plan.outputs.mode != 'raw' && needs.plan.outputs.layout != 'raster' && needs.plan.outputs.chunks != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nainštaluj GDAL
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin zstd jq

      - name: Uvoľni miesto na disku
        run: |
          set -uo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Vezmi všetky časti
        uses: actions/download-artifact@v4
        with:
          pattern: dmr5-chunk-*
          merge-multiple: true
          path: parts

      - name: Rozbaľ rastre
        id: unpack
        run: |
          set -euo pipefail
          mkdir -p blocks
          shopt -s nullglob
          n=0
          for a in parts/dmr5-dem-*.tar.zst; do
            tar -I zstd -xf "$a" -C blocks --strip-components=1
            n=$(( n + 1 ))
          done
          COUNT=$(find blocks -name '*.tif' | wc -l)
          echo "Častí: $n, rastrov: $COUNT, $(du -sh blocks | cut -f1)"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Ani jedna časť nedodala raster – pozri logy jobov „Časť …“."
            exit 1
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      # Zlepenie a prevod do WGS84 je jediné miesto, kde sa terén prevzorkuje.
      # Časti zámerne odovzdávajú natívne S-JTSK, aby sa to nestalo dvakrát.
      - name: Zlep a preveď do WGS84
        id: build
        run: |
          set -euo pipefail
          find blocks -name '*.tif' > blocks.txt
          gdalbuildvrt -q -resolution highest -input_file_list blocks.txt all.vrt
          gdalinfo all.vrt | grep -E 'Size is|Pixel Size|Upper Left|Lower Right'

          mkdir -p out
          if [ '${{ needs.plan.outputs.whole_country }}' = 'true' ]; then
            # Rovnaká schéma ako Sonny a DMR 3.5 – build si potom stiahne len
            # dlaždice pre svoj bbox a nič sa nemusí učiť.
            python3 workers/dem-tiles.py --out out all.vrt
            echo "kind=tiles" >> "$GITHUB_OUTPUT"
          else
            # Výrez ide ako jeden COG s menom, aké čaká workers/fetch-dem.sh.
            gdalwarp -q -overwrite -t_srs EPSG:4326 -r bilinear \
              -of COG -co COMPRESS=DEFLATE -co PREDICTOR=3 -co RESAMPLING=BILINEAR \
              all.vrt "out/ugkk-${{ needs.plan.outputs.area_key }}.tif"
            echo "kind=cog" >> "$GITHUB_OUTPUT"
          fi
          ls -lh out
          du -sh out

      - name: Nahraj do releasu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='${{ needs.plan.outputs.release }}'
          shopt -s nullglob
          FILES=(out/*.tif)
          [ ${#FILES[@]} -gt 0 ] || { echo "::error::Nevznikol ani jeden súbor."; exit 1; }

          # Strop assetu je 2 GB. Radšej to povedať menom súboru než nechať
          # `gh release upload` spadnúť bez vysvetlenia.
          BIG=0
          for f in "${FILES[@]}"; do
            SZ=$(stat -c%s "$f")
            if [ "$SZ" -gt $((2 * 1024 * 1024 * 1024)) ]; then
              echo "::error::$f má $(( SZ / 1048576 )) MB, strop assetu je 2 GB. Zvoľ hrubšiu grid_m alebo menší výrez."
              BIG=1
            fi
          done
          [ "$BIG" -eq 0 ] || exit 1

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Výškový model – ÚGKK DMR 5.0 (LLS, otvorené dáta)" \
              --notes "Z archívu DMR5_0_sjtsk03_bpv.zip (~198 GB), čítaného po úsekoch cez HTTP Range. Zdroj: ÚGKK SR, voľné použitie pri uvedení zdroja."

          jq -n \
            --arg src "ÚGKK SR – DMR 5.0 (LLS)" \
            --arg url '${{ inputs.url }}' \
            --arg area '${{ needs.plan.outputs.area_key }}' \
            --arg grid '${{ needs.plan.outputs.grid }}' \
            --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson files "$(printf '%s\n' "${FILES[@]}" | xargs -n1 basename | jq -R . | jq -s .)" \
            '{source:$src, url:$url, area:$area, cell_m:($grid|tonumber), built_at:$built, files:$files}' \
            > out/meta-dmr5.json
          cat out/meta-dmr5.json

          gh release upload "$TAG" "${FILES[@]}" out/meta-dmr5.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "V releasi $TAG: ${#FILES[@]} súborov ✓"

      - name: Súhrn
        if: ${{ always() }}
        run: |
          set -uo pipefail
          {
            echo "## Hotový výškový model"
            echo
            echo "| vec | hodnota |"
            echo "|---|---|"
            echo "| release | \`${{ needs.plan.outputs.release }}\` |"
            echo "| podoba | ${{ steps.build.outputs.kind == 'tiles' && 'dlaždice 1°×1° (N49E019.tif)' || 'jeden COG na výrez' }} |"
            echo "| mriežka | ${{ needs.plan.outputs.grid }} m |"
            echo "| blokov z častí | ${{ steps.unpack.outputs.count }} |"
            echo
            echo "Build mapy to vezme cez \`dem_source: ${{ needs.plan.outputs.whole_country == 'true' && 'dmr5' || 'ugkk' }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
