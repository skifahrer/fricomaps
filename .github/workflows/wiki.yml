name: Wikipédia k mape (články k bodom, líniám a plochám)

# Ku každému objektu v regióne, ktorý má v OSM `wikipedia` alebo `wikidata`
# tag, stiahne článok – po anglicky a v jazyku krajiny – a publikuje ho na
# Drive vedľa máp toho istého regiónu:
#
#     <koreň>/slovensko/bratislavsky/
#         bratislavsky.zip                    celá mapa      ← Build map
#         bratislavsky-vrstevnice-skaly.zip
#         bratislavsky-tienovanie.zip
#         bratislavsky-wikipedia.zip          články         ← TENTO workflow
#
# …a odkaz zapíše do `maps.json` medzi ostatné balíky toho regiónu.
#
# PREČO VLASTNÁ PIPELINE A NIE JOB V BUILD MAP (kde to predtým bolo). Sú to
# tri rôzne veci naraz a každá stačí sama o sebe:
#
#   * INÁ SIEŤ. Chodí sa na cudzí server (Wikipédia), ktorý sa nemá čím
#     nahradiť a od ktorého si nič nevynucujeme. Keď nepustí, nemá to zhodiť
#     hodinový build mapy, ktorý s ním nemá nič spoločné.
#   * INÁ ŽIVOTNOSŤ. Mapa sa prerába, keď sa zmenia dáta alebo štýl; články si
#     žijú vlastným tempom a ťahať ich pri každom builde znamená tisíce
#     požiadaviek na cudzí server za nič.
#   * INÝ VÝSTUP. Nie sú to dlaždice ani vrstva v štýle – je to text vedľa
#     mapy. Do `_site` nejde nič a na Pages sa nenasadzuje.
#
# JEDEN PACKER A JEDEN ZÁPIS DO KATALÓGU TO NERUŠÍ. Balík aj zápis do
# `maps.json` robí ďalej `workers/deploy/publish-map.py`, len s `--only=
# wikipedia`: vtedy publikuje jediný balík a do katalógu ho DOPLNÍ, namiesto
# aby položku regiónu prepísal (inak by zmazal odkazy na mapu, o ktorej nič
# nevie). Druhý packer by bol druhá pravda o tom istom.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Región (ignoruje sa, ak je vyplnené custom_pbf_url)"
        required: true
        default: bratislavsky
        type: choice
        options:
          - slovensko
          - bratislavsky
          - trnavsky
          - trenciansky
          - nitriansky
          - zilinsky
          - banskobystricky
          - presovsky
          - kosicky
      wiki_format:
        description: "Podoba článku"
        required: false
        default: text
        type: choice
        options:
          - text
          - wikitext
          - intro
          - html
      wiki_langs:
        description: "Jazyky NAVYŠE, čiarkou (en a jazyk krajiny idú vždy)"
        required: false
        default: ""
        type: string
      wiki_max:
        description: "Strop počtu článkov na jeden beh"
        required: false
        default: "5000"
        type: string
      country:
        description: "Krajina pre domáci jazyk (prázdne = podľa regiónu)"
        required: false
        default: ""
        type: string
      rebuild:
        description: "Stiahnuť články odznova (obíde cache na Drive)"
        required: false
        default: false
        type: boolean
      publish:
        description: "Nahrať na Drive a zapísať do maps.json"
        required: false
        default: true
        type: boolean
      # Ten istý balík ešte raz ako `.aar` (Apple Archive) – rovnako ako pri
      # Build map. Robí to job na macOS, lebo nástroj `aa` je súčasť macOS;
      # keď ho nechceš platiť pri každom behu, odškrtni.
      apple_archive:
        description: "Nahrať balík aj ako .aar (Apple Archive, job na macOS)"
        required: false
        default: true
        type: boolean
      custom_pbf_url:
        description: "Vlastný .osm.pbf (iný región Európy/sveta)"
        required: false
        default: ""
        type: string
      custom_name:
        description: "Meno vlastného regiónu (do priečinka a mena balíka)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  # Prihlásenie na Drive: číta sa z neho cache článkov a nahráva balík. Stojí
  # pri celom workflowe ako v Build map – keby sa naň dalo zabudnúť pri jednom
  # kroku, ten by sa ticho vrátil k sťahovaniu všetkého odznova.
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
  OSMFR_BASE: https://download.openstreetmap.fr/extracts

jobs:
  wiki:
    name: Články z Wikipédie
    runs-on: ubuntu-latest
    # Katalóg `maps.json` je súbor v repozitári a dopisuje ho beh – rovnako
    # ako pri Build map. Bez tohto práva by sa zapísal na runner a stratil.
    permissions:
      contents: write
    outputs:
      key: ${{ steps.region.outputs.key }}
      enabled: ${{ steps.wiki.outputs.enabled }}
      published: ${{ steps.publish.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Priprav priečinky
        run: mkdir -p steps-out data

      # PBF sťahuje TEN ISTÝ skript ako Build map. „Ktorý súbor je región" je
      # jedna otázka a odpoveď na ňu má jedno miesto (pravidlo 1 v CLAUDE.md);
      # druhá kópia by sa raz rozišla v tom, ktorý export sa berie.
      - name: Stiahni PBF iba daného regiónu
        id: region
        env:
          AREA_IN: ""
          OPT_AREA_BBOX: ""
          OPT_CROP_BBOX: ""
          OPT_CUSTOM_BBOX: ""
          OPT_CUSTOM_NAME: ${{ inputs.custom_name }}
          OPT_CUSTOM_PBF_URL: ${{ inputs.custom_pbf_url }}
          OPT_TEST_AT: ""
          OPT_TEST_KM2: "0"
          REGION: ${{ inputs.region }}
        run: workers/plan/pbf.sh

      - name: Kľúč cache článkov
        id: key
        env:
          REGION: ${{ steps.region.outputs.key }}
          LANGS: ${{ inputs.wiki_langs }}
          FMT: ${{ inputs.wiki_format }}
          COUNTRY: ${{ inputs.country }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Do kľúča ide všetko, čo mení OBSAH balíka: región, krajina (z nej
          # je domáci jazyk), jazyky navyše a podoba článku. Na konci je číslo
          # behu, lebo existujúci kľúč sa neprepisuje – nový záznam tak vždy
          # vznikne a predpona vyberie najnovší.
          S=$(printf '%s|%s|%s|%s' "$REGION" "$COUNTRY" "$LANGS" "$FMT" \
              | tr -c 'a-zA-Z0-9._-' '_')
          echo "prefix=wiki-v2-$S-" >> "$GITHUB_OUTPUT"
          echo "key=wiki-v2-$S-$RUN_ID" >> "$GITHUB_OUTPUT"

      # Obnovuje sa cez PREDPONU – berie sa najnovší záznam toho istého
      # regiónu. Šetria sa tým bajty a čas prevodu, nie počet požiadaviek:
      # `collect.py` sa dávkovo spýta na `lastrevid` a stiahne len to, čo sa
      # zmenilo. `rebuild` restore preskočí, nech sa neťahá niečo, čo sa má
      # aj tak zahodiť.
      - name: Cache článkov (restore)
        id: cache
        if: ${{ !inputs.rebuild }}
        uses: ./.github/actions/cache-restore
        with:
          path: wiki-cache
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ steps.key.outputs.prefix }}

      - name: Odkazy na wiki → stiahnuté články
        id: wiki
        env:
          REGION_KEY: ${{ steps.region.outputs.key }}
          # Krajinu vie číselník regiónov; input ju len prebije (vlastný PBF
          # v `regions.json` nie je, tak si ju treba povedať).
          WIKI_COUNTRY: ${{ inputs.country }}
          OPT_WIKI_LANGS: ${{ inputs.wiki_langs }}
          OPT_WIKI_FORMAT: ${{ inputs.wiki_format }}
          OPT_WIKI_MAX: ${{ inputs.wiki_max }}
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          if [ -z "$WIKI_COUNTRY" ]; then
            WIKI_COUNTRY=$(jq -r --arg r "$REGION" '.[$r].country // ""' \
              workers/data/regions.json)
          fi
          export WIKI_COUNTRY
          echo "Krajina pre domáci jazyk: ${WIKI_COUNTRY:-(nepoznám)}"
          workers/wiki/build.sh

      # Ukladá sa HNEĎ, ako články vzniknú, nie v post-kroku – zrušený beh tak
      # nezahodí to, čo sa už stiahlo. `always()`, lebo aj čiastočný výsledok
      # je ďalšiemu behu na osoh.
      - name: Cache článkov (save)
        if: ${{ always() && hashFiles('wiki-cache/articles.ndjson') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: wiki-cache
          key: ${{ steps.key.outputs.key }}

      # Balí a do katalógu zapisuje ten istý skript ako pri mape, len s
      # `--only=wikipedia`: publikuje jediný balík a položku regiónu DOPLNÍ,
      # nie prepíše.
      - name: Publikuj na Drive a zapíš do maps.json
        id: publish
        if: ${{ inputs.publish && steps.wiki.outputs.enabled == 'true' }}
        env:
          REGION_KEY: ${{ steps.region.outputs.key }}
          AREA_KEY: cely
          TEST_KM2: "0"
          CUSTOM_PBF_URL: ${{ inputs.custom_pbf_url }}
          CUSTOM_NAME: ${{ inputs.custom_name }}
        run: |
          set -euo pipefail
          python3 workers/deploy/publish-map.py --only=wikipedia \
            --wiki=wiki-out --maps=maps.json \
            --summary="$GITHUB_STEP_SUMMARY"

      # Ten istý skript, akým katalóg commituje Build map – vrátane rebasu,
      # keď medzitým pushol iný beh.
      - name: Commitni maps.json
        if: ${{ inputs.publish && steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: maps.json
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh

      # Aby si `.aar` mohol vyrobiť job na macOS, musia sa k nemu články
      # dostať – v tom istom behu a bez druhého sťahovania z Wikipédie.
      - name: Odlož články pre Apple Archive
        if: ${{ inputs.publish && steps.publish.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: wiki-aar
          path: wiki-out
          retention-days: 1
          compression-level: 0

      # Bez publikovania (alebo keď zlyhalo) sa dá aspoň pozrieť, čo vzniklo.
      # Deň retencie: je to prepravka, nie uložený výsledok – ten je na Drive.
      - name: Odlož články na pozretie
        if: ${{ always() && hashFiles('wiki-out/index.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: wiki-${{ inputs.region }}
          path: |
            wiki-out
            steps-out
          retention-days: 1
          compression-level: 6
          if-no-files-found: ignore

      - name: Súhrn
        if: ${{ always() }}
        env:
          COUNT: ${{ steps.wiki.outputs.count }}
          MB: ${{ steps.wiki.outputs.mb }}
        run: |
          set -uo pipefail
          {
            echo "## Wikipédia k mape"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| región | \`${{ inputs.region }}\` |"
            echo "| článkov | ${COUNT:-0} |"
            echo "| veľkosť | ${MB:-0} MB |"
            echo "| podoba | \`${{ inputs.wiki_format }}\` |"
            echo
            echo "Jazyky sú angličtina a jazyk krajiny (číselník"
            echo "\`workers/data/wiki-languages.json\`) plus to, čo si objekty"
            echo "píšu samy v tagu. Text je z Wikipédie (CC BY-SA)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------- Apple Archive ----------
  # Ten istý balík ešte raz ako `.aar` – iOS a macOS ho rozbalia systémovo
  # (framework AppleArchive), bez tretej knižnice v aplikácii. Články sú z toho
  # najvďačnejšie: je to text, takže LZFSE stlačí 14 MB na 5.
  #
  # Vlastný job a na macOS preto, že nástroj `aa` je súčasť macOS a inde
  # neexistuje – rovnako ako pri Build map. Skript je ten istý
  # (`workers/deploy/apple-archive.sh`), len s `ONLY=wikipedia`: „ako sa vyrobí
  # .aar a nahrá na Drive" je jedna otázka a dve kópie by sa raz rozišli.
  #
  # Beží AŽ PO tom, čo sa nahral ZIP: `--only` položku katalógu DOPĹŇA, takže
  # ZIP musí byť zapísaný prvý. Keď spadne, články tým netrpia – na Drive sú
  # a v katalógu tiež, chýba len druhá podoba balíka.
  apple-archive:
    name: Balík ako Apple Archive (.aar)
    needs: wiki
    if: ${{ !cancelled() && needs.wiki.outputs.published == 'success' && inputs.apple_archive }}
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Stiahni články z predošlého jobu
        uses: actions/download-artifact@v8
        with:
          name: wiki-aar
          path: wiki-out
      - name: Zabaľ a nahraj .aar na Drive
        id: publish
        env:
          ONLY: wikipedia
          WIKI: wiki-out
          REGION_KEY: ${{ needs.wiki.outputs.key }}
          AREA_KEY: cely
          TEST_KM2: "0"
          CUSTOM_PBF_URL: ${{ inputs.custom_pbf_url }}
          CUSTOM_NAME: ${{ inputs.custom_name }}
        run: workers/deploy/apple-archive.sh
      - name: Commitni maps.json
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: maps.json
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh
