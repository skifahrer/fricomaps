name: Skaly z tieňovaných dlaždíc

# POKUSNÁ druhá cesta k skalám: nepočíta sa sklon z DEM, ale hľadajú sa TMAVÉ
# PLOCHY v hotovom hillshade z freemap.sk. Výstup je ten istý formát ako
# u skál z DEM – vrstva `rock` v GeoPackage, EPSG:4326 – takže si ho
# „Build map" vie vypýtať namiesto vlastného výpočtu:
#
#   Skaly z tieňovaných dlaždíc  ─►  release `dem-rocks-img`
#                                    (rockimg-{výrez}-z{zoom}-…gpkg.zst)
#                                        ▼
#   Build map  s  výberom  rock_source: tienovanie    ─►  vrstva `rock` v mape
#
# Celý výpočet je vo workers/shading-rocks.py – tam je aj vysvetlené, ako sa
# rozhoduje, čo je tmavé, a prečo sa vektorizuje po blokoch.
#
# Sú tu TRI joby: `dlazdice` stiahne obrázky, `vektor` z nich spraví obrysy
# a `skaly` ich zlepí a vyfiltruje. Dôvod je pri jobe `dlazdice` – v skratke:
# strop času platí na job a na všetko naraz nemusí stačiť.
#
# ČO OD TOHO ČAKAŤ: hillshade je obraz sklonu, ale osvetleného z jednej
# strany. Severozápadné steny sú na ňom najtmavšie, juhovýchodné najsvetlejšie
# – tie druhé teda táto cesta systematicky prehliadne. Zato má rozlíšenie,
# na aké si sami sklon nespočítame (z17 ≈ 0,8 m na pixel).
#
# JEDNA TRIEDA: výstupom je jedno pásmo, teda žiadna plocha vnútri inej.
# V mape sa kreslí jednou sivou bez priehľadnosti, takže sa prekryv nikde
# neprejaví a plochy sa nemusia ani zlepovať. `options: plne=0` vráti pôvodné
# dve pásma (`steep` a `cliff`).
#
# DIERY V PLOCHÁCH OSTÁVAJÚ. Sú to medzery medzi vláknami siete žliabkov –
# čiže presne tá štruktúra, pre ktorú sa skaly z tieňovania robia. Krátko sa
# zapĺňali a bola to chyba: z pol pohoria bola jedna súvislá plocha bez
# detailu. `options: zapln_diery=1` to vráti, ak by to niekto chcel.
#
# PRVÝ BEH JE LADIACI. Predvolené prahy sú kvalifikovaný odhad, nie nameraná
# hodnota. Artefakt `nahlad-…` obsahuje PNG „mozaika vedľa nájdených plôch"
# a histogram odtieňov – podľa nich sa `dark`, `dark_always` a `rel` doladia
# za jeden pohľad.

on:
  workflow_dispatch:
    inputs:
      area:
        description: "Pohorie, na ktorom sa skaly hľadajú (bbox je vo workers/areas.json)"
        required: true
        default: vysoke_tatry
        type: choice
        options:
          - tatry
          - vysoke_tatry
          - belianske_tatry
          - zapadne_tatry
          - nizke_tatry
          - slovensky_raj
          - pieniny
          - mala_fatra
          - velka_fatra
          - sulovske_skaly
          - slovensky_kras
          - muranska_planina
          - vihorlat
          - strazovske_vrchy
          - male_karpaty
      # `auto` = najvyšší, ktorý sa zmestí do stropu na počet dlaždíc aj do
      # rozpočtu času. z17 je strop zámerne: na z18 sú to 4× dlaždice a obrysy
      # rastú ešte rýchlejšie, pričom mapa z toho nemá nič – plochy sa
      # zobrazujú do maximálneho zoomu tak či tak.
      zoom:
        description: "Zoom dlaždíc, z ktorých sa skaly počítajú (auto = najvyšší možný)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - "17"
          - "16"
          - "15"
      # Na doladenie prahov: z desiatok minút sú minúty. Beh navyše vypíše
      # obrázok s okolím, kde presne ten štvorec leží.
      test:
        description: "Rýchly test: počítať len malý štvorec (km²) zo stredu výrezu"
        required: false
        default: nie
        type: choice
        options:
          - nie
          - "1"
          - "2"
          - "5"
          - "10"
      dark:
        description: "Nad touto šedou (0–255) nie je skala NIKDY – horný strop prahu"
        required: false
        default: "125"
        type: string
      dark_always:
        description: "Pod touto šedou je skala VŽDY, nech je okolo čokoľvek"
        required: false
        default: "70"
        type: string
      rel:
        description: "Medzi tými dvomi: o koľko musí byť pixel pod miestnym pozadím, aby sa rátal"
        required: false
        default: "18"
        type: string
      cliff:
        description: "O koľko stupňov šedej tmavšie začína trieda `cliff` (výrazná stena) namiesto `steep`"
        required: false
        default: "25"
        type: string
      # Menšie plochy sú zrno JPEGu. Nízka hodnota je zámer: tmavé miesta
      # nie sú súvislé steny, ale jemná sieť žliabkov, a práve tá je to,
      # čo z hillshade chceme. 7 m² je ~11 pixelov na z17.
      min_area:
        description: "Najmenšia skalná plocha v m²"
        required: false
        default: "7"
        type: string
      # Napr. `local=2000 smooth=2 jobs=8`. Čo sa hodí najčastejšie:
      #   fill=40          súvislé plochy namiesto jemnej siete
      #   plne=0           aj trieda `cliff` ako kedysi
      #   zapln_diery=1    zaplniť diery (zožerie detail – viď hlavičku)
      #   zlepit=1         zlepiť plochy na hraniciach blokov
      #   log_every=1      riadok na každú dlaždicu
      #   budget_min=150   viac času na obrysy
      #   fresh=1          nepokračovať v rozrobenom
      #   block_tiles=3    menšie bloky pri obrysoch
      # Celý zoznam je vo workers/shading-rocks.py; neznámy kľúč je chyba.
      options:
        description: "Zriedka menené prepínače ako kľúč=hodnota (viď workers/shading-rocks.py)"
        required: false
        default: ""
        type: string
  # Volá ho aj „Build map", keď má `rock_source: tienovanie`. Netreba teda
  # pustiť najprv toto a potom build – rovnako ako pri výškových modeloch je
  # `Build map` jediné, čo spúšťaš. `workflow_call` nepozná `type: choice`,
  # tak sem chodia tie isté hodnoty ako holé reťazce.
  workflow_call:
    inputs:
      area:
        required: true
        type: string
      zoom:
        required: false
        default: auto
        type: string
      # Build map sem posiela rovno bbox testovacieho štvorca (výpočet toho
      # istého na dvoch miestach sa raz rozíde), takže odtiaľ chodí `nie`.
      test:
        required: false
        default: nie
        type: string
      dark:
        required: false
        default: "125"
        type: string
      dark_always:
        required: false
        default: "70"
        type: string
      rel:
        required: false
        default: "18"
        type: string
      cliff:
        required: false
        default: "25"
        type: string
      min_area:
        required: false
        default: "7"
        type: string
      options:
        required: false
        default: ""
        type: string
    outputs:
      # Meno assetu v release – build si podľa neho vypýta presne tie skaly,
      # ktoré tento beh vyrobil, a nie „najnovšie pre výrez".
      asset:
        description: "Meno assetu so skalami v release dem-rocks-img"
        value: ${{ jobs.skaly.outputs.asset }}
      zoom:
        description: "Zoom dlaždíc, z ktorých sa skaly počítali"
        value: ${{ jobs.dlazdice.outputs.zoom }}
      count:
        description: "Počet nájdených skalných plôch"
        value: ${{ jobs.skaly.outputs.count }}

permissions:
  contents: write   # ukladanie hotových polygónov do releasu

concurrency:
  # Dva behy na to isté pohorie by z dobrovoľníckeho servera freemap.sk
  # ťahali dvojnásobok dlaždíc a prepisovali si ten istý asset.
  group: shading-rocks-${{ inputs.area }}
  cancel-in-progress: false

env:
  # Vysoké rozlíšenie tieňovania (LiDAR) z freemap.sk. Je to XYZ šablóna,
  # žiadne metadáta – najvyšší zoom sa preto zisťuje skúšobnou dlaždicou.
  SHADING_URL: "https://sk-hires-shading.tiles.freemap.sk/{z}/{x}/{y}.jpg"
  # Release s hotovými polygónmi. Zámerne NIE `dem-rocks`: tie sú z DEM
  # a tieto z obrázka, takže sa nesmú pomiešať ani omylom.
  ROCK_IMG_RELEASE: dem-rocks-img
  # Verzia algoritmu v mene assetu. Zmena algoritmu = iné skaly.
  # v2: diery v plochách ostávajú (v1 ich zapĺňal a zožral tým detail)
  ROCK_IMG_ALGO: v2
  # Bbox Slovenska – `resolve-area.py` pretína výrez s „regiónom", a tu je
  # regiónom celé územie, na ktorom tá dlaždicová vrstva vôbec existuje.
  SK_BBOX: "16.79,47.71,22.58,49.63"
  # Strop na počet dlaždíc jedného behu. `zoom: auto` zíde pod neho sám.
  # 60 000 dlaždíc je ~1,5 GB stiahnutých dát a ~4 mld. pixelov mozaiky.
  MAX_TILES: "60000"

jobs:
  # ---------- 1. stiahnuť dlaždice ----------
  # Tri joby, nie jeden: strop času platí na JOB. Sťahovanie z dobrovoľníckeho
  # servera je desiatky minút, obrysy ďalšiu hodinu a dokopy sa to do jedného
  # rozpočtu zmestiť nemusí – a keď čas dôjde, padne aj to, čo už bolo hotové.
  # Takto má každá časť celý svoj rozpočet a v Actions je zároveň vidieť, na
  # ktorej z nich beh práve je:
  #
  #   Stiahnuť dlaždice  →  Obrysy po blokoch  →  Skaly (spojenie a filter)
  #        cache               cache               release + artefakty
  #
  # GDAL tu netreba – sťahujú sa obrázky, nič sa nepočíta.
  dlazdice:
    name: Stiahnuť dlaždice
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      key: ${{ steps.area.outputs.key }}
      name: ${{ steps.area.outputs.name }}
      bbox: ${{ steps.area.outputs.bbox }}
      km2: ${{ steps.area.outputs.km2 }}
      # Pri `zoom: auto` ho vyberá sonda a rozpočet. Ide von, aby ho ďalšie
      # joby nemuseli hádať znova.
      zoom: ${{ steps.dl.outputs.zoom }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nástroje
        run: python3 -m pip install --quiet numpy pillow

      # `test` nie je iný algoritmus, len menší bbox – celý testovací režim je
      # tu. Kľúč dostane príponu `_test2`, takže si testovací beh nesadne do
      # tej istej cache ani na ten istý asset ako ostrý.
      - name: Výrez → bbox
        id: area
        run: |
          set -euo pipefail
          TEST='${{ inputs.test }}'
          if [ "$TEST" = 'nie' ] || [ -z "$TEST" ]; then TEST=0; fi
          python3 workers/resolve-area.py \
            --region-bbox="$SK_BBOX" \
            --area='${{ inputs.area }}' \
            --test-km2="$TEST" \
            --out="$GITHUB_OUTPUT"

      # Kde ten štvorec vlastne je. Bez toho je „nenašlo ani jednu skalu"
      # nečitateľné: nevie sa, či sú prísne prahy, alebo len testovací štvorec
      # padol na lúku. `continue-on-error`: diagnostika nesmie zhodiť beh.
      - name: Kde je testovací výrez
        if: ${{ inputs.test != 'nie' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 workers/test-locator.py \
            --bbox='${{ steps.area.outputs.bbox }}' \
            --full-bbox='${{ steps.area.outputs.full_bbox }}' \
            --name='${{ steps.area.outputs.name }}' \
            --layers="skaly z tieňovania, zoom ${{ inputs.zoom }}" \
            --png=out/kde-to-je.png --md=out/kde-to-je.md
          cat out/kde-to-je.md >> "$GITHUB_STEP_SUMMARY"

      - name: Odlož obrázok testovacieho výrezu
        if: ${{ always() && hashFiles('out/kde-to-je.png') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: kde-to-je-${{ steps.area.outputs.key }}
          path: out/kde-to-je.png
          retention-days: 14
          if-no-files-found: ignore

      # Dlaždice sa ťahajú z dobrovoľníckej služby – čo sa raz stiahlo, sa
      # nemá sťahovať znova len preto, že sa ladí prah. Kľúč na uloženie má
      # v sebe číslo behu, aby sa dal doplniť aj neúplný obsah: cache sa
      # v GitHube prepísať nedá, takže bez toho by prvý (hoc aj prerušený)
      # beh zamkol obsah navždy. Hľadá sa cez `restore-keys` po predpone.
      - name: Cache dlaždíc (restore)
        id: tiles-cache
        uses: actions/cache/restore@v4
        with:
          path: tiles-cache
          key: shading-tiles-${{ steps.area.outputs.key }}-z${{ inputs.zoom }}-${{ github.run_id }}
          restore-keys: |
            shading-tiles-${{ steps.area.outputs.key }}-z${{ inputs.zoom }}-

      - name: Stiahni dlaždice
        id: dl
        run: |
          set -euo pipefail
          python3 workers/shading-rocks.py \
            --bbox='${{ steps.area.outputs.bbox }}' \
            --url="$SHADING_URL" \
            --zoom='${{ inputs.zoom }}' \
            --max-tiles="$MAX_TILES" \
            --cache-dir=tiles-cache \
            --phase=stiahnut \
            --zoom-out="$GITHUB_OUTPUT" \
            --options='${{ inputs.options }}' \
            --out=data/rock.gpkg

      - name: Cache dlaždíc (save)
        if: ${{ always() && hashFiles('tiles-cache/**') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: tiles-cache
          key: shading-tiles-${{ steps.area.outputs.key }}-z${{ inputs.zoom }}-${{ github.run_id }}

      # Samotné obrázky, z ktorých sa skaly hľadajú. `compression-level: 0`:
      # JPG je už komprimovaný, balenie by len ukradlo minúty.
      - name: Odlož stiahnuté dlaždice ako artefakt
        if: ${{ always() && hashFiles('tiles-cache/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: dlazdice-tienovania-${{ steps.area.outputs.key }}-z${{ steps.dl.outputs.zoom }}
          # Medzivýsledky (pásy rastra, obrysy) v cache byť majú, v artefakte
          # s obrázkami nie.
          path: |
            tiles-cache
            !tiles-cache/_rozrobene
          retention-days: 14
          compression-level: 0
          if-no-files-found: ignore

  # ---------- 2. obrysy po blokoch ----------
  # Najdrahšia časť: raster tmavosti a `gdal_contour` po blokoch. Hodiny.
  # Vlastný job preto, aby hotové bloky prežili, keď sa to do stropu nezmestí
  # – a aby bolo v Actions vidieť, že beh je práve TU a nie v zlepovaní.
  vektor:
    name: Obrysy po blokoch
    needs: dlazdice
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nástroje
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin
          python3 -m pip install --quiet numpy pillow
          # `gdalinfo --version`, nie `gdal_contour --version`: contour nemá
          # prepínač na verziu, argumenty si prečíta ako bežný beh a skončí
          # na „Neither -i nor -fl nor -e are specified" s kódom 1. Pri
          # `set -e` to zhodí celý job v 30. sekunde – ešte pred stiahnutím
          # prvej dlaždice. (Presne to sa stalo v behu 31215692174.)
          gdalinfo --version

      # Kľúč je ten istý ako v prvom jobe vrátane čísla behu, takže sa trafí
      # presne to, čo práve uložil. `restore-keys` je poistka na prípad, keď
      # sa uloženie nepodarilo – vtedy sa siahne po staršej cache výrezu.
      - name: Cache dlaždíc (restore)
        uses: actions/cache/restore@v4
        with:
          path: tiles-cache
          key: shading-tiles-${{ needs.dlazdice.outputs.key }}-z${{ inputs.zoom }}-${{ github.run_id }}
          restore-keys: |
            shading-tiles-${{ needs.dlazdice.outputs.key }}-z${{ inputs.zoom }}-

      # Rozrobené z predošlých BEHOV – hotové bloky sa nepočítajú znova.
      - name: Cache rozrobeného (restore)
        uses: actions/cache/restore@v4
        with:
          path: |
            tiles-cache/_rozrobene
            tiles-cache/_stiahnute.txt
          key: shading-vektor-${{ needs.dlazdice.outputs.key }}-z${{ inputs.zoom }}-${{ github.run_id }}
          restore-keys: |
            shading-vektor-${{ needs.dlazdice.outputs.key }}-z${{ inputs.zoom }}-

      - name: Raster tmavosti a obrysy
        run: |
          set -euo pipefail
          mkdir -p data out
          python3 workers/shading-rocks.py \
            --bbox='${{ needs.dlazdice.outputs.bbox }}' \
            --url="$SHADING_URL" \
            --phase=vektor \
            --zoom='${{ needs.dlazdice.outputs.zoom }}' \
            --max-tiles="$MAX_TILES" \
            --dark='${{ inputs.dark }}' \
            --dark-always='${{ inputs.dark_always }}' \
            --rel='${{ inputs.rel }}' \
            --cliff='${{ inputs.cliff }}' \
            --min-area='${{ inputs.min_area }}' \
            --cache-dir=tiles-cache \
            --preview=out/preview.png \
            --options='${{ inputs.options }}' \
            --out=data/rock.gpkg

      # Ukladá sa aj po páde a po timeoute – v tom je celý zmysel delenia.
      # Iba `_rozrobene` a čísla o sťahovaní, NIE obrázky: tie už v cache sú
      # pod vlastným kľúčom a druhýkrát by to boli zbytočné gigabajty.
      - name: Cache rozrobeného (save)
        if: ${{ always() && hashFiles('tiles-cache/_rozrobene/**') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            tiles-cache/_rozrobene
            tiles-cache/_stiahnute.txt
          key: shading-vektor-${{ needs.dlazdice.outputs.key }}-z${{ inputs.zoom }}-${{ github.run_id }}

      # Náhľad vzniká pri rastri tmavosti, nie z hotových polygónov – patrí
      # teda sem. A práve podľa neho sa ladia prahy, takže má byť po ruke aj
      # vtedy, keď zlepovanie za tým ešte nedobehlo.
      - name: Odlož náhľad
        if: ${{ always() && hashFiles('out/preview.png') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nahlad-${{ needs.dlazdice.outputs.key }}-z${{ needs.dlazdice.outputs.zoom }}
          path: out/preview.png
          retention-days: 90
          if-no-files-found: ignore

  # ---------- 3. spojenie, filter, výstup ----------
  # Minúty, nie hodiny: bloky sa zlepia, plochy rozseknuté hranicou bloku sa
  # spoja cez ST_Union, prejde filter a vyhladenie. Vlastný job preto, aby sa
  # dalo opakovať samo o sebe – zmena `min_area` nie je dôvod počítať obrysy
  # znova a v jednom veľkom jobe by sa im nedalo vyhnúť.
  skaly:
    name: Skaly z tieňovania
    needs: [dlazdice, vektor]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      asset: ${{ steps.rocks.outputs.asset }}
      count: ${{ steps.rocks.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nástroje
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # spatialite: `ST_Union` v SQLite dialekte, ktorým sa zlepujú
          # plochy rozseknuté hranicou bloku. Bez neho beh pokračuje, len
          # s rovnými rezmi v skalách – viď `zlep_svy` v skripte.
          sudo apt-get install -y -qq gdal-bin zstd libsqlite3-mod-spatialite
          python3 -m pip install --quiet numpy pillow
          gdalinfo --version

      # Obrázky sa tu nesťahujú a nečítajú – zlepovanie pracuje nad obrysmi.
      # Preto sa neobnovuje celá cache dlaždíc (gigabajty JPEGov), ale len
      # rozrobené a čísla o sťahovaní do štatistiky.
      - name: Cache rozrobeného (restore)
        uses: actions/cache/restore@v4
        with:
          path: |
            tiles-cache/_rozrobene
            tiles-cache/_stiahnute.txt
          key: shading-vektor-${{ needs.dlazdice.outputs.key }}-z${{ inputs.zoom }}-${{ github.run_id }}
          restore-keys: |
            shading-vektor-${{ needs.dlazdice.outputs.key }}-z${{ inputs.zoom }}-

      - name: Spojenie blokov a filter
        id: rocks
        run: |
          set -euo pipefail
          mkdir -p data out
          python3 workers/shading-rocks.py \
            --bbox='${{ needs.dlazdice.outputs.bbox }}' \
            --url="$SHADING_URL" \
            --phase=spojit \
            --zoom='${{ needs.dlazdice.outputs.zoom }}' \
            --max-tiles="$MAX_TILES" \
            --dark='${{ inputs.dark }}' \
            --dark-always='${{ inputs.dark_always }}' \
            --rel='${{ inputs.rel }}' \
            --cliff='${{ inputs.cliff }}' \
            --min-area='${{ inputs.min_area }}' \
            --cache-dir=tiles-cache \
            --stats=out/rock-img-stats.txt \
            --options='${{ inputs.options }}' \
            --out=data/rock.gpkg

          # Meno assetu nesie výrez aj VŠETKY nastavenia, takže sa dva behy
          # s rôznymi prahmi nikdy neprepíšu. Zoom sa berie zo štatistiky,
          # nie zo vstupu – pri `auto` je až tam.
          . out/rock-img-stats.txt
          ASSET="rockimg-${{ needs.dlazdice.outputs.key }}-z${zoom}-d${dark}-a${dark_always}-r${rel}-c${cliff_delta}-${ROCK_IMG_ALGO}.gpkg.zst"
          {
            echo "asset=$ASSET"
            echo "zoom=$zoom"
            echo "count=$count"
            echo "total_km2=$total_km2"
          } >> "$GITHUB_OUTPUT"

      # Keď zlepovanie spadne, rozrobené prežije a ďalší beh nadviaže. Kľúč má
      # na konci `-s`: pod kľúčom bez neho leží to, čo uložil job `vektor`,
      # a existujúci kľúč sa v GitHube prepísať nedá – uloženie by ticho
      # neurobilo nič. `restore-keys` hľadá po predpone, takže sa ďalší beh
      # trafí na tento (novší) záznam aj tak.
      - name: Cache rozrobeného (save)
        if: ${{ failure() && hashFiles('tiles-cache/_rozrobene/**') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            tiles-cache/_rozrobene
            tiles-cache/_stiahnute.txt
          key: shading-vektor-${{ needs.dlazdice.outputs.key }}-z${{ inputs.zoom }}-${{ github.run_id }}-s

      - name: GeoJSON navyše
        run: |
          set -euo pipefail
          ogr2ogr -f GeoJSON out/rock.geojson data/rock.gpkg rock \
            -lco COORDINATE_PRECISION=6 -lco RFC7946=YES
          ls -lh data/rock.gpkg out/rock.geojson

      # Iba polygóny – to je celý zmysel tohto artefaktu. Náhľad a čísla sú
      # vedľa, v samostatnom, aby sa dali polygóny stiahnuť samé.
      - name: Odlož polygóny ako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: skaly-obrazok-${{ needs.dlazdice.outputs.key }}-z${{ needs.dlazdice.outputs.zoom }}
          path: |
            data/rock.gpkg
            out/rock.geojson
          retention-days: 90
          compression-level: 9
          if-no-files-found: error

      # Dlaždice odložil job `dlazdice` a náhľad job `vektor` – oboje hneď,
      # ako vzniknú, teda aj vtedy, keď to, čo je za nimi, nedobehne.
      - name: Odlož čísla
        if: ${{ always() && hashFiles('out/rock-img-stats.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cisla-${{ needs.dlazdice.outputs.key }}-z${{ needs.dlazdice.outputs.zoom }}
          path: out/rock-img-stats.txt
          retention-days: 90
          if-no-files-found: ignore

      # Aby si ich vedel vypýtať build mapy. Artefakt behu sa z iného
      # workflowu dostáva ťažko (treba číslo behu), release asset ľahko –
      # rovnako to robia skaly z DEM v release `dem-rocks`.
      - name: Ulož do releasu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET='${{ steps.rocks.outputs.asset }}'
          zstd -q -19 -T0 -f -o "/tmp/$ASSET" data/rock.gpkg
          ls -lh "/tmp/$ASSET"
          gh release view "$ROCK_IMG_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$ROCK_IMG_RELEASE" --repo "$GITHUB_REPOSITORY" \
              --title "Skalné plochy z tieňovaných dlaždíc" \
              --notes "Polygóny nájdené ako tmavé plochy v hillshade dlaždiciach freemap.sk. Meno assetu nesie výrez, zoom a všetky prahy. Build map si ich vypýta výberom \`rock_source: tienovanie\`." || true
          gh release upload "$ROCK_IMG_RELEASE" "/tmp/$ASSET" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Uložené do releasu $ROCK_IMG_RELEASE ako $ASSET"

      - name: Súhrn
        if: ${{ always() }}
        run: |
          set -euo pipefail
          {
            echo "## Skaly z tieňovaných dlaždíc"
            echo
            echo "**${{ needs.dlazdice.outputs.name }}** – bbox \`${{ needs.dlazdice.outputs.bbox }}\` (${{ needs.dlazdice.outputs.km2 }} km²)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -s out/rock-img-stats.txt ]; then
            . out/rock-img-stats.txt
            {
              echo "| | |"
              echo "|---|---|"
              echo "| zoom | z${zoom} (${px_m} m na pixel) |"
              echo "| dlaždice | ${tiles} (${mb_downloaded} MB, ${tiles_missing} chýbalo, ${tiles_failed} zlyhalo) |"
              echo "| mozaika | ${cells} pixelov |"
              echo "| prah | nikdy nad ${dark}, vždy pod ${dark_always}, medzi tým ${rel} pod pozadím (okno ${local_m} m) |"
              echo "| štruktúra | ${fill_m} m vyplnenie (0 = jemná sieť žliabkov) |"
              echo "| **skalných plôch** | **${count}** (z toho ${cliff} \`cliff\`), ${dropped} pod ${min_area_m2} m² zahodených |"
              echo "| **plocha spolu** | **${total_km2} km²**, najväčšia $((max_m2 / 10000)) ha |"
              echo "| diery | ${holes} zachovaných, ${holes_dropped} pod ${min_hole_m2} m² zahodených |"
              echo "| veľkosť dát | ${out_mb} MB = **${mb_per_km2} MB na km² skál** |"
              echo "| trvanie | ${seconds} s |"
              echo
              echo "Asset v release \`$ROCK_IMG_RELEASE\`: \`${{ steps.rocks.outputs.asset }}\`"
              echo
              echo "### Ďalej"
              echo
              echo "1. Stiahni artefakt \`nahlad-…\` (odložil ho job *Obrysy po blokoch*) a pozri \`preview.png\` – vľavo mozaika tieňovania, vpravo to isté s červenou maskou. Podľa toho doladiť \`dark\` / \`dark_always\` / \`rel\`."
              echo "2. Ladenie zrýchli výber \`test\` – na 2 km² sú to minúty a beh rovno ukáže, kde ten štvorec leží."
              echo "3. Keď to sedí, spusti **Build map** s výberom \`rock_source: tienovanie\` a rovnakým \`area\` – vezme si najnovší asset pre tento výrez namiesto počítania skál z DEM."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Beh sa nedostal po štatistiku – pozri log kroku *Skaly z tmavých plôch*." >> "$GITHUB_STEP_SUMMARY"
          fi
