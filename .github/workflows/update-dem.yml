name: Stiahnuť výškové dáta

# JEDINÁ sťahovacia pipeline. Vyber v `source` model a ona ho zoženie,
# preveďí na dlaždice a uloží do skladu na Drive, z ktorého si ho berie
# „Build map". (Do GitHub releasov sa nepublikuje nič – celý formát skladu má
# `workers/drive/store.py`.)
#
# Do augusta 2026 to boli tri workflowy (Sonny, ÚGKK 1 m, ÚGKK otvorené dáta)
# a jeden diagnostický. Robili to isté – stiahni, preveď, ulož –
# len z iného URL, takže sa opravy museli robiť trikrát. Teraz je to jeden
# workflow s výberom zdroja; URL nesie workers/data/dem-sources.json a dá sa
# prebiť poľom `url`.
#
# | source  | čo to je                    | sklad        | mriežka |
# |---------|-----------------------------|--------------|---------|
# | sonny   | Sonny's LiDAR DTM (Drive)   | dem-sonny    | 20 m    |
# | dmr35   | ÚGKK DMR 3.5 (opendata ZIP) | dem-dmr35    | ~10 m   |
# | ugkk    | ÚGKK DMR 5.0 (1 m LiDAR)    | dem-ugkk     | 1 m     |
#
# `dmr5` V TEJ TABUĽKE NIE JE a `what: dmr5` je odteraz CHYBA. Tento workflow
# archív stiahne na runner a rozreže ho; DMR 5.0 má 145 GB (na Drive) resp.
# 198 GB (ZIP z opendata) a runner má voľných ~60 GB – „stiahni a rozbaľ" tu
# neexistuje. Číta sa cez HTTP Range pipeline `DMR 5.0 z Drive`
# (dmr5-drive.yml), ktorá berie len to, čo územie pretína, a `Build map` si ju
# volá sama (joby `Doplniť DMR 5.0 …`).
#
# Bol tu rozcestník, ktorý na `dmr5` vypísal, kam ísť ručne, a skončil
# ÚSPECHOM. To bola tichá diera: `check-dem` sem poslal „dmr5 treba doplniť",
# nič sa nedoplnilo, job zazelenal a build spadol o desať jobov neskôr na tom,
# že v sklade nie je ani jedna dlaždica (beh 31307163093). Doplnenie, ktoré
# nedopĺňa, musí byť červené hneď.
#
# `ugkk` sa z GitHub runnera stiahnuť NEDÁ – `zbgis.skgeodesy.sk` aj
# `zbgisws.skgeodesy.sk` timeoutujú aj pri 30 s (zmerané v behoch
# 31072215798, 31075806874, 31096745697). Ostáva vo výbere preto, že cez
# `url` sa dá zadať odkaz z ručného exportu zo ZBGIS Mapového klienta.
#
# PREČO ZRKADLENIE: Sonny distribuuje dlaždice cez Google Drive. Drive nemá
# stabilné priame URL na súbory v zdieľanom priečinku a pri väčšom počte
# stiahnutí vracia "Too many users have viewed or downloaded this file",
# takže sa z neho nedá spoľahlivo sťahovať v každom builde mapy. Stiahne sa
# preto raz sem, prevedie na dlaždice `N49E019.tif` (GeoTIFF, DEFLATE) a
# uloží do skladu – build mapy si potom vypýta len tie dlaždice, ktoré
# pokrývajú jeho bbox.
#
# KTORÝ MODEL: Sonny ponúka viac produktov a pre nás je najlepší **20m**
# (GeoTIFF, mriežka 20×20 m, výška po 0,1 m). Model 1″ (.hgt) má mriežku
# 20×30 m a výšku len po celých metroch – a práve zvislý krok rozhoduje:
# z metrových schodov vychádza zubatý sklon, ktorý súvislú skalnú stenu
# roztrhá na kopu falošných úlomkov (namerané vo Vysokých Tatrách: 5 293
# plôch z 1 m dát vs 2 138 z 0,1 m, pri rovnakej celkovej ploche skál).
#
# Rezanie na dlaždice robí workers/dem/tiles.py – 20m model môže byť jeden
# GeoTIFF na celú krajinu a v metrickej projekcii, kým build mapy potrebuje
# dlaždice 1°×1° vo WGS84. Súbory .hgt sú už samé o sebe 1° dlaždice, len
# bez hlavičky, takže tie sa prevádzajú priamo.
#
# JEDEN SKLAD = JEDEN MODEL. Miešať 20m a 1″ v jednom sklade nemá zmysel –
# dlaždice sa volajú rovnako a prepísali by sa navzájom.
#
# Licencia dát: Sonny's LiDAR DTM – CC BY 4.0, zdroj treba uviesť v mape
# (robí to atribúcia zdroja `contours` v style.json).

on:
  workflow_dispatch:
    inputs:
      what:
        description: "Čo stiahnuť"
        required: true
        default: "dmr35 | https://opendata.skgeodesy.sk/static/DMR3_5/dmr3_5-10.zip"
        type: choice
        options:
          - "dmr35 | https://opendata.skgeodesy.sk/static/DMR3_5/dmr3_5-10.zip"
          - "sonny | Google Drive (20 m, celé Slovensko)"
          - "sonny1 | Google Drive (1″ .hgt, zvislý krok 1 m – hrubší)"
          - "ugkk  | DMR 5.0 1 m – vyplň custom_url odkazom z exportu ZBGIS"
          - "vlastné | vyplň custom_url"
      custom_url:
        description: "URL, keď je vyššie „vlastné“ alebo „ugkk“. ZIP/TIF/HGT; viac odkazov oddeľ medzerou"
        required: false
        default: ""
        type: string
      store:
        description: "Do ktorého skladu na Drive uložiť (prázdne = podľa výberu)"
        required: false
        default: ""
        type: string
      area:
        description: "Len pre ugkk: pohorie z workers/data/areas.json alebo bbox W,S,E,N"
        required: false
        default: vysoke_tatry
        type: string
      force:
        description: "Stiahnuť nanovo, aj keď už dáta v sklade sú"
        required: false
        default: false
        type: boolean
  # Volá ho aj "Build map", keď v sklade nie sú dlaždice pre jeho územie.
  # `workflow_call` nepozná `type: choice`, tak sem chodí holý kľúč zdroja
  # (sonny/dmr35/ugkk) – krok „Priprav zdroj" berie oboje. `dmr5` sem Build map
  # neposiela: ten si volá `dmr5-drive.yml` priamo.
  workflow_call:
    inputs:
      what:
        required: true
        type: string
      custom_url:
        required: false
        default: ""
        type: string
      store:
        required: false
        default: ""
        type: string
      area:
        required: false
        default: vysoke_tatry
        type: string
      force:
        required: false
        default: false
        type: boolean
    # Prihlásenie na Drive – `workflow_call` nededí secrets automaticky, takže
    # bez tejto deklarácie by ich volajúci nemal ako podať a Sonny by sa ťahal
    # anonymne. Dva tvary toho istého: všetko v jednom (GDRIVE_CREDENTIALS),
    # alebo po dvoch. Nič nie je povinné – bez tokenu sa nemení nič, len sa
    # výslovne vypíše, že platí verejný limit. `client_id` (DRIVE_CLIENT) tu
    # nie je: je to repository variable, nie secret, a `vars.DRIVE_CLIENT` sa
    # v tomto istom repozitári číta priamo nižšie bez podávania cez `workflow_call`.
    secrets:
      GDRIVE_CREDENTIALS:
        required: false
      DRIVE_SECRET:
        required: false
      DRIVE_REFRESH:
        required: false

# `contents: read` stačí: publikuje sa na Drive, nie do releasov, takže tento
# workflow do repozitára nezapisuje nič. Kým tu bolo `write`, bolo to práve
# na `gh release create`.
permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      # Sonny distribuuje cez Google Drive a priečinok sa nemení – nemá čo
      # zaberať pole vo formulári. Iný priečinok sa dá dať cez `custom_url`.
      SONNY_DRIVE_FOLDER: https://drive.google.com/drive/folders/1qrGm0mPDwmZytOkYQup6TfhCw9ohlsMa
      # Sonnyho 1″ model (.hgt). Zvislý krok 1 m namiesto 0,1 m – skaly z neho
      # vyjdú polámanejšie; rozpis vo workers/data/dem-sources.json.
      SONNY1_DRIVE_FOLDER: https://drive.google.com/drive/folders/1FCXPutDU6DvnTEA4PY6iFOQKiuVd11j4
      # Token vlastníka dát. Na súbory, ktoré ten účet naozaj vlastní, dvíha
      # denný strop sťahovania rádovo; na cudzí zdieľaný priečinok (Sonny) nie
      # – tam z anonymnej požiadavky spraví aspoň pomenovanú a hlavne dovolí
      # čítať cez Drive API, ktoré odmietnutie povie rovno, namiesto HTML
      # stránky s HTTP 200. Rozpis vo `workers/drive/folder.py`.
      GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
      DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
      DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Nainštaluj GDAL a gdown
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin p7zip-full
          python3 -m pip install --quiet --upgrade gdown

      # Jediné miesto, kde sa rozhoduje „čo → odkiaľ → do ktorého skladu".
      # Zámerne obyčajný `case` a nie čítanie JSONu: URL je vidieť priamo vo
      # formulári, takže keď beh spadne, je z jedného pohľadu jasné, čo sa
      # sťahovalo. Skrytá indirekcia cez dem-sources.json bola o jeden krok
      # viac, kde sa to mohlo pokaziť.
      - name: Priprav zdroj
        id: src
        run: |
          set -uo pipefail
          WHAT='${{ inputs.what }}'
          CUSTOM='${{ inputs.custom_url }}'
          # Kľúč je to, čo je pred „|" – z výberu aj z `workflow_call`.
          KEY=$(printf '%s' "$WHAT" | cut -d'|' -f1 | tr -d '[:space:]')
          case "$KEY" in
            dmr35)
              URL="https://opendata.skgeodesy.sk/static/DMR3_5/dmr3_5-10.zip"
              REL=dem-dmr35; LABEL="ÚGKK DMR 3.5 (otvorené dáta)" ;;
            sonny)
              URL=""; REL=dem-sonny; LABEL="Sonny's LiDAR DTM 20 m" ;;
            sonny1)
              # Druhý Sonnyho priečinok: 1″ .hgt. Rozbaľovanie aj prevod na
              # GeoTIFF je ten istý krok ako pri `sonny` (`hgt_to_tif` vie aj
              # neštandardné mriežky); líši sa len priečinok a sklad.
              URL=""; REL=dem-sonny1; LABEL="Sonny's LiDAR DTM 1″ (.hgt)" ;;
            ugkk)
              URL="$CUSTOM"; REL=dem-ugkk; LABEL="ÚGKK DMR 5.0 (1 m LiDAR)" ;;
            dmr5)
              # DMR 5.0 sem NEPATRÍ a nie je to rozcestník, ale chyba. Tento
              # workflow sťahuje archív na runner a rozreže ho; DMR 5.0 má na
              # Drive 145 GB a runner má voľných ~60 GB, takže sa to spraviť
              # nedá ani teoreticky. Robí to `DMR 5.0 z Drive` (dmr5-drive.yml)
              # cez HTTP Range – a `Build map` si ju volá sám.
              #
              # KÝM TO TU BOL ROZCESTNÍK, KTORÝ SKONČIL ÚSPECHOM, bola to tichá
              # diera: `check-dem` poslal „dmr5 treba doplniť" sem, tento job
              # vypísal, kam ísť ručne, zelene skončil – a build pokračoval do
              # jobu, ktorý si model vypýtal, a spadol tam (beh 31307163093).
              # Doplnenie, ktoré nedopĺňa, musí byť červené hneď.
              echo "::error::DMR 5.0 sa cez „Stiahnuť výškové dáta“ doplniť nedá (145 GB, runner má ~60 GB). Použi workflow „DMR 5.0 z Drive (ETRS89)“: area: <pohorie> → dem-ugkk, alebo area: <bbox stupňov> s tiles: true → dem-dmr5. Build map si ju volá sám (joby „Doplniť DMR 5.0 …“)."
              exit 1 ;;
            vlastné|vlastne|custom)
              URL="$CUSTOM"; REL=dem-dmr35; LABEL="vlastné URL" ;;
            *)
              echo "::error::Neznáme „$WHAT“. Známe: dmr35, sonny, sonny1, ugkk, dmr5, vlastné."
              exit 1 ;;
          esac
          # URL z výberu sa dá prebiť custom_url pri každom zdroji.
          if [ -n "${CUSTOM//[[:space:]]/}" ] && [ "$KEY" != "sonny" ] && [ "$KEY" != "sonny1" ]; then
            URL="$CUSTOM"
          fi
          [ -n '${{ inputs.store }}' ] && REL='${{ inputs.store }}'
          if [ "$KEY" != "sonny" ] && [ "$KEY" != "sonny1" ] && [ -z "${URL//[[:space:]]/}" ]; then
            echo "::error::Pre „$KEY“ treba URL – vyplň custom_url."
            exit 1
          fi
          {
            echo "key=$KEY"
            echo "url=$URL"
            echo "store=$REL"
            echo "label=$LABEL"
          } >> "$GITHUB_OUTPUT"
          echo "── $LABEL"
          echo "   URL:   ${URL:-(Google Drive)}"
          echo "   sklad: $REL"

      - name: Stiahni dlaždice
        id: fetch
        if: ${{ contains(fromJSON('["sonny","sonny1"]'), steps.src.outputs.key) }}
        run: |
          set -uo pipefail
          mkdir -p dl

          # Čím sa to naozaj stiahlo, ide do súhrnu. Rovnaké pravidlo ako pri
          # `dem-source.txt`: keď sa použije náhradná cesta, musí to byť vidieť
          # – inak sa tichý návrat k verejnému limitu zistí až o pol dňa.
          DRIVE_MODE="priame URL (mimo Drive)"

          URLS='${{ steps.src.outputs.url }}'
          if [ -n "${URLS//[[:space:]]/}" ]; then
            # Priame URL (napr. mirror) majú prednosť – Drive vie limitovať.
            for u in $URLS; do
              echo "── $u"
              curl -fL --retry 3 --retry-delay 5 -O --output-dir dl "$u" \
                || echo "::warning::$u sa nepodarilo stiahnuť"
            done
          else
            # Dva Sonnyho priečinky, jeden krok: 20m GeoTIFF vs 1″ .hgt.
            FOLDER="${SONNY_DRIVE_FOLDER}"
            [ "${{ steps.src.outputs.key }}" = "sonny1" ] \
              && FOLDER="${SONNY1_DRIVE_FOLDER}"
            echo "Sťahujem Google Drive priečinok: $FOLDER"
            # „Vieme sa prihlásiť?" má JEDNU odpoveď a je vo `workers/
            # drive-folder.py --mode`. Nezisťuje sa to tu z toho, či je
            # nastavený secret: to by boli dve miesta, ktoré si tú istú vec
            # počítajú samy, a nekompletná trojica by tadiaľ prešla ako
            # „veď tam niečo je" (`from_env` ju správne odmieta).
            #
            # `|| exit 1` je tu podstatné: krok beží bez `set -e`, takže bez
            # neho by neúplná trojica secretov (na ktorej `--mode` padne)
            # vyšla ako prázdny reťazec a beh by ticho prepadol do vetvy
            # s verejným limitom – čiže presne to, čomu sa vyhýbame.
            MODE=$(python3 workers/drive/folder.py --mode) || exit 1
            if [ "$MODE" = "auth" ]; then
              DRIVE_MODE="Drive API, prihlásený ako vlastník tokenu"
              python3 workers/drive/folder.py --folder="$FOLDER" --out=dl || exit 1
            else
              DRIVE_MODE="**verejný odkaz (neprihlásene)** – platí denný limit"
              # Bez tokenu sa nemení nič oproti stavu spred prihlásenia – ale
              # nesmie to byť tiché. Verejný odkaz má denný strop sťahovania
              # na súbor a ten zdieľajú všetci, kto naň siahnu; keď sa vyčerpá,
              # Drive vráti HTTP 200 a HTML stránku namiesto dát.
              echo "::warning::Sťahujem z Google Drive NEPRIHLÁSENE – platí verejný denný limit sťahovania, zdieľaný so všetkými klientmi. Doplň premennú DRIVE_CLIENT a secrety DRIVE_SECRET / DRIVE_REFRESH (workflow „Prihlásenie na Drive (jednorazové)“) a pôjde to cez Drive API."
              # Staršie gdown sťahovalo z priečinka najviac 50 súborov a bez
              # --remaining-ok pri prekročení spadlo; v gdown 5 ten prepínač už
              # neexistuje (a limit tiež nie), takže sa pridáva len ak ho daná
              # verzia pozná.
              REMAINING=""
              gdown --help 2>&1 | grep -q -- --remaining-ok && REMAINING="--remaining-ok"
              gdown --folder $REMAINING --no-cookies -O dl "$FOLDER" || {
                echo "::error::Stiahnutie z Google Drive zlyhalo. Priečinok musí byť zdieľaný odkazom; pri hláške o limite stiahnutí sa prihlás (premenná DRIVE_CLIENT, secrety DRIVE_SECRET / DRIVE_REFRESH), skús o pár hodín neskôr, alebo vyplň custom_url odkazom na mirror."
                exit 1
              }
            fi
          fi

          find dl -type f | head -100
          echo "Stiahnutých súborov: $(find dl -type f | wc -l)"
          echo "Cesta k dátam: $DRIVE_MODE"
          echo "drive_mode=$DRIVE_MODE" >> "$GITHUB_OUTPUT"

      - name: Rozbaľ archívy a preveď na GeoTIFF dlaždice
        id: convert
        if: ${{ contains(fromJSON('["sonny","sonny1"]'), steps.src.outputs.key) }}
        run: |
          set -uo pipefail
          mkdir -p unpacked tiles

          # ---- rozbalenie (Sonny posiela .zip, občas .7z) ----
          while IFS= read -r a; do
            case "${a,,}" in
              *.zip) 7z x -y -o"unpacked" "$a" >/dev/null || echo "::warning::$a sa nepodarilo rozbaliť" ;;
              *.7z)  7z x -y -o"unpacked" "$a" >/dev/null || echo "::warning::$a sa nepodarilo rozbaliť" ;;
              # nearchívy sa nekopírujú – hľadá sa aj priamo v dl/, inak by
              # sa ten istý GeoTIFF rezal dvakrát
              *)     : ;;
            esac
          done < <(find dl -type f)

          # Ak tú istú .hgt dlaždicu nájdeme viackrát (1″ aj 3″ verzia),
          # necháme tú s vyšším rozlíšením.
          declare -A best_px

          hgt_to_tif() { # $1 = vstup .hgt, $2 = výstup .tif, $3 = meno dlaždice (N49E019)
            # GDAL pozná SRTMHGT pri štandardných veľkostiach (1201/3601).
            if gdal_translate -q -of GTiff -a_srs EPSG:4326 \
                 -co COMPRESS=DEFLATE -co PREDICTOR=2 -co TILED=YES "$1" "$2" 2>/dev/null; then
              return 0
            fi
            # Neštandardná mriežka (napr. 0,5″ = 7201²): .hgt je surové pole
            # int16 big-endian bez hlavičky, takže georeferenciu poskladáme
            # sami z mena dlaždice (juhozápadný roh, vzorky sú v uzloch
            # mriežky – preto polpixelový posun a krok 1/(n−1)).
            local px n lat lon res ulx uly
            px=$(stat -c%s "$1")
            n=$(python3 -c "import math;print(math.isqrt($px//2))")
            [ $(( n * n * 2 )) -eq "$px" ] || return 1
            lat=$(( 10#${3:1:2} )); [ "${3:0:1}" = "S" ] && lat=$(( -lat ))
            lon=$(( 10#${3:4:3} )); [ "${3:3:1}" = "W" ] && lon=$(( -lon ))
            res=$(python3 -c "print(1/($n-1))")
            ulx=$(python3 -c "print($lon - 0.5/($n-1))")
            uly=$(python3 -c "print($lat + 1 + 0.5/($n-1))")
            printf '%s\n' \
              "<VRTDataset rasterXSize=\"$n\" rasterYSize=\"$n\">" \
              "  <SRS>EPSG:4326</SRS>" \
              "  <GeoTransform>$ulx, $res, 0, $uly, 0, -$res</GeoTransform>" \
              "  <VRTRasterBand dataType=\"Int16\" band=\"1\" subClass=\"VRTRawRasterBand\">" \
              "    <SourceFilename relativeToVRT=\"0\">$(readlink -f "$1")</SourceFilename>" \
              "    <ByteOrder>MSB</ByteOrder>" \
              "    <NoDataValue>-32768</NoDataValue>" \
              "  </VRTRasterBand>" \
              "</VRTDataset>" > /tmp/raw.vrt
            gdal_translate -q -of GTiff -co COMPRESS=DEFLATE -co PREDICTOR=2 -co TILED=YES \
              /tmp/raw.vrt "$2"
          }

          # ---- GeoTIFFy (model 20m/50m) → dlaždice 1°×1° vo WGS84 ----
          # Jeden súbor môže pokrývať celú krajinu a byť v metrickej projekcii,
          # takže meno dlaždice sa neberie z názvu súboru, ale z rozsahu dát.
          mapfile -t geotiffs < <(find unpacked dl -type f \( -iname '*.tif' -o -iname '*.tiff' \) 2>/dev/null | sort)
          if [ ${#geotiffs[@]} -gt 0 ]; then
            echo "GeoTIFFov na spracovanie: ${#geotiffs[@]}"
            python3 workers/dem/tiles.py --out tiles "${geotiffs[@]}" \
              || echo "::warning::GeoTIFFy sa nepodarilo narezať na dlaždice"
          fi

          # ---- .hgt (model 1″/3″) → dlaždica podľa mena súboru ----
          while IFS= read -r f; do
            base=$(basename "$f")
            tile=$(printf '%s' "$base" | tr '[:lower:]' '[:upper:]' | grep -oE '[NS][0-9]{2}[EW][0-9]{3}' | head -1)
            if [ -z "$tile" ]; then
              echo "::warning::$base nemá v názve meno dlaždice (napr. N49E019) – preskakujem."
              continue
            fi
            out="tiles/$tile.tif"
            tmp="/tmp/$tile.tif"
            case "${base,,}" in
              *.hgt) hgt_to_tif "$f" "$tmp" "$tile" || { echo "::warning::$base sa nepodarilo previesť"; continue; } ;;
              *) continue ;;
            esac
            px=$(gdalinfo -json "$tmp" | jq -r '.size[0]')
            if [ -n "${best_px[$tile]:-}" ] && [ "${best_px[$tile]}" -ge "$px" ]; then
              echo "  $tile: ponechávam ${best_px[$tile]} px (nová verzia má $px px)"
              rm -f "$tmp"
              continue
            fi
            best_px[$tile]=$px
            mv "$tmp" "$out"
            echo "  ✓ $tile (${px}×${px} px, $(du -h "$out" | cut -f1))"
          done < <(find unpacked dl -type f -iname '*.hgt' 2>/dev/null | sort)

          COUNT=$(find tiles -name '*.tif' | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Nevznikla ani jedna dlaždica – skontroluj obsah priečinka (očakávajú sa .tif s výškami alebo .hgt s menom typu N49E019)."
            exit 1
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          du -sh tiles
          ls tiles

      # DO SKLADU NA DRIVE, nie do releasu – do releasov sa nepublikuje nič.
      # Formát skladu, „clobber" aj prihlásenie má `workers/drive/store.py`.
      - name: Publikuj dlaždice do skladu
        if: ${{ contains(fromJSON('["sonny","sonny1"]'), steps.src.outputs.key) }}
        env:
          STORE: ${{ steps.src.outputs.store }}
        run: |
          set -euo pipefail

          # `force` = zahodiť, čo v sklade je. Bez toho by v ňom ostali
          # dlaždice, ktoré sa už nesťahujú, a tvárili by sa ako súčasť
          # tohto výsledku.
          if [ '${{ inputs.force }}' = 'true' ]; then
            BOLO=$(python3 workers/drive/store.py --names --store="$STORE" | tr '\n' ' ')
            [ -n "${BOLO// /}" ] && python3 workers/drive/store.py --rm \
              --store="$STORE" --name="$BOLO" || true
          fi

          jq -n \
            --arg src "Sonny's LiDAR DTM (https://sonny.4lima.de/)" \
            --arg license "CC BY 4.0" \
            --arg folder "$SONNY_DRIVE_FOLDER" \
            --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson tiles "$(cd tiles && find . -maxdepth 1 -name '*.tif' -printf '%f\n' | sed 's/\.tif$//' | jq -R . | jq -s .)" \
            '{source: $src, license: $license, drive_folder: $folder, built_at: $built, tiles: $tiles}' \
            > tiles/meta.json
          cat tiles/meta.json

          python3 workers/drive/store.py --put --store="$STORE" \
            --file="$(find tiles -maxdepth 1 -name '*.tif' -printf '%p ')" \
            --file=tiles/meta.json \
            --note="Dlaždice 1°×1° výškového modelu (GeoTIFF, meno = juhozápadný roh). Zdroj: Sonny's LiDAR DTM (https://sonny.4lima.de/), CC BY 4.0."
          echo "Hotovo – ${{ steps.convert.outputs.count }} dlaždíc v sklade $STORE."

      # ---------- ÚGKK DMR 3.5 (otvorené dáta, jeden ZIP) ----------
      # Ten istý výsledok ako Sonny – 1°×1° dlaždice `N49E019.tif` – takže
      # `workers/dem/fetch.sh` sa pri čítaní vôbec nevetví a rozhoduje len
      # meno skladu.
      - name: Sú dlaždice DMR 3.5 už v sklade?
        id: have35
        if: ${{ steps.src.outputs.key != 'sonny' && steps.src.outputs.key != 'ugkk' }}
        env:
          STORE: ${{ steps.src.outputs.store }}
        run: |
          set -uo pipefail
          N=$(python3 workers/drive/store.py --names --store="$STORE" 2>/dev/null | grep -c . || echo 0)
          if [ '${{ inputs.force }}' = 'true' ]; then
            echo "force=áno – sťahujem nanovo (v sklade je ${N:-0} dlaždíc)."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "${N:-0}" -gt 0 ]; then
            echo "V sklade '$STORE' už je $N dlaždíc – nesťahujem."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # `continue-on-error`: `opendata.skgeodesy.sk` sa z runnera ešte nikdy
      # neskúšal. Keď nepôjde, nie je to dôvod zhodiť beh – volajúci build to
      # zistí z prázdneho skladu a spadne späť na Sonnyho.
      - name: Stiahni a rozrež DMR 3.5
        id: fetch35
        if: ${{ steps.src.outputs.key != 'sonny' && steps.src.outputs.key != 'ugkk' && steps.have35.outputs.skip != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p tiles
          python3 workers/dem/fetch-open.py \
            --url='${{ steps.src.outputs.url }}' \
            --out=tiles --stats=open-stats.txt

      - name: Nahraj DMR 3.5 do skladu
        if: ${{ steps.src.outputs.key != 'sonny' && steps.src.outputs.key != 'ugkk' && steps.fetch35.outcome == 'success' }}
        env:
          STORE: ${{ steps.src.outputs.store }}
        run: |
          set -euo pipefail
          COUNT=$(find tiles -maxdepth 1 -name '*.tif' | wc -l)
          [ "$COUNT" -gt 0 ] || { echo "::warning::Žiadne dlaždice."; exit 0; }
          python3 workers/drive/store.py --put --store="$STORE" \
            --file="$(find tiles -maxdepth 1 -name '*.tif' -printf '%p ')" \
            --note="Dlaždice 1°×1° z https://opendata.skgeodesy.sk. Zdroj: ÚGKK SR – DMR 3.5."
          echo "Nahraných $COUNT dlaždíc do skladu $STORE ✓"

      # ---------- ÚGKK DMR 5.0 (1 m LiDAR, po výrezoch) ----------
      # Pri 1 m má jedna 1° dlaždica ~48 GB, takže sa tu nekrája na dlaždice,
      # ale ukladá jeden COG na pohorie.
      - name: Vyrieš výrez
        id: area
        if: ${{ steps.src.outputs.key == 'ugkk' }}
        run: |
          set -euo pipefail
          python3 workers/plan/area.py \
            --region-bbox='16.815,47.71,22.585,49.635' \
            --area='${{ inputs.area }}' --out="$GITHUB_OUTPUT"

      - name: Je výrez už v sklade?
        id: haveu
        if: ${{ steps.src.outputs.key == 'ugkk' }}
        env:
          STORE: ${{ steps.src.outputs.store }}
        run: |
          set -uo pipefail
          ASSET="ugkk-${{ steps.area.outputs.key }}.tif"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          if [ '${{ inputs.force }}' = 'true' ]; then
            echo "force=áno – sťahujem nanovo."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif python3 workers/drive/store.py --names --store="$STORE" \
                 2>/dev/null | grep -qx "$ASSET"; then
            echo "V sklade už je $ASSET – nesťahujem."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # `continue-on-error`: z GitHub runnera sa DMR 5.0 stiahnuť NEDÁ –
      # zmerané trikrát, hostitelia timeoutujú aj pri 30 s. Ostáva to tu
      # kvôli poľu `url`, kam sa dá vložiť odkaz z ručného exportu.
      - name: Stiahni DMR 5.0
        id: fetchu
        if: ${{ steps.src.outputs.key == 'ugkk' && steps.haveu.outputs.skip != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "Výrez: ${{ steps.area.outputs.name }} (${{ steps.area.outputs.bbox }}), ${{ steps.area.outputs.km2 }} km²"
          python3 workers/dem/fetch-ugkk.py \
            --bbox='${{ steps.area.outputs.bbox }}' \
            --out='${{ steps.haveu.outputs.asset }}' \
            --direct-urls='${{ steps.src.outputs.url }}'

      - name: Nahraj DMR 5.0 do skladu
        if: ${{ steps.src.outputs.key == 'ugkk' && steps.fetchu.outcome == 'success' }}
        env:
          STORE: ${{ steps.src.outputs.store }}
        run: |
          set -euo pipefail
          ASSET='${{ steps.haveu.outputs.asset }}'
          ls -lh "$ASSET"
          # STROP 2 GB TU UŽ NIE JE. Kým sa ukladalo do releasu, väčší asset
          # sa nedal nahrať a krok to hovoril vopred; na Drive taký strop nie
          # je. Ostáva varovanie, lebo veľký COG stojí čas každému, kto ho
          # potom sťahuje – a runner má voľných ~60 GB.
          SZ=$(stat -c%s "$ASSET")
          if [ "$SZ" -gt $((4 * 1024 * 1024 * 1024)) ]; then
            echo "::warning::$ASSET má $(( SZ / 1048576 )) MB. Nahrá sa, ale každý build ho bude celý sťahovať – ak to nie je zámer, zvoľ menší výrez."
          fi
          python3 workers/drive/store.py --put --store="$STORE" --file="$ASSET" \
            --note="Jeden COG na výrez; meno je kľúč z workers/data/areas.json. Zdroj: ÚGKK SR – DMR 5.0."
          echo "Uložené: $STORE / $ASSET"

      - name: Súhrn
        if: ${{ always() }}
        run: |
          set -uo pipefail
          {
            echo "# ${{ steps.src.outputs.label }}"
            echo
            echo "| vec | hodnota |"
            echo "|---|---|"
            echo "| zdroj | \`${{ steps.src.outputs.key }}\` |"
            echo "| sklad | \`${{ steps.src.outputs.store }}\` |"
            echo "| URL | ${{ steps.src.outputs.url }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Sonny leží na Drive, takže „ako sa k nemu beh dostal" je súčasť
          # výsledku, nie detail v logu.
          if [ -n '${{ steps.fetch.outputs.drive_mode }}' ]; then
            echo "| cesta k dátam | ${{ steps.fetch.outputs.drive_mode }} |" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          # Čítať `key=value`, NIE `source`. Hodnoty nie sú shell kód:
          # `crs=S-JTSK / Krovak East North` sa pri `.` vykoná ako príkaz `/`
          # a shell skončí so 126 („Is a directory"). Presne toto zhodilo beh
          # 31125042584 – po tom, čo sa 2,3 GB stiahlo, rozrezalo na 15
          # dlaždíc a nahralo do releasu. Súhrn nesmie zhodiť hotovú prácu.
          get() { sed -n "s/^$1=//p" open-stats.txt | head -1; }
          if [ -s open-stats.txt ]; then
            {
              echo "| dlaždíc | $(get tiles) ($(get mb) MB) |"
              echo "| **skutočná mriežka** | **$(get cell_m) m** (Sonny má 20 m) |"
              echo "| CRS zdroja | $(get crs) |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
