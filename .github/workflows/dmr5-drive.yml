name: Dáta · DMR 5.0

# Výškový model z DMR 5.0 v ETRS89, ktorý leží na Google Drive ako dva holé
# BigTIFFy. Toto je JEDINÁ cesta k DMR 5.0:
#
#   area: <pohorie>       →  ugkk-<pohorie>.tif  →  sklad `dem-ugkk`
#                            Build map: rock_source: dmr5 + rovnaké `rock_area`
#   area: cele_slovensko  →  dlaždice N49E019.tif →  sklad `dem-dmr5`
#                            Build map: rock_source: dmr5 bez výrezu
#
# V Build map je to jedna voľba `dmr5` a podobu si vyberá podľa rozsahu:
# s výrezom plné 1 m, bez neho dlaždice na 5 m. Dva výbery to boli dovtedy,
# kým sa dalo zadať 1 m na celý kraj – a to je 16 miliárd buniek.
#
# TOTO JE TÁ PIPELINE, KTORÚ VOLÁ BUILD MAP. Volá ju DVAKRÁT, lebo DMR 5.0 má
# dve podoby a chýbať môžu naraz (`mirror-dmr5-area` = výrez do `dem-ugkk`,
# `mirror-dmr5-tiles` = 1° dlaždice do `dem-dmr5`). Sú to dva joby nad JEDNÝM
# workflowom, nie dve pipeline.
#
# SKLADY SÚ PRIEČINKY NA DRIVE, nie GitHub releasy – do releasov sa nepublikuje
# nič. Celý formát skladu je vo `workers/drive/store.py`; mená súborov ostali
# tie isté, aké mali assety, lebo meno je sľub o rozsahu.
#
# PREČO UŽ NIE JE ZÁLOHA. Ten istý model sa dal brať aj z archívu ÚGKK
# (`dmr5.yml`) – 198 GB ZIP, v ktorom je raster jedným deflate prúdom, takže
# sa v ňom nedá skočiť dopredu: platilo tam „čítaj raz a sekvenčne" a výrez na
# juhu Slovenska stál prechod celým súborom. Tu sú súbory holé, každá dlaždica
# má vlastnú kompresiu a Range funguje na ľubovoľnom offsete, takže sa číta len
# to, čo výrez pretína – rádovo minúty namiesto hodín. Odkedy Drive púšťa
# spoľahlivo, tá druhá cesta sa neoplácala udržiavať a bola zrušená.
#
# ČÍTA SA PRIHLÁSENÝ AKO VLASTNÍK DÁT, a inak sa nečíta vôbec. Model leží
# v PRIEČINKU na Drive (`FOLDER_ID` vo `workers/drive/dmr5.py`) a čo v ňom je,
# povie len Drive API – to anonymné požiadavky neobsluhuje. Token vlastníka zo
# secretu `GDRIVE_CREDENTIALS` vyrobí `workers/drive/auth.py --login` a krok
# „Prihlásenie na Drive" v každom behu vypíše, ktorým účtom sa čítalo a či na
# súbory vidí. Bez neho beh spadne hneď a s návodom.
#
# ČO TO ZNAMENÁ, KEĎ DRIVE NEPUSTÍ: DMR 5.0 sa v tom behu nedoplní vôbec.
# Nie je to tichý stav – `drive-serve.py` vráti 502 s vysvetlením a beh spadne
# v sekundách; so zapnutým `ugkk_fallback` prejde na hrubší model (sonny)
# a atribúcia to povie. Prvá vec, čo s tým: prihlásiť sa ako vlastník
# (`GDRIVE_CREDENTIALS`). Až potom nahrať kópiu modelu do iného priečinka
# a prepísať `FOLDER_ID` vo `workers/drive/dmr5.py`.
#
# ZDROJ (namerané, nie odhad):
#   dmr5_etrs89.tif      145,39 GiB  423 518 × 207 589 px, 1 m, LZW, dlaždice 128²
#   dmr5_etrs89.tif.ovr   43,35 GiB  pyramídy 2 … 256 m, deflate
#   CRS EPSG:3046 (ETRS89 / TM zone N34), origin X 191 148, Y 5 497 220
#
# VÝŠKY SÚ ELIPSOIDICKÉ. Maximum v súbore je 2 697,03 m, kým Gerlach má
# 2 654,4 m n. m. Bpv – tých +42,6 m je geoid. Predvolene sa odčíta EGM2008
# (kontrola na Gerlachu: 2 653,92 m po prevode, čiže rozdiel 0,5 m na 1 m
# mriežke). Na skaly by to bolo jedno, na vrstevnice nie.

on:
  workflow_dispatch:
    inputs:
      area:
        description: "Územie. Pohorie ide do dem-ugkk, celé Slovensko do dem-dmr5"
        required: true
        default: vysoke_tatry
        type: choice
        options:
          - cele_slovensko
          - tatry
          - vysoke_tatry
          - belianske_tatry
          - zapadne_tatry
          - nizke_tatry
          - slovensky_raj
          - pieniny
          - mala_fatra
          - velka_fatra
          - sulovske_skaly
          - slovensky_kras
          - muranska_planina
          - vihorlat
          - strazovske_vrchy
          - male_karpaty
      grid_m:
        description: "Mriežka výsledku"
        required: false
        default: "auto (1 m na pohorie, 5 m na celé Slovensko)"
        type: choice
        options:
          - "auto (1 m na pohorie, 5 m na celé Slovensko)"
          - "1 m – plné rozlíšenie, len na pohorie"
          - "2 m – z pyramíd, štvrtinový objem"
          - "5 m – celé Slovensko"
          - "10 m"
          - "20 m – rýchly test"
      geoid:
        description: "Výšky vo výstupe"
        required: false
        default: "EGM2008 (≈ Bpv) – ako ostatné zdroje"
        type: choice
        options:
          - "EGM2008 (≈ Bpv) – ako ostatné zdroje"
          - "elipsoidické ETRS89 – tak, ako sú v súbore"
      mode:
        description: "Čo spraviť"
        required: false
        default: "model do releasu"
        type: choice
        options:
          - "model do releasu"
          - "len sonda – čo je v zdroji, nič sa nereže"
      # Podoba výstupu. Pri `cele_slovensko` je to dlaždice tak či tak; toto
      # je na to, aby sa dali doplniť dlaždice aj pre menšie územie – okno sa
      # rozšíri na celé stupne a vypadnú `N49E020.tif` do `dem-dmr5`. Presne
      # to si Build map dopĺňa pre tieňovanie, ktoré výrezovú podobu použiť
      # nevie (robí sa na celý región, kde 1 m verzia neexistuje).
      tiles:
        description: "Vyrobiť 1° dlaždice do dem-dmr5 aj pre pohorie (inak je z pohoria jeden výrez)"
        required: false
        default: false
        type: boolean
      jobs:
        description: "Koľko blokov čítať naraz. Drive je latenčný, nie úzky"
        required: false
        default: "12"
        type: string
      # Meno výsledku pri výreze. Ručne sa nevypĺňa – je tu preto, že
      # `inputs.asset` musí byť deklarovaný pre OBA spúšťače, inak je to
      # výraz nad neexistujúcim vstupom (to isté ako `mode` nižšie).
      asset:
        description: "Meno súboru pri výreze (prázdne = ugkk-<area>.tif)"
        required: false
        default: ""
        type: string

  # Volá ho aj „Build map", keď mu v sklade chýba výškový model. Doteraz to
  # nešlo a bola to tá diera, cez ktorú padali behy: `check-dem` povedal
  # „dmr5 treba doplniť", poslal to do update-dem.yml – a ten na `dmr5` len
  # vypísal, kam ísť ručne, a skončil úspechom. Nič sa nestiahlo a build spadol
  # o desať jobov neskôr na tom, že v sklade nie je ani jedna dlaždica
  # (beh 31307163093).
  #
  # `workflow_call` nepozná `type: choice`, tak sem chodia holé hodnoty:
  # `area` je kľúč pohoria, `cele_slovensko`, ALEBO bbox `W,S,E,N`, `grid_m`
  # je číslo v metroch a `tiles` hovorí, ktorá z dvoch podôb sa má vyrobiť.
  #
  # BUILD MAP PODÁVA BBOX, NIE KĽÚČ POHORIA – a to je to podstatné. Čo sa má
  # prečítať, vie len on: výrez pretnutý s regiónom, pri rýchlom teste štvorec
  # na pár km². Keby sa sem podal kľúč, táto pipeline by si ho vyriešila
  # z `areas.json` druhýkrát a prečítala celý obdĺžnik pohoria – rýchly test
  # na 2 km² tak čítal z Drive 541 km² Vysokých Tatier (hodiny namiesto minút).
  # Je to tá istá chyba ako beh 31307163093: dve odpovede na jednu otázku.
  # Meno výsledku preto chodí zvlášť v `asset`.
  workflow_call:
    inputs:
      area:
        required: true
        type: string
      asset:
        # Meno výrezového assetu. Pri bboxe v `area` je POVINNÉ: build si
        # súbor hľadá podľa mena (`ugkk-vysoke_tatry.tif`) a
        # `ugkk-20.1,49.1,20.2,49.2.tif` si vypýtať nevie.
        required: false
        default: ""
        type: string
      grid_m:
        # Prázdne = podľa rozsahu (1 m na výrez, 5 m na dlaždice).
        required: false
        default: ""
        type: string
      tiles:
        # true = 1° dlaždice do dem-dmr5 (aj z výrezu – okno sa rozšíri na
        # celé stupne). false = jeden COG ugkk-<area>.tif do dem-ugkk.
        required: false
        default: false
        type: boolean
      geoid:
        required: false
        default: egm2008
        type: string
      jobs:
        required: false
        default: "12"
        type: string
      # Volajúci ju nemá prečo meniť; je tu preto, aby `inputs.mode` v jobe
      # bol deklarovaný pre OBA spúšťače a nebol to výraz nad neexistujúcim
      # vstupom.
      mode:
        required: false
        default: "model do releasu"
        type: string
    secrets:
      # Prihlásenie vlastníka dát na Drive, dvomi možnými tvarmi: buď všetko
      # v jednom (GDRIVE_CREDENTIALS), alebo po dvoch – to druhé preto, že
      # `client_secret` Google druhýkrát neukáže, takže keď už raz v secrets
      # leží, nemá sa prepisovať. `client_id` (DRIVE_CLIENT) medzi secrets
      # nie je: nie je to tajné, je to repository variable a v tomto istom
      # repozitári sa `vars.DRIVE_CLIENT` číta priamo nižšie, bez podávania
      # cez `workflow_call`. Všetko `required: false`: bez prihlásenia sa
      # číta verejným odkazom ako predtým, len s denným limitom, ktorý zdieľajú
      # všetci klienti. Volajúci to podávajú cez `secrets: inherit`.
      GDRIVE_CREDENTIALS:
        required: false
      DRIVE_SECRET:
        required: false
      DRIVE_REFRESH:
        required: false

# `contents: read` stačí: publikuje sa na Drive, nie do releasov, takže tento
# workflow do repozitára nezapisuje nič. Kým tu bolo `write`, bolo to práve
# na `gh release create`.
permissions:
  contents: read

concurrency:
  # Dva behy naraz by z Drive ťahali dvojnásobok a prepisovali ten istý asset.
  # Podoba je v kľúči zvlášť: odkedy sa výrez zadáva bboxom (a nie menom
  # pohoria), sú obe podoby „nejaký bbox" a na rozlíšenie sa spoľahnúť nedá.
  # Build map si ich pritom dopĺňa SÚBEŽNE – keby si sadli do jednej skupiny,
  # jedna by zbytočne čakala na druhú.
  group: dmr5-drive-${{ inputs.tiles }}-${{ inputs.area }}
  cancel-in-progress: false

jobs:
  model:
    name: Výškový model z Drive
    runs-on: ubuntu-latest
    # ROZDELENÉ NA KROKY, KTORÝCH JE ČO NAJVIAC. Kým to boli tri („Nastavenia",
    # „Vyrež model", „Nahraj do releasu"), bol z hodinového behu v Actions
    # jeden riadok bez konca a z padnutého behu sa nedalo povedať, či nesedelo
    # zadanie, či nešlo otvoriť zdroj, či došiel čas pri čítaní, alebo sa
    # nepodaril upload. Každý krok teraz hovorí, ČO ROBÍ a AKO ĎALEKO je:
    #
    #   1. príprava       runner, GDAL, miesto na disku
    #   2. Nastavenia     z formulára konkrétne čísla a mená (jediné miesto)
    #   3. Prihlásenie    ktorým účtom sa z Drive číta (vlastník vs. verejne)
    #   4. Sonda          otvor zdroj – 8 s, 9 požiadaviek, 0,3 MB
    #   5. Plán čítania   okno, počet blokov, odhad času a objemu
    #   6. Čítanie        bloky z Drive, postup `[i/N]` po každom bloku
    #   7. Zloženie       mozaika → COG alebo 1° dlaždice (už len nad diskom)
    #   8. Kontrola       veľkosť assetov proti stropu 2 GB
    #   9. Metadáta       meta-*.json vedľa modelu
    #  10. Nahranie       do skladu na Drive
    #  11. Súhrn          tabuľka do prehľadu behu
    #
    # Kroky 5–7 sú fázy jedného scriptu (`--stage`), ktoré si stav podávajú
    # cez `drive-work/`. Vedľajší zisk: prečítané bloky sa v ňom zachovajú,
    # takže opakovaný krok `Čítanie` dopočíta len zvyšok.
    env:
      # Prihlásenie na Drive ako vlastník dát – dvíha limit sťahovania.
      # Podávané celému jobu, lebo naň siaha aj sonda, aj plán, aj čítanie.
      # Dva tvary: všetko v jednom, alebo po troch (`client_secret` Google
      # druhýkrát neukáže, tak sa raz uložené nemá prepisovať). `client_id`
      # (DRIVE_CLIENT) je repository variable, nie secret – nie je to tajné.
      # Bez oboch sa číta verejným odkazom. Viď workers/drive/auth.py.
      GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
      DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
      DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Nainštaluj GDAL
        run: |
          set -euo pipefail
          echo "Inštalujem gdal-bin a jq…"
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin jq
          echo "GDAL: $(gdalinfo --version)"

      - name: Uvoľni miesto na disku
        run: |
          set -uo pipefail
          echo "Voľné miesto pred upratovaním:"
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          echo "Voľné miesto po upratovaní:"
          df -h / | tail -1

      # Jediné miesto, kde sa z formulára stanú konkrétne čísla a mená.
      - name: Nastavenia
        id: cfg
        run: |
          set -euo pipefail
          AREA='${{ inputs.area }}'
          # PODOBA. Dve sú a rozhoduje rozsah, nie druhý výber vo formulári:
          #
          #   dlaždice  N49E019.tif … → dem-dmr5   celé Slovensko, alebo
          #                                        `tiles: true` na výrez
          #   výrez     ugkk-<area>.tif → dem-ugkk plné 1 m rozlíšenie
          #
          # `cele_slovensko` je dlaždicová vždy – jeden COG na krajinu by mal
          # pri akejkoľvek použiteľnej mriežke desiatky GB. `tiles: true`
          # existuje kvôli Build map: tieňovanie chce dlaždicovú podobu, ale
          # nepotrebuje kvôli nej celú krajinu, stačia dotknuté stupne.
          TILES=false
          if [ '${{ inputs.tiles }}' = 'true' ] || [ "$AREA" = cele_slovensko ]; then
            TILES=true
          fi
          if [ "$TILES" = true ]; then
            REL=dem-dmr5
          else
            REL=dem-ugkk
          fi
          SRC=dmr5

          # MENO VÝREZOVÉHO ASSETU. Robí sa z `area`, lenže `area` môže byť aj
          # bbox – a `ugkk-20,49,21,50.tif` si Build map vypýtať nevie, lebo
          # hľadá `ugkk-<kľúč výrezu>.tif`. Preto sa meno dá podať zvlášť
          # v `asset` a pri bboxe je povinné.
          #
          # Bbox tu nie je okrajový prípad, ale to bežné: Build map ním hovorí,
          # ČO SA MÁ NAOZAJ PREČÍTAŤ (výrez pretnutý s regiónom, pri rýchlom
          # teste štvorec na pár km²). Kým sa sem podával kľúč pohoria, táto
          # pipeline si ho vyriešila z `areas.json` druhýkrát a prečítala celý
          # obdĺžnik – test na 2 km² tak čítal 541 km² Vysokých Tatier.
          ASSET='${{ inputs.asset }}'
          case "$AREA" in
            *,*) if [ "$TILES" != true ] && [ -z "$ASSET" ]; then
                   echo '::error::Bbox v „area" bez „asset" ide len s „tiles: true" – výrezový asset sa inak volá podľa pohoria a „ugkk-20,49,21,50.tif" si Build map vypýtať nevie. Zadaj pohorie, vyplň asset, alebo zapni tiles.'
                   exit 1
                 fi ;;
          esac
          if [ "$TILES" != true ] && [ -z "$ASSET" ]; then
            ASSET="ugkk-${AREA}.tif"
          fi

          GRID=$(printf '%s' '${{ inputs.grid_m }}' | grep -oE '^[0-9]+' || true)
          if [ -z "$GRID" ]; then
            GRID=$([ "$TILES" = true ] && echo 5 || echo 1)
          fi

          # Strážca, ktorý ušetrí hodiny počítania: 1°×1° dlaždica pri 1 m má
          # v metri ~48 GB surových buniek (vyše 5 GB skomprimovaná) a runner
          # má voľných ~60 GB, takže sa nemá kde ani vyrobiť, nieto zlepiť do
          # mozaiky. Platí pre KAŽDÚ dlaždicu, nie len pre celú krajinu – aj
          # jeden stupeň z výrezu je celý stupeň. (Kým sa ukladalo do releasov,
          # hranicu držal ich 2 GB strop na asset; sklad na Drive taký strop
          # nemá, runner ostal ten istý.)
          if [ "$TILES" = true ] && [ "$GRID" -lt 3 ]; then
            echo "::error::Dlaždice pri mriežke ${GRID} m sa na runner nezmestia (jedna 1° dlaždica má v metri ~48 GB buniek, voľných je ~60 GB). Zvoľ 5 m, alebo si vyber pohorie s vypnutým tiles."
            exit 1
          fi

          case '${{ inputs.geoid }}' in
            elipsoid*) GEOID=elipsoid ;;
            *) GEOID=egm2008 ;;
          esac

          {
            echo "grid=$GRID"
            echo "store=$REL"
            echo "dem_source=$SRC"
            echo "tiles=$TILES"
            echo "asset=$ASSET"
            echo "whole_country=$([ "$AREA" = cele_slovensko ] && echo true || echo false)"
            echo "geoid=$GEOID"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Čo tento beh spraví"
            echo
            echo "| nastavenie | hodnota |"
            echo "|---|---|"
            echo "| územie | \`$AREA\` |"
            echo "| mriežka | ${GRID} m |"
            echo "| podoba | $([ "$TILES" = true ] && echo '1° dlaždice' || echo "výrez \`$ASSET\`") |"
            echo "| sklad | \`$REL\` |"
            echo "| výšky | $GEOID |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "── $AREA, mriežka ${GRID} m, výšky $GEOID, podoba $([ "$TILES" = true ] && echo dlaždice || echo "výrez $ASSET") → sklad $REL"

      # Lacná otázka s drahou odpoveďou: čítame ako VLASTNÍK dát, alebo
      # verejným odkazom? Verejný má denný limit sťahovania, ktorý zdieľajú
      # všetci klienti, a keď sa vyčerpá, DMR 5.0 sa v behu nedoplní vôbec
      # (beh 31315890474 na tom visel 2 h 16 min). Stojí to token a dve
      # metadátové požiadavky – a povie sa to TU, nie po hodine čítania.
      # Vlastný krok preto, že padnutý krok s týmto menom je sám o sebe
      # diagnóza: nesedí secret, nie dáta ani sieť.
      - name: Prihlásenie na Drive (vlastník dát)
        run: python3 workers/drive/dmr5.py --auth-check

      # Otvorenie zdroja stojí 8 s, 9 požiadaviek a 0,3 MB, tak sa robí VŽDY
      # a nie len v režime sondy: keď Drive zmení odkaz alebo shim prestane
      # opravovať `content-length`, má sa to povedať tu a nie po hodine
      # čítania. `mode: len sonda` je potom už len „a tu skonči".
      - name: Sonda – čo je v zdroji na Drive
        run: python3 workers/drive/dmr5.py --probe-only

      # Lacný krok, ktorý odpovie na jedinú otázku, čo pred hodinovým čítaním
      # zaujíma: koľko toho bude. Trojhodinový krok, ktorý spadne na timeout,
      # je najhorší možný výsledok – minie celý rozpočet a nevyrobí nič.
      - name: Plán čítania (okno, bloky, odhad)
        id: plan
        if: ${{ !startsWith(inputs.mode, 'len sonda') }}
        run: |
          set -euo pipefail
          # Prepínač sa skladá do poľa, nie do reťazca: prázdny reťazec by sa
          # pri rozvinutí stal prázdnym argumentom a argparse ho vezme ako
          # hodnotu predchádzajúcej voľby.
          ARGS=()
          if [ '${{ steps.cfg.outputs.tiles }}' = 'true' ]; then
            ARGS+=(--tiles)
          else
            ARGS+=(--asset="${{ steps.cfg.outputs.asset }}")
          fi
          python3 workers/drive/dmr5.py --stage=plan \
            --area='${{ inputs.area }}' \
            --grid-m='${{ steps.cfg.outputs.grid }}' \
            --geoid='${{ steps.cfg.outputs.geoid }}' \
            --jobs='${{ inputs.jobs }}' \
            "${ARGS[@]}" \
            --out=out --work=drive-work

      # TOTO JE TÁ DLHÁ ČASŤ a jediná, ktorá siaha na sieť. Postup sa vypisuje
      # po každom bloku (`[i/N]`, prečítané MB, odhad zvyšku), takže sa
      # napredujúci beh dá odlíšiť od takého, čo visí na jednom bloku.
      - name: Čítanie blokov z Drive
        if: ${{ !startsWith(inputs.mode, 'len sonda') }}
        run: |
          set -euo pipefail
          python3 workers/drive/dmr5.py --stage=read \
            --geoid='${{ steps.cfg.outputs.geoid }}' \
            --jobs='${{ inputs.jobs }}' \
            --out=out --work=drive-work

      # Už len nad diskom – na Drive sa nesiaha. Preto je to vlastný krok:
      # keď zlyhá tu, nie je to sieť ani zdroj, ale prevod výšok alebo miesto
      # na disku, a to sa hľadá úplne inde.
      - name: Zloženie výstupu (mozaika, výšky, COG/dlaždice)
        if: ${{ !startsWith(inputs.mode, 'len sonda') }}
        run: |
          set -euo pipefail
          python3 workers/drive/dmr5.py --stage=finish \
            --geoid='${{ steps.cfg.outputs.geoid }}' \
            --out=out --work=drive-work \
            --summary=model-summary.md
          echo "Vzniklo:"
          ls -lh out/*.tif

      # Vlastný krok, lebo je to zamietnutie zadania a nie zlyhanie výpočtu:
      # model je hotový, len sa doň nezmestí. Nech je to v Actions vidieť ako
      # „Kontrola veľkosti" a nie ako „Nahraj do releasu".
      - name: Kontrola veľkosti assetov (strop 2 GB)
        if: ${{ !startsWith(inputs.mode, 'len sonda') }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(out/*.tif)
          [ ${#FILES[@]} -gt 0 ] || { echo "::error::Nevznikol ani jeden súbor."; exit 1; }
          BIG=0
          for f in "${FILES[@]}"; do
            SZ=$(stat -c%s "$f")
            printf '  %-24s %6s MB\n' "$(basename "$f")" "$(( SZ / 1048576 ))"
            # 2 GB strop assetu releasu tu už nie je – sklad na Drive ho
            # nemá. Ostáva varovanie: veľký súbor platí každý build, ktorý si
            # ho vypýta, a runner má voľných ~60 GB.
            if [ "$SZ" -gt $((4 * 1024 * 1024 * 1024)) ]; then
              echo "::warning::$f má $(( SZ / 1048576 )) MB. Nahrá sa, ale každý build ho bude celý sťahovať – ak to nie je zámer, zvoľ hrubšiu mriežku alebo menšie územie."
              BIG=$(( BIG + 1 ))
            fi
          done
          echo "${#FILES[@]} súborov, $BIG z nich nad 4 GB"

      # Meno metadát nesie územie. Dlaždicová podoba sa dopĺňa po stupňoch
      # (Build map si vypýta len tie, čo jeho bbox pretína), takže jedno
      # spoločné `meta-dmr5-drive.json` by po každom behu tvrdilo, že
      # v sklade je len to, čo vzniklo naposledy.
      - name: Metadáta modelu
        id: meta
        if: ${{ !startsWith(inputs.mode, 'len sonda') }}
        run: |
          set -euo pipefail
          META="meta-dmr5-drive-$(printf '%s' '${{ inputs.area }}' | tr -c 'a-zA-Z0-9' '_').json"
          shopt -s nullglob
          FILES=(out/*.tif)
          jq -n \
            --arg src "ÚGKK SR – DMR 5.0 (LLS), ETRS89" \
            --arg area '${{ inputs.area }}' \
            --arg grid '${{ steps.cfg.outputs.grid }}' \
            --arg geoid '${{ steps.cfg.outputs.geoid }}' \
            --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson files "$(printf '%s\n' "${FILES[@]}" | xargs -n1 basename | jq -R . | jq -s .)" \
            '{source:$src, crs:"EPSG:3046", area:$area, cell_m:($grid|tonumber), heights:$geoid, built_at:$built, files:$files}' \
            > "out/$META"
          cat "out/$META"
          echo "meta=$META" >> "$GITHUB_OUTPUT"

      - name: Nahraj do skladu na Drive
        if: ${{ !startsWith(inputs.mode, 'len sonda') }}
        env:
          STORE: ${{ steps.cfg.outputs.store }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(out/*.tif)
          echo "Nahrávam ${#FILES[@]} súborov do skladu $STORE…"
          python3 workers/drive/store.py --put --store="$STORE" \
            --file="${FILES[*]}" --file="out/${{ steps.meta.outputs.meta }}" \
            --note="Z DMR 5.0 v ETRS89, čítaného cez HTTP Range. Zdroj: ÚGKK SR, voľné použitie pri uvedení zdroja."
          echo "V sklade $STORE: ${#FILES[@]} súborov ✓"

      # Výstup tohto workflowu je vstup pre Build map – nech je z behu jasné,
      # čo tam nastaviť, aby z toho boli skaly.
      - name: Súhrn
        if: ${{ always() }}
        run: |
          set -uo pipefail
          [ -s model-summary.md ] && cat model-summary.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo "## Čo z toho má Build map"
            echo
            if [ '${{ steps.cfg.outputs.tiles }}' = 'true' ]; then
              echo "Dlaždicová podoba v sklade \`${{ steps.cfg.outputs.store }}\`."
              echo "Berie si ju **tieňovanie a 3D terén** (\`shading_source: dmr5\`)"
              echo "a vrstevnice/skaly vtedy, keď beh nemá výrez."
            else
              echo "Výrez v plnom rozlíšení v sklade \`${{ steps.cfg.outputs.store }}\`"
              echo "ako \`${{ steps.cfg.outputs.asset }}\`."
              echo "Berú si ho **vrstevnice a skaly** pri \`area: ${{ inputs.area }}\`."
              echo
              echo "| input | hodnota |"
              echo "|---|---|"
              echo "| \`rock_source\` | \`${{ steps.cfg.outputs.dem_source }}\` |"
              echo "| \`area\` | \`${{ inputs.area }}\` |"
              echo "| \`layers\` | \`contours\` (vrstevnice + skaly) |"
            fi
            echo
            echo "Ručne to spúšťať netreba – Build map si oba tvary dopĺňa sám"
            echo "(joby \`Doplniť DMR 5.0 …\`)."
          } >> "$GITHUB_STEP_SUMMARY"
