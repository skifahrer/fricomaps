name: SONDA k – bez terrain

# Stiahne PBF export IBA zvoleného regiónu z osm.fr regionálnych exportov
# (https://download.openstreetmap.fr/extracts/ – Európa aj svet, rezané po
# administratívnych hraniciach, denne aktualizované).
# Potom Planetiler → PMTiles → GitHub Pages.
#
# Detail a zoom:
#   Planetiler má tvrdý limit `maxzoom <= 16` (PlanetilerConfig.MAX_MAXZOOM).
#   Vyšší zoom (až z20) sa NEGENERUJE do dlaždíc – rieši ho MapLibre overzoomom
#   nad dlaždicami z16. Aby overzoom vyzeral ostro, generujeme najvyšší zoom
#   s nulovou simplifikáciou a bez zahadzovania malých prvkov.
#
# Ľubovoľný iný región Európy/sveta: vyplň input `custom_pbf_url`
# (URL na .osm.pbf z download.openstreetmap.fr/extracts/...) + `custom_name`.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Región (ignoruje sa, ak je vyplnené custom_pbf_url)"
        required: true
        default: slovensko
        type: choice
        options:
          - slovensko
          - bratislavsky
          - trnavsky
          - trenciansky
          - nitriansky
          - zilinsky
          - banskobystricky
          - presovsky
          - kosicky
      area:
        description: "TESTOVACÍ VÝREZ – vrstevnice aj skaly len na tomto pohorí (celý kraj trvá ~40 min, jedno pohorie ~2). Vlastný bbox cez options: area_bbox=W,S,E,N"
        required: false
        default: cely_region
        type: choice
        options:
          - cely_region
          - tatry
          - vysoke_tatry
          - belianske_tatry
          - zapadne_tatry
          - nizke_tatry
          - slovensky_raj
          - pieniny
          - mala_fatra
          - velka_fatra
          - sulovske_skaly
          - slovensky_kras
          - muranska_planina
          - vihorlat
          - strazovske_vrchy
          - male_karpaty
      # Tri výbery zdroja, jeden na vrstvu. Kým bol `dem_source` jeden pre
      # všetko, nedalo sa povedať to, čo dáva zmysel najčastejšie: skaly
      # z najjemnejšieho modelu (aj keď je len na výrez) a tieňovanie
      # z hrubšieho, ktorý pokrýva celý región. `ziadne` vrstvu vypne –
      # zapínač je tým pádom v tom istom poli ako zdroj a nie vedľa neho,
      # takže sa nedá zadať „generuj vrstevnice, zdroj žiadny".
      # Zoznam zdrojov drží workers/dem-sources.json (stráži to Lint workflows).
      contour_source:
        description: "VRSTEVNICE – z ktorého modelu terénu. sonny = 20 m, celý región. dmr35 = ÚGKK DMR 3.5, 10 m. dmr5 = ÚGKK DMR 5.0 (LLS), 5 m. ugkk = 1 m LiDAR, LEN na výrez. ziadne = negenerovať"
        required: false
        default: sonny
        type: choice
        options:
          - sonny
          - dmr35
          - dmr5
          - ugkk
          - ziadne
      rock_source:
        description: "SKALY – zo sklonu ktorého modelu (sonny / dmr35 / dmr5 / ugkk), alebo tienovanie = hotové polygóny z workflowu „Skaly z tieňovaných dlaždíc“ (treba ho najprv pustiť na ten istý výrez). ziadne = negenerovať"
        required: false
        default: sonny
        type: choice
        options:
          - sonny
          - dmr35
          - dmr5
          - ugkk
          - tienovanie
          - ziadne
      shading_source:
        description: "TIEŇOVANIE A 3D TERÉN – z ktorého modelu. ugkk tu nie je: 1 m LiDAR máme len na výrez, tieňovanie sa robí na celý región. ziadne = negenerovať"
        required: false
        default: sonny
        type: choice
        options:
          - sonny
          - dmr35
          - dmr5
          - ziadne
      contour_interval:
        description: "Interval vrstevníc v metroch (10 = štandard, 5 = hustejšie, 20 = redšie). Každá 10. sa kreslí ako hlavná, každá 5. ako polovičná"
        required: false
        default: "10"
        type: string
      rock_slope:
        description: "Od akého sklonu (°) je terén skala – 50 = steny, 40 = aj strmé svahy (oveľa väčšie plochy)"
        required: false
        default: "50"
        type: string
      rock_res:
        description: "Mriežka na obrys skál v metroch. auto = najjemnejšia, ktorá sa zmestí do času a má pri danom DEM ešte zmysel (odporúčané). Alebo číslo, napr. 1"
        required: false
        default: auto
        type: string
      rebuild:
        description: "Čo pregenerovať nanovo (zmaže cache aj uloženú verziu)"
        required: false
        default: nic
        type: choice
        options:
          - nic
          - vrstevnice
          - skaly
          - teren
          - vsetko
      options:
        description: "Zriedka menené nastavenia ako kľúč=hodnota, napr. `crop_bbox=18.9,49.1,19.2,49.3 size_limit_mb=1200`. Zoznam kľúčov je vo workers/parse-options.py"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  OSMFR_BASE: https://download.openstreetmap.fr/extracts
  # Glyfy (fonty) si hostíme sami – verejná služba fonts.openmaptiles.org je
  # jediný bod zlyhania, pri ktorom sa mapa vykreslí bez akýchkoľvek nápisov.
  # (Zdroje ikoniek sú v poc/web/icon-sources.js.)
  GLYPHS_ZIP: https://github.com/openmaptiles/fonts/releases/download/v2.0/noto-sans.zip
  # Release s dlaždicami Sonny's LiDAR DTM (napĺňa ho workflow "Update DEM").
  DEM_RELEASE: dem-sonny
  # Otvorené dáta ÚGKK (DMR 3.5). Tie isté 1°×1° dlaždice ako Sonny, len
  # z iného modelu – napĺňa ich „Stiahnuť výškové dáta" so `source: dmr35`.
  DMR35_RELEASE: dem-dmr35
  # ÚGKK DMR 5.0 (LLS) – opäť tie isté 1°×1° dlaždice, mriežka 5 m. Napĺňa
  # ich workflow „Pripraviť DMR 5.0" s `area: cele_slovensko`; sám sa nedopĺňa, lebo je
  # to 198 GB archív a desiatky paralelných jobov.
  DMR5_RELEASE: dem-dmr5
  # Skaly = najstrmšie úseky terénu, ako vektorové plochy. Ladenie je tu
  # v env, aby inputov workflowu nebolo priveľa. Predvolené hodnoty idú na
  # maximálnu presnosť – nič sa nezahladzuje ani nezahadzuje:
  # Release s hotovými výškovými (hillshade) dlaždicami – aby sa nerobili znova.
  TERRAIN_RELEASE: dem-terrain
  # Release s hotovými skalami. Sú to desiatky minút výpočtu, ale závisia len
  # od územia a nastavení – tie sú preto v mene assetu a hotové skaly sa
  # nabudúce len stiahnu.
  ROCK_RELEASE: dem-rocks
  # Skaly nájdené ako tmavé plochy v tieňovaných dlaždiciach – napĺňa ich
  # workflow „Skaly z tieňovaných dlaždíc". Build ich nikdy nepočíta, len
  # si ich vypýta výberom `rock_source: tienovanie`.
  ROCK_IMG_RELEASE: dem-rocks-img
  ROCK_RES: auto # záložná mriežka na sklon (m), keď input rock_res chýba
  # Najmenšia skalná plocha sa dopočíta ako jedna bunka mriežky (pri 2 m teda
  # 4 m²) – menšie útvary sú už len zubaté artefakty jednej bunky, nie skala.
  # Zjednodušenie obrysu (m). -1 = štvrtina mriežky: zmaže schodíky po hranách
  # buniek, ale obrys neposunie o viac než štvrtinu bunky. 0 = vypnuté.
  ROCK_SIMPLIFY: "-1"
  # Koľkokrát zaobliť rohy obrysu (Chaikin). Zjednodušenie vyššie zmaže
  # schodíky, ale to, čo po ňom ostane, sú ostré rohy – priemerný lom medzi
  # segmentmi vyskočí zo 4,6° na 28,5° a presne tak vyzerá skala pri max
  # zoome zubatá. Dva prechody dajú 7,7° pri 43 % menej bodov, než má
  # nezjednodušený originál. Podrobnosti a čísla vo workers/smooth-polygons.py.
  ROCK_SMOOTH: "2"
  # Verzia algoritmu v mene uloženého assetu. Zmena algoritmu = iné skaly,
  # takže sa nesmú použiť tie staré uložené. v3 = zaoblený obrys + auto mriežka.
  ROCK_ALGO: v3
  ROCK_CLIFF_PLUS: "15" # o koľko ° nad prahom začína trieda `cliff` (tmavšia)
  # Koľko buniek naraz. Sklon sa počíta po častiach, lebo bbox kraja má pri
  # 2 m vyše 3 miliardy buniek (~13 GB na jeden raster) – naraz sa to do
  # runnera nezmestí. 150 miliónov je ~600 MB na raster, čo je bezpečné.
  # Vektorizuje sa až hotová mozaika, jedným priechodom – po častiach by sa
  # diery prerezané hranicou časti stratili.
  ROCK_CHUNK_CELLS: "150000000"
  # Koľko minút smú skaly trvať. Celý job má na runneri 3 hodiny a musí sa
  # doň zmestiť aj mapa. Nad odhad sa výpočet vôbec nezačne – build to povie
  # v prvých sekundách aj s tým, čo zmenšiť, namiesto trojhodinového behu do
  # prázdna. (Prešovský kraj: pri 2 m ~40 min, pri 1 m ~2 h 40 min.)
  ROCK_BUDGET_MIN: "100"
  ROCK_MAX_RSS_GB: "12" # nad tým sa gdal_contour zastaví s hláškou, nie OOM
  ROCK_HEARTBEAT_S: "30" # ako často hlásiť, že sa stále počíta
  # Rozpočet stránky si joby delia podielom, nie „čo zvýšilo" – bežia
  # súbežne, takže v čase, keď Planetiler rozhoduje o zoome, ešte nikto
  # nevie, aké veľké budú vrstevnice. Podiely sú s rezervou nad namerané
  # hodnoty (vrstevnice 187 MB = 21 %, terén 96 MB = 11 % z 900 MB).
  BUDGET_CONTOURS_PCT: "25"
  BUDGET_TERRAIN_PCT: "12"
  # Značené trasy sú len línie s pár atribútmi – celé Slovensko je jednotky
  # MB. 3 % z rozpočtu je s veľkou rezervou.
  BUDGET_TRAILS_PCT: "3"
  BUDGET_ASSETS_MB: "40"

jobs:

  shading-rocks:
    name: Skaly z tieňovania
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.opt_rock_source == 'tienovanie' && needs.plan.outputs.opt_rock_img_asset == '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/shading-rocks.yml
    with:
      area: ${{ inputs.area }}
      zoom: ${{ needs.plan.outputs.opt_rock_img_zoom }}
      options: ${{ needs.plan.outputs.opt_rock_img_options }}

  # ---------- príprava: región, kľúče, PBF ----------
  # Krátky job, ktorý zistí všetko, čo ostatné potrebujú vedieť, a stiahne
  # PBF. Beží pár minút a všetko ďalšie z neho vychádza.
  plan:
    name: Príprava (región, kľúče, PBF)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read      # kontrola, či je Pages vôbec zapnuté
    outputs:
      key: ${{ steps.region.outputs.key }}
      name: ${{ steps.region.outputs.name }}
      bbox: ${{ steps.region.outputs.bbox }}
      bboxkey: ${{ steps.region.outputs.bboxkey }}
      day: ${{ steps.day.outputs.d }}
      area_key: ${{ steps.area.outputs.key }}
      area_name: ${{ steps.area.outputs.name }}
      area_bbox: ${{ steps.area.outputs.bbox }}
      area_km2: ${{ steps.area.outputs.km2 }}
      # `opt_contours` je brána jobu s vrstevnicami, nie vrstva: vrstevnice
      # aj skaly z neho vychádzajú do jedného .pmtiles, takže beží aj vtedy,
      # keď je zapnuté len jedno z nich. Čo sa naozaj kreslí, hovoria
      # `opt_contour_lines` a `opt_rocks`.
      opt_contours: ${{ steps.opts.outputs.opt_contours }}
      opt_contour_lines: ${{ steps.opts.outputs.opt_contour_lines }}
      opt_terrain: ${{ steps.opts.outputs.opt_terrain }}
      opt_trails: ${{ steps.opts.outputs.opt_trails }}
      # Tri výbery zdroja tak, ako ich rozobrala parse-options.py.
      # `opt_rock_dem` je zdroj skál, LEN keď je to výškový model – pri
      # `tienovanie` a `ziadne` je prázdny, takže nikto nesiahne na DEM.
      opt_contour_source: ${{ steps.opts.outputs.opt_contour_source }}
      opt_rock_source: ${{ steps.opts.outputs.opt_rock_source }}
      opt_rock_dem: ${{ steps.opts.outputs.opt_rock_dem }}
      opt_shading_source: ${{ steps.opts.outputs.opt_shading_source }}
      opt_crop_bbox: ${{ steps.opts.outputs.opt_crop_bbox }}
      opt_size_limit_mb: ${{ steps.opts.outputs.opt_size_limit_mb }}
      opt_auto_shrink: ${{ steps.opts.outputs.opt_auto_shrink }}
      opt_ugkk_fallback: ${{ steps.opts.outputs.opt_ugkk_fallback }}
      opt_ugkk_urls: ${{ steps.opts.outputs.opt_ugkk_urls }}
      opt_contour_interval: ${{ inputs.contour_interval }}
      opt_contour_maxzoom: ${{ steps.opts.outputs.opt_contour_maxzoom }}
      opt_contour_smoothing: ${{ steps.opts.outputs.opt_contour_smoothing }}
      opt_trails_maxzoom: ${{ steps.opts.outputs.opt_trails_maxzoom }}
      opt_terrain_maxzoom: ${{ steps.opts.outputs.opt_terrain_maxzoom }}
      opt_rocks: ${{ steps.opts.outputs.opt_rocks }}
      opt_rock_slope: ${{ inputs.rock_slope }}
      opt_rock_res: ${{ inputs.rock_res }}
      opt_rock_img_asset: ${{ steps.opts.outputs.opt_rock_img_asset }}
      opt_rock_img_zoom: ${{ steps.opts.outputs.opt_rock_img_zoom }}
      opt_rock_img_options: ${{ steps.opts.outputs.opt_rock_img_options }}
      opt_maxzoom: ${{ steps.opts.outputs.opt_maxzoom }}
      opt_custom_pbf_url: ${{ steps.opts.outputs.opt_custom_pbf_url }}
      opt_custom_name: ${{ steps.opts.outputs.opt_custom_name }}
      opt_custom_bbox: ${{ steps.opts.outputs.opt_custom_bbox }}
      opt_contours_rebuild: ${{ steps.opts.outputs.opt_contours_rebuild }}
      opt_rocks_rebuild: ${{ steps.opts.outputs.opt_rocks_rebuild }}
      opt_terrain_rebuild: ${{ steps.opts.outputs.opt_terrain_rebuild }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GITHUB_TOKEN nemá admin práva na vytvorenie Pages site, preto sa
      # Pages musí zapnúť raz ručne: Settings → Pages → Source: GitHub Actions.
      # Kontrola hneď na začiatku, aby build nezlyhal až po konverzii dlaždíc.
      - name: Over, že GitHub Pages je zapnuté
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "::error::GitHub Pages nie je zapnuté. Zapni ho ručne: Settings → Pages → Build and deployment → Source: 'GitHub Actions' a spusti workflow znova."
            exit 1
          fi
          echo "Pages je zapnuté ✓"

      # PBF sa mení denne, tak je v kľúči dátum – v ten istý deň sa už
      # nesťahuje znova (kraj má 36–63 MB, celé Slovensko ~380 MB).
      # `workflow_dispatch` dovolí najviac 10 inputov. Zvyšok príde ako voľné
      # `kľúč=hodnota` v jednom poli a rozloží sa tu – raz, na jednom mieste,
      # aby ostatné joby čítali hotové hodnoty a nie surový reťazec.
      - name: Rozlož voľby
        id: opts
        run: |
          set -euo pipefail
          python3 workers/parse-options.py \
            --options='${{ inputs.options }}' \
            --rebuild='${{ inputs.rebuild }}' \
            --contour-source='${{ inputs.contour_source }}' \
            --rock-source='${{ inputs.rock_source }}' \
            --shading-source='${{ inputs.shading_source }}' \
            --out="$GITHUB_OUTPUT"

      - name: Dnešný dátum do kľúča cache
        id: day
        run: |
          echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          # Meranie krokov: každý dlhý krok si na konci pripíše riadok
          # „poradie, názov, sekundy, čo spravil" do súboru svojho jobu.
          # Joby bežia súbežne, takže sa v súhrne zoradia podľa poradia, nie
          # podľa času – ten by hovoril len o tom, ktorý runner bol rýchlejší.
          mkdir -p steps-out
          : > steps-out/plan.tsv

      # POZOR na restore/save: obyčajné `actions/cache` ukladá až v post-kroku
      # a IBA keď job dobehne úspešne. Keď build spadne o hodinu neskôr, hodiny
      # výpočtu sa zahodia. Preto restore hore a save hneď po tom, čo dáta
      # vzniknú, s `if: always()`.
      - name: Cache PBF regiónu (restore)
        id: pbf-cache
        uses: actions/cache/restore@v4
        with:
          path: data/region.osm.pbf
          key: pbf-${{ inputs.region }}-${{ steps.opts.outputs.opt_custom_pbf_url }}-${{ steps.opts.outputs.opt_crop_bbox }}-${{ steps.day.outputs.d }}

      - name: Stiahni PBF iba daného regiónu
        id: region
        run: |
          T0=$(date +%s)
          mkdir -p data
          CUSTOM_URL='${{ steps.opts.outputs.opt_custom_pbf_url }}'

          # Cache: keď PBF (už aj orezané) leží z predošlého behu, sťahovať ani
          # rezať netreba – kľúč nesie región, orez aj dátum.
          CACHED=""
          if [ -s data/region.osm.pbf ]; then
            CACHED=1
            echo "PBF z cache ✓ ($(du -h data/region.osm.pbf | cut -f1))"
          fi

          download() { # $1 = URL
            [ -n "$CACHED" ] && return 0
            echo "Skúšam: $1"
            curl -fL --retry 3 --retry-delay 5 -o data/region.osm.pbf "$1"
          }

          if [ -n "$CUSTOM_URL" ]; then
            # ----- vlastný región (Európa / svet) -----
            NAME='${{ steps.opts.outputs.opt_custom_name }}'
            [ -n "$NAME" ] || NAME=$(basename "$CUSTOM_URL" .osm.pbf)
            KEY=$(echo "$NAME" | LC_ALL=C.UTF-8 iconv -f utf8 -t ascii//TRANSLIT | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '_' | sed 's/^_//;s/_*$//')
            download "$CUSTOM_URL" || { echo "::error::Nepodarilo sa stiahnuť $CUSTOM_URL"; exit 1; }

            BBOX='${{ steps.opts.outputs.opt_custom_bbox }}'
            if [ -z "$BBOX" ]; then
              sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
              BBOX=$(osmium fileinfo -g header.boxes data/region.osm.pbf | head -1 | tr -d '() ')
            fi
            if [ -z "$BBOX" ]; then
              echo "::error::PBF nemá bbox v hlavičke – vyplň input custom_bbox (west,south,east,north)."
              exit 1
            fi
          else
            # ----- prednastavený región z workers/regions.json -----
            KEY='${{ inputs.region }}'
            NAME=$(jq -r --arg r "$KEY" '.[$r].name' workers/regions.json)
            BBOX=$(jq -r --arg r "$KEY" '.[$r].bbox | join(",")' workers/regions.json)
            DIR=$(jq -r --arg r "$KEY" '.[$r].osmfr.dir' workers/regions.json)
            if [ "$NAME" = "null" ]; then echo "::error::Neznámy región: $KEY"; exit 1; fi

            OK=""
            # osm.fr regionálne exporty (skúšaj kandidátske názvy súborov)
            for SLUG in $(jq -r --arg r "$KEY" '.[$r].osmfr.slugs[]' workers/regions.json); do
              if download "$OSMFR_BASE/$DIR/$SLUG.osm.pbf"; then OK=1; break; fi
            done
            if [ -z "$OK" ]; then
              echo "::error::PBF pre '$KEY' sa nepodarilo stiahnuť. Obsah $OSMFR_BASE/$DIR/ (uprav slugs vo workers/regions.json):"
              curl -sL "$OSMFR_BASE/$DIR/" | grep -oE 'href="[^"]+\.osm\.pbf"' | sort -u || true
              echo "…alebo vyplň custom_pbf_url s priamou URL na .osm.pbf."
              exit 1
            fi
          fi

          # ----- voliteľné orezanie na menšie územie -----
          # Menšie územie = výrazne menší .pmtiles, takže sa dá ísť na maxzoom 16.
          CROP='${{ steps.opts.outputs.opt_crop_bbox }}'
          if [ -n "$CROP" ]; then
            if [ -z "$CACHED" ]; then
              command -v osmium >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool; }
              echo "Orezávam na bbox $CROP …"
              if ! osmium extract --overwrite -b "$CROP" -s smart \
                   -o data/region-crop.osm.pbf data/region.osm.pbf; then
                echo "::error::Orezanie na bbox '$CROP' zlyhalo – očakávaný formát je west,south,east,north (napr. 18.98,49.18,19.20,49.28)."
                exit 1
              fi
              mv data/region-crop.osm.pbf data/region.osm.pbf
            fi
            BBOX="$CROP"
            KEY="${KEY}_crop"
            NAME="$NAME (výrez)"
          fi

          echo "key=$KEY"   >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "bbox=$BBOX" >> "$GITHUB_OUTPUT"
          # bezpečná podoba bboxu do kľúča cache
          echo "bboxkey=$(echo "$BBOX" | tr ',.-' '___')" >> "$GITHUB_OUTPUT"
          echo "Región: $NAME (key=$KEY, bbox=$BBOX)"
          ls -lh data/region.osm.pbf
          printf '%s\t%s\t%s\t%s\n' "10" "PBF regiónu" "$(( $(date +%s) - T0 ))" \
            "$NAME, $(du -h data/region.osm.pbf | cut -f1)$([ -n "$CACHED" ] && echo ' (z cache)')" \
            >> steps-out/plan.tsv

      # Výrez (input `area`) potrebuje vedieť aj kontrola DEM, aj zrkadlo
      # ÚGKK, aj samotný výpočet – preto sa rieši raz, tu, a ide ďalej ako
      # výstup jobu.
      - name: Vyrieš testovací výrez
        id: area
        run: |
          set -euo pipefail
          # Vlastný bbox z options prebije výber pohoria – výber je na
          # bežné použitie, bbox na to, čo v zozname nie je.
          AREA='${{ inputs.area }}'
          AREA_BBOX='${{ steps.opts.outputs.opt_area_bbox }}'
          [ -n "$AREA_BBOX" ] && AREA="$AREA_BBOX"
          # stdout aj do premennej: kľúč výrezu treba hneď na kontrolu nižšie
          # a na vlastné výstupy sa krok odkazovať nemôže.
          RESOLVED=$(python3 workers/resolve-area.py \
            --region-bbox='${{ steps.region.outputs.bbox }}' \
            --area="$AREA" --out="$GITHUB_OUTPUT")
          echo "$RESOLVED"
          AREA_KEY=$(printf '%s\n' "$RESOLVED" | sed -n 's/^key=//p')

          # 1 m model na celý kraj je 16 miliárd buniek (64 GB) – to sa
          # nezmestí ani do releasu, ani do runnera. Povedať to tu je lacné;
          # zistiť to po hodine sťahovania nie. Platí to pre oba výbery, kde
          # sa `ugkk` dá zvoliť (vrstevnice aj skaly); v tieňovaní nie je.
          if [ "$AREA_KEY" = 'cely' ]; then
            for pair in \
              "contour_source:${{ inputs.contour_source }}" \
              "rock_source:${{ inputs.rock_source }}"; do
              if [ "${pair#*:}" = 'ugkk' ]; then
                echo "::error::${pair%%:*}: ugkk je 1 m LiDAR a ten má zmysel len na výrez. Vyplň input „area“ (napr. vysoke_tatry) alebo vyber sonny / dmr35 / dmr5."
                exit 1
              fi
            done
            # To isté pre skaly z tieňovania: sú to hotové dlaždice z cudzieho
            # servera a na celý kraj by ich boli státisíce. Pipeline, ktorú si
            # build volá, preto pozná len pohoria.
            if [ '${{ inputs.rock_source }}' = 'tienovanie' ]; then
              echo "::error::rock_source: tienovanie sťahuje hotové tieňované dlaždice a to má zmysel len na výrez. Vyplň input „area“ (napr. vysoke_tatry), alebo vyber výškový model (sonny / dmr35 / dmr5)."
              exit 1
            fi
          fi

      - name: Cache PBF regiónu (save)
        if: ${{ always() && steps.pbf-cache.outputs.cache-hit != 'true' && hashFiles('data/region.osm.pbf') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/region.osm.pbf
          key: ${{ steps.pbf-cache.outputs.cache-primary-key }}

      # PBF potrebuje už len job s dlaždicami. Ide artefaktom, nie cache:
      # v rámci behu je to isté, cache by sa mohla minúť s iným behom.
      - name: Odlož PBF pre job s dlaždicami
        uses: actions/upload-artifact@v4
        with:
          name: pbf
          path: data/region.osm.pbf
          retention-days: 1
          compression-level: 0

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: steps-plan
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # ---------- kľúče cache ----------
  # Vlastný job, lebo kľúč potrebuje OBOJE: bbox z prípravy a otlačok releasu
  # s DEM z kontroly. A potrebuje ho restore, save aj mazanie pri
  # pregenerovaní – keby bol napísaný trikrát, stačí ho raz zabudnúť opraviť
  # a cache sa ticho rozsype (ukladá sa pod iný kľúč, než sa hľadá).
  keys:
    name: Kľúče cache
    needs: [plan]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write   # mazanie cache pri pregenerovaní
    outputs:
      contours: ${{ steps.keys.outputs.contours }}
      demtiles_contours: ${{ steps.keys.outputs.demtiles_contours }}
      demtiles_terrain: ${{ steps.keys.outputs.demtiles_terrain }}
      terrain: ${{ steps.keys.outputs.terrain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Kľúč potrebuje restore, save aj mazanie pri pregenerovaní. Keby bol
      # napísaný trikrát, stačí ho raz zabudnúť opraviť a cache sa ticho
      # rozsype (uloží sa pod iným kľúčom, než sa hľadá).
      - name: Kľúče cache
        id: keys
        run: |
          set -euo pipefail
          B='${{ needs.plan.outputs.bboxkey }}'
          # Otlačok releasu na vrstvu – každá si vyberá zdroj sama, takže
          # jeden spoločný by po doplnení ktoréhokoľvek releasu zahodil cache
          # všetkých troch.
          DC=''
          DR=''
          DT=''
          CS='${{ needs.plan.outputs.opt_contour_source }}'
          RS='${{ needs.plan.outputs.opt_rock_source }}'
          TS='${{ needs.plan.outputs.opt_shading_source }}'
          {
            # Výrez skál je v kľúči tiež – inak by sa skaly len z Tatier
            # vrátili z cache ako keby to boli skaly celého kraja.
            RA=$(printf '%s' '${{ inputs.area }}' | tr -c 'a-zA-Z0-9' '_')
            # v8: vrstevnice a skaly majú vlastný zdroj, takže sú v kľúči oba
            # (a oba otlačky). Zdroj skál je v ňom aj preto, že `sonny`
            # a `tienovanie` dávajú úplne iné plochy – jedny sa nesmú vrátiť
            # z cache namiesto druhých.
            echo "contours=contours-v8-c$CS$DC-r$RS$DR-$B-i${{ inputs.contour_interval }}-z${{ needs.plan.outputs.opt_contour_maxzoom }}-s${{ needs.plan.outputs.opt_contour_smoothing }}-${{ inputs.rock_slope }}g${{ inputs.rock_res }}a$RA-${{ needs.plan.outputs.opt_rock_img_asset }}-${{ hashFiles('workers/contours.yml', 'workers/rock-areas.py', 'workers/smooth-polygons.py') }}"
            # Stiahnuté DEM dlaždice. Sú v podpriečinku podľa zdroja, takže
            # jeden job môže mať naraz dva modely (vrstevnice z jedného,
            # skaly z druhého) – kľúč preto nesie obe mená.
            echo "demtiles_contours=demtiles-v2-c$CS$DC-r$RS$DR-$B"
            echo "demtiles_terrain=demtiles-v2-t$TS$DT-$B"
            echo "terrain=terrain-v2-$TS-$DT-$B-z${{ needs.plan.outputs.opt_terrain_maxzoom }}"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      # Cache sa v GitHube nedá prepísať – kľúč, ktorý raz existuje, ostane so
      # starým obsahom. Pregenerovanie preto starý záznam najprv zmaže; až
      # potom má zmysel počítať nanovo a uložiť to pod ten istý kľúč.
      - name: Pregenerovanie – zmaž staré cache
        if: ${{ needs.plan.outputs.opt_contours_rebuild || needs.plan.outputs.opt_rocks_rebuild || needs.plan.outputs.opt_terrain_rebuild }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          drop() { # $1 = kľúč cache
            gh cache delete "$1" --repo "$GITHUB_REPOSITORY" \
              && echo "zmazané: $1" \
              || echo "nebolo v cache: $1"
          }
          if [ '${{ needs.plan.outputs.opt_contours_rebuild }}' = 'true' ] || [ '${{ needs.plan.outputs.opt_rocks_rebuild }}' = 'true' ]; then
            drop '${{ steps.keys.outputs.contours }}'
          fi
          if [ '${{ needs.plan.outputs.opt_terrain_rebuild }}' = 'true' ]; then
            drop '${{ steps.keys.outputs.terrain }}'
          fi

  # ---------- vrstevnice a skaly ----------
  # Najdlhší job (skaly sú desiatky minút). Vlastný job znamená vlastný
  # timeout a hlavne: keď spadne, mapa, tieňovanie ani ikonky sa nezahodia.
  contours:
    name: Vrstevnice a skaly
    # `shading-rocks` je v needs kvôli poradiu, nie kvôli dátam: keď skaly
    # idú z tieňovania, musí byť asset v release skôr, než si ho tento job
    # vypýta. Pri inom zdroji je ten job preskočený a `!cancelled()` sa
    # o preskočenú závislosť nezastaví.
    needs: [plan, keys, shading-rocks]
    if: ${{ !cancelled() && needs.plan.outputs.opt_contours == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write   # ukladanie hotových skál do releasu dem-rocks
    outputs:
      enabled: ${{ steps.contours.outputs.enabled }}
      maxzoom: ${{ steps.contours.outputs.maxzoom }}
      dem_source: ${{ steps.contours.outputs.dem_source }}
      rock_slope: ${{ steps.contours.outputs.rock_slope }}
      rock_source: ${{ steps.contours.outputs.rock_source }}
      size_mb: ${{ steps.contours.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Meranie krokov musí byť v pracovnom priečinku – `hashFiles` inam
      # nevidí, takže by sa artefakt nikdy neodložil.
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out


      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Planetileru (restore)
        id: planetiler-cache
        uses: actions/cache/restore@v4
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ needs.plan.outputs.day }}

      - name: Stiahni Planetiler
        run: |
          [ -s planetiler.jar ] && { echo "Planetiler z cache ✓"; exit 0; }
          curl -fL --retry 4 --retry-delay 5 -o planetiler.jar \
            https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar

      # ---------- kľúče cache ----------
  # ---------- vrstevnice a skaly ----------
      # OSM výškový model neobsahuje (má len bodový tag `ele`), takže terén
      # ide z externého DEM: **Sonny's LiDAR DTM** z releasu `dem-sonny`
      # (napĺňa ho workflow "Update DEM"). Je to LiDAR *model terénu*, teda
      # bez stromov a striech.
      #
      # Copernicus GLO-30 ako záloha je zámerne VYPNUTÝ. Je to model povrchu:
      # vrstevnice by v lese viedli po korunách stromov a skaly by vychádzali
      # z vegetácie. Miešať to s LiDARom v jednej mape znamená, že polovica
      # mapy klame a nikde nie je vidieť, ktorá. Keď dlaždica chýba, build
      # radšej zlyhá s hláškou. (Späť sa dá zapnúť tým, že sa sem vráti
      # sťahovanie z copernicus-dem-30m.s3.amazonaws.com – viď história.)
      #
      # Z toho istého DEM vznikajú aj skalné plochy – husté vrstevnice sú len
      # obraz veľkého sklonu, takže sa počítajú priamo zo sklonu terénu.
      #
      # Robia sa PRED dlaždicami zámerne: obe idú na tú istú stránku a musia
      # sa zmestiť do jedného rozpočtu. Keď sa vrstevnice urobia prvé, vie
      # Planetiler dostať presne toľko miesta, koľko naozaj zvýšilo – inak by
      # sa build po hodine tilovania zabil na tom, že súčet je nad limitom.
      #
      # Pri pregenerovaní (`contours_rebuild` / `rocks_rebuild`) sa restore
      # preskočí, takže krok nižšie beží aj vtedy, keď cache existuje. Starý
      # záznam už zmazal krok „Pregenerovanie", nech sa dá uložiť nový.
      - name: Cache vrstevníc a skál (restore)
        id: contours-cache
        if: ${{ needs.plan.outputs.opt_contours == 'true' && !needs.plan.outputs.opt_contours_rebuild && !needs.plan.outputs.opt_rocks_rebuild }}
        uses: actions/cache/restore@v4
        with:
          path: contours-out
          key: ${{ needs.keys.outputs.contours }}

      # DEM dlaždice sú desiatky MB na kus a menia sa len vtedy, keď sa zmení
      # release – čo je presne to, čo hovorí `demkey`. Tie sa nepregenerúvajú
      # nikdy: sú to stiahnuté dáta, nie výpočet.
      #
      # Cachuje sa celý `dem/`, lebo v ňom môžu byť dva modely naraz
      # (`dem/sonny/tiles`, `dem/dmr5/tiles`) – vrstevnice a skaly majú
      # vlastný zdroj. Medzivýsledky (orez, izolínie) idú preto do `work/`
      # a nie sem, nech sa do cache nedostane niekoľkogigabajtový `clip.tif`.
      - name: Cache DEM dlaždíc (restore)
        id: demtiles-cache
        if: ${{ needs.plan.outputs.opt_contours == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: dem
          key: ${{ needs.keys.outputs.demtiles_contours }}

      - name: Vrstevnice a skaly z DEM
        if: ${{ needs.plan.outputs.opt_contours == 'true' && steps.contours-cache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin libsqlite3-mod-spatialite zstd
          python3 -m pip install --quiet numpy
          # `work/` sú medzivýsledky (orez, surové izolínie) – zámerne mimo
          # `dem/`, ktoré ide celé do cache. `clip.tif` má aj gigabajty.
          mkdir -p dem data work contours-out

          BBOX='${{ needs.plan.outputs.bbox }}'
          IFS=, read -r W S E N <<< "$BBOX"
          INTERVAL='${{ inputs.contour_interval }}'
          case "$INTERVAL" in ''|*[!0-9]*) INTERVAL=10 ;; esac

          # ---------- výrez na testovanie ----------
          # Vyriešila ho príprava (workers/resolve-area.py), tu sa už len
          # preberá – aby check-dem, zrkadlo ÚGKK aj tento výpočet pracovali
          # s tým istým územím a nie s tromi mierne odlišnými.
          AREA_KEY='${{ needs.plan.outputs.area_key }}'
          AREA_NAME='${{ needs.plan.outputs.area_name }}'
          AREA_BBOX='${{ needs.plan.outputs.area_bbox }}'
          if [ "$AREA_KEY" != "cely" ]; then
            echo "::warning::Vrstevnice AJ skaly sa počítajú LEN na výreze „$AREA_NAME“ ($AREA_BBOX, ${{ needs.plan.outputs.area_km2 }} km²). Vo zvyšku regiónu nebude v mape ani jedno – toto je beh na testovanie, nie na nasadenie. Pre celý región nechaj input „area“ prázdny."
            # Vrstevnice sa ďalej trasujú z výrezu, nie z celého regiónu.
            IFS=, read -r W S E N <<< "$AREA_BBOX"
          fi

          # ---------- výškové modely ----------
          # Sťahovanie DEM je v samostatnom skripte – potrebuje ho aj job
          # s tieňovaním a dve kópie by časom zaostali jedna za druhou.
          #
          # Vrstevnice a skaly majú vlastný výber zdroja, takže tu môžu byť
          # naraz DVA modely. Každý ide do `dem/<zdroj>/`; keď je zdroj ten
          # istý, druhé volanie nájde hotovú mozaiku a nesťahuje nič.
          #
          # Dlaždicové modely sa sťahujú pre CELÝ región: sú v cache pod
          # kľúčom regiónu, takže čiastočné stiahnutie by sa nabudúce vrátilo
          # ako keby bolo úplné. ÚGKK sa naopak pýta po výrezoch a pri 1 m je
          # celý kraj mimo možností – tam ide len výrez.
          AREA_KEY_IN='${{ needs.plan.outputs.area_key }}'

          fetch_dem() { # $1 = zdroj → DEM_VRT, DEM_GOT (čo sa NAOZAJ použilo)
            local src="$1" fbbox rc
            if [ -s "dem/$src/all.vrt" ]; then
              DEM_VRT="dem/$src/all.vrt"; DEM_GOT="$src"
              echo "DEM $src: mozaika už je ✓"
              return 0
            fi
            if [ "$src" = 'ugkk' ]; then fbbox="$AREA_BBOX"; else fbbox="$BBOX"; fi
            set +e
            workers/fetch-dem.sh "$fbbox" "dem/$src" steps-out/contours.tsv \
              "$src" "$AREA_KEY_IN"
            rc=$?
            set -e
            if [ "$rc" -eq 3 ]; then
              # ÚGKK nemáme. Buď to zhodíme, alebo dopočítame zo Sonnyho –
              # ale nikdy ticho: `dem-source.txt` nesie, čo sa NAOZAJ použilo,
              # takže atribúcia v mape nebude tvrdiť ÚGKK tam, kde je Sonny.
              if [ '${{ needs.plan.outputs.opt_ugkk_fallback }}' != 'true' ]; then
                echo "::error::1 m LiDAR od ÚGKK nie je k dispozícii a ugkk_fallback je vypnutý. Zapni ho, alebo vyber sonny / dmr35 / dmr5."
                exit 1
              fi
              echo "::warning::1 m LiDAR od ÚGKK nie je k dispozícii – počíta sa zo Sonnyho (20 m). Mapa bude, len s hrubším modelom. Ako ÚGKK doplniť, hovorí log jobu 'Doplniť výškový model (ugkk)'."
              fetch_dem sonny
              return 0
            elif [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
            DEM_VRT="dem/$src/all.vrt"; DEM_GOT="$src"
          }

          # ---------- čo sa vlastne ide počítať ----------
          # Bez tohto je z logu vidieť len „Vrstevnice a skaly z DEM" a potom
          # desiatky minút ticha. Rozmer rastra a počet buniek povedia, či
          # ide o minúty alebo o hodinu, a to ešte pred prvým gdalwarpom.
          dem_info() { # $1 = popis, $2 = mozaika
            echo "── Vstupný DEM: $1 ──────────────────────────────"
            gdalinfo "$2" 2>/dev/null \
              | grep -E "^Size is|^Pixel Size|^Upper Left|^Lower Right" || true
            python3 - "$W" "$S" "$E" "$N" "$2" <<'PY'
          import json, math, subprocess, sys
          w, s, e, n = map(float, sys.argv[1:5])
          try:
              info = json.loads(subprocess.run(
                  ["gdalinfo", "-json", sys.argv[5]],
                  capture_output=True, text=True, check=True).stdout)
              gt = info["geoTransform"]
              dx, dy = abs(gt[1]), abs(gt[5])
              cells = ((e - w) / dx) * ((n - s) / dy)
              lat = (s + n) / 2
              print(f"  výrez        {e-w:.3f}° × {n-s:.3f}°  "
                    f"(~{(e-w)*111.32*math.cos(math.radians(lat)):.0f} × "
                    f"{(n-s)*110.54:.0f} km)")
              print(f"  bunka DEM    {dx*111320*math.cos(math.radians(lat)):.0f} × "
                    f"{dy*110540:.0f} m")
              print(f"  buniek       {cells/1e6:.1f} mil.")
          except Exception as exc:
              print(f"  (rozmer sa nedá zistiť: {exc})")
          PY
            echo "─────────────────────────────────────────────────────"
          }

          # Zdroje z formulára. `opt_rock_dem` je prázdny, keď skaly idú
          # z tieňovania alebo sú vypnuté – vtedy sa na DEM kvôli nim nesiaha.
          CONTOUR_SRC='${{ needs.plan.outputs.opt_contour_source }}'
          ROCK_DEM='${{ needs.plan.outputs.opt_rock_dem }}'
          CONTOUR_VRT=""; CONTOUR_DEM=""
          ROCK_VRT=""; ROCK_DEM_USED=""

          if [ '${{ needs.plan.outputs.opt_contour_lines }}' = 'true' ]; then
            fetch_dem "$CONTOUR_SRC"
            CONTOUR_VRT="$DEM_VRT"; CONTOUR_DEM="$DEM_GOT"
            dem_info "vrstevnice ($CONTOUR_DEM)" "$CONTOUR_VRT"
          fi
          if [ -n "$ROCK_DEM" ]; then
            fetch_dem "$ROCK_DEM"
            ROCK_VRT="$DEM_VRT"; ROCK_DEM_USED="$DEM_GOT"
            [ "$ROCK_VRT" = "$CONTOUR_VRT" ] \
              || dem_info "skaly ($ROCK_DEM_USED)" "$ROCK_VRT"
          fi

          # Zjemnenie DEM pred trasovaním vrstevníc. Priemerovanie na hrubšiu
          # mriežku vyhladí šum, ale zároveň zje detail terénu. Default 0 =
          # žiadne zjemnenie, len orez na bbox v plnom rozlíšení.
          T_CONT=$(date +%s)

          make_empty_gpkg() { # $1 = súbor, $2 = vrstva, $3 = typ geometrie
            # Schéma odkazuje na obe vrstvy vždy, takže súbor musí existovať
            # aj vtedy, keď je vrstva vypnutá alebo sa nič nenašlo.
            echo '{"type":"FeatureCollection","features":[]}' > work/empty.geojson
            ogr2ogr -f GPKG "$1" work/empty.geojson -nln "$2" -overwrite \
              -nlt "$3" -a_srs EPSG:4326 -lco GEOMETRY_NAME=geom
          }

          if [ '${{ needs.plan.outputs.opt_contour_lines }}' != 'true' ]; then
            echo "Vrstevnice: vypnuté (contour_source: ziadne) – prázdna vrstva."
            make_empty_gpkg data/contours.gpkg contours LINESTRING
          else
            SMOOTH='${{ needs.plan.outputs.opt_contour_smoothing }}'
            case "$SMOOTH" in ''|*[!0-9.]*) SMOOTH=0 ;; esac
            if [ "${SMOOTH%%.*}" -gt 0 ] 2>/dev/null; then
              RES=$(python3 -c "print(f'{$SMOOTH / 3600:.8f}')")
              echo "Zjemnenie DEM: ${SMOOTH}″ (mriežka $RES°)"
              python3 workers/watch.py --label="orez DEM" --watch-file=work/clip.tif \
                -- gdalwarp -overwrite -te "$W" "$S" "$E" "$N" \
                   -tr "$RES" "$RES" -r average "$CONTOUR_VRT" work/clip.tif
            else
              echo "Zjemnenie DEM: vypnuté – vrstevnice sa trasujú z plného rozlíšenia."
              python3 workers/watch.py --label="orez DEM" --watch-file=work/clip.tif \
                -- gdalwarp -overwrite -te "$W" "$S" "$E" "$N" "$CONTOUR_VRT" work/clip.tif
            fi

            # `-q` je preč a ide to cez watch.py: gdal_contour nad krajom beží
            # desiatky minút a doteraz pri tom nepovedal ani slovo.
            python3 workers/watch.py --label="vrstevnice" --watch-file=work/raw.gpkg \
              -- gdal_contour -a ele -i "$INTERVAL" -f GPKG -nln contours \
                 work/clip.tif work/raw.gpkg

            # `level` rozdelí vrstevnice na hlavné/polovičné/základné, aby sa
            # dali zapínať podľa zoomu a kresliť rôzne hrubo. Hranice sa počítajú
            # z intervalu, nie natvrdo zo 100/50 – pri interval=5 by inak bola
            # zvýraznená každá dvadsiata čiara namiesto každej desiatej a pri
            # interval=25 by sa `mid` netrafilo nikdy. Zvýrazňuje sa každá
            # desiata (major) a každá piata (mid) vrstevnica, čo je pri
            # štandardných 10 m presne doterajších 100 a 50 m.
            MAJOR=$(( INTERVAL * 10 ))
            MID=$(( INTERVAL * 5 ))
            echo "Vrstevnice: interval ${INTERVAL} m z modelu $CONTOUR_DEM, zvýraznená každá ${MAJOR} m (major) a ${MID} m (mid)"
            python3 workers/watch.py --label="triedenie vrstevníc" \
              --watch-file=data/contours.gpkg \
              -- ogr2ogr -f GPKG data/contours.gpkg work/raw.gpkg -nln contours \
              -dialect SQLITE -sql "SELECT *, CASE
                   WHEN CAST(ele AS INTEGER) % $MAJOR = 0 THEN 'major'
                   WHEN CAST(ele AS INTEGER) % $MID  = 0 THEN 'mid'
                   ELSE 'minor' END AS level
                 FROM contours WHERE ele IS NOT NULL"
            ls -lh data/contours.gpkg
            printf '%s\t%s\t%s\t%s\n' "30" "Vrstevnice (gdal_contour)" "$(( $(date +%s) - T_CONT ))" \
              "interval ${INTERVAL} m z $CONTOUR_DEM, $(du -h data/contours.gpkg | cut -f1)" \
              >> steps-out/contours.tsv
          fi

          # ---------- skaly: najstrmšie úseky terénu ----------
          # Celý výpočet je vo workers/rock-areas.py – po častiach, aby sa
          # jemná mriežka zmestila do pamäte aj na disk. Bbox kraja má pri
          # 2 m vyše 3 miliardy buniek (~13 GB na jeden raster), takže naraz
          # sa to spočítať nedá.
          T_ROCK=$(date +%s)
          ROCK_SLOPE='${{ inputs.rock_slope }}'
          case "$ROCK_SLOPE" in ''|*[!0-9]*) ROCK_SLOPE=50 ;; esac
          ROCK_CLIFF=$(( ROCK_SLOPE + ROCK_CLIFF_PLUS ))
          # `auto` = mriežku vyberie rock-areas.py: najjemnejšiu, ktorá sa
          # zmestí do rozpočtu času a má pri danom DEM ešte zmysel. Nedá sa
          # to spočítať tu, lebo to závisí od plochy výrezu aj od bunky DEM.
          RR='${{ inputs.rock_res }}'
          case "$RR" in
            auto|'') RR=auto ;;
            *[!0-9.]*) RR="$ROCK_RES" ;;
          esac
          # Najmenšiu skalu (= jedna bunka mriežky) dopočíta rock-areas.py,
          # lebo pri `auto` sa mriežka vyberá až tam.

          make_empty_rock() { make_empty_gpkg data/rock.gpkg rock POLYGON; }

          if [ '${{ needs.plan.outputs.opt_rocks }}' = 'true' ]; then
            ROCK_READY=""
            ROCK_SRC="výpočet"

            # ---------- skaly z tieňovaných dlaždíc (rock_source: tienovanie) ----------
            # Tie sa v TOMTO jobe nepočítajú – spravil to job `shading-rocks`
            # o kus vyššie v tom istom behu (stiahol tieňované dlaždice
            # z freemap.sk, odložil ich ako artefakt a hotové polygóny nahral
            # do releasu). Tu sa už len stiahne výsledok. Keď je vyplnený
            # `rock_img_asset`, ten job nebežal a berie sa presne ten asset.
            if [ '${{ needs.plan.outputs.opt_rock_source }}' = 'tienovanie' ]; then
              IMG_ASSET='${{ needs.plan.outputs.opt_rock_img_asset }}'
              echo "::group::Skaly z tieňovania – $AREA_NAME, release $ROCK_IMG_RELEASE"
              if [ -z "$IMG_ASSET" ]; then
                # Najnovší asset pre tento výrez. Zoradiť sa musí podľa času
                # nahratia, nie podľa mena: v mene sú prahy, takže abecedne
                # by vyhral ten s najväčším číslom, nie ten posledný.
                # `env.PREFIX`, lebo `gh --jq` nevie `--arg`.
                export PREFIX="rockimg-${AREA_KEY}-"
                IMG_ASSET=$(gh release view "$ROCK_IMG_RELEASE" \
                  --repo "$GITHUB_REPOSITORY" --json assets \
                  --jq '[.assets[] | select(.name | startswith(env.PREFIX))
                         | select(.name | endswith(".gpkg.zst"))]
                        | sort_by(.createdAt) | last | .name // ""' \
                  2>/dev/null || true)
              fi
              if [ -z "$IMG_ASSET" ]; then
                echo "::endgroup::"
                echo "::error::V release $ROCK_IMG_RELEASE nie je pre výrez '$AREA_KEY' žiadny asset (rockimg-${AREA_KEY}-*.gpkg.zst). Pozri job „Skaly z tieňovania\" v tomto behu – ten ich mal vyrobiť; keď spadol, hovorí prečo. Alebo vo výbere rock_source zvoľ výškový model (sonny / dmr35 / dmr5 / ugkk)."
                exit 1
              fi
              rm -rf /tmp/rockimg && mkdir -p /tmp/rockimg
              if ! gh release download "$ROCK_IMG_RELEASE" --repo "$GITHUB_REPOSITORY" \
                     --pattern "$IMG_ASSET" --dir /tmp/rockimg --clobber; then
                echo "::endgroup::"
                echo "::error::Asset $IMG_ASSET sa z releasu $ROCK_IMG_RELEASE nedal stiahnuť."
                exit 1
              fi
              echo "  beriem: $IMG_ASSET ($(du -h "/tmp/rockimg/$IMG_ASSET" | cut -f1))"
              unzstd -q -f -o data/rock.gpkg "/tmp/rockimg/$IMG_ASSET"
              ROCK_READY=1
              ROCK_SRC="release $ROCK_IMG_RELEASE ($IMG_ASSET)"
              # Výrez sa tu NEOREZÁVA na bbox regiónu zámerne: asset vznikol
              # presne pre tento výrez a orezanie by len prerezalo polygóny
              # na hranici. Keby výrez presahoval región, dlaždice mimo neho
              # aj tak nikto nevykreslí.
              echo "::endgroup::"
            fi

            # Hotové skaly pre tento región a tieto nastavenia sú v release –
            # nastavenia sú v mene assetu, takže sa nikdy nepomiešajú. Výpočet
            # je na desiatky minút, stiahnutie na sekundy. `rocks_rebuild` ten
            # asset zahodí a počíta odznova.
            # Výrez je v mene assetu: skaly len z Tatier sa nesmú nabudúce
            # vydávať za skaly celého kraja.
            ROCK_ASSET="rock-${{ needs.plan.outputs.key }}-${AREA_KEY}-${ROCK_DEM_USED:-none}-s${ROCK_SLOPE}-g${RR}-${ROCK_ALGO}.gpkg.zst"
            if [ -n "$ROCK_READY" ]; then
              : # skaly už sú (z tieňovania) – DEM sa na ne vôbec nečíta
            elif [ '${{ needs.plan.outputs.opt_rocks_rebuild }}' = 'true' ]; then
              echo "rocks_rebuild=áno – zahadzujem uloženú verziu a počítam nanovo."
              gh release delete-asset "$ROCK_RELEASE" "$ROCK_ASSET" \
                --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 \
                && echo "  zmazané z releasu: $ROCK_ASSET" || true
            elif gh release download "$ROCK_RELEASE" --repo "$GITHUB_REPOSITORY" \
                   --pattern "$ROCK_ASSET" --dir /tmp --clobber >/dev/null 2>&1; then
              unzstd -q -f -o data/rock.gpkg "/tmp/$ROCK_ASSET" && ROCK_READY=1
              [ -n "$ROCK_READY" ] && ROCK_SRC="release $ROCK_RELEASE" \
                && echo "Skaly z releasu $ROCK_RELEASE ✓ ($ROCK_ASSET)"
            fi

            if [ -z "$ROCK_READY" ]; then
              echo "::group::Skaly z modelu $ROCK_DEM_USED – $AREA_NAME, sklon ≥ ${ROCK_SLOPE}° (steny od ${ROCK_CLIFF}°), mriežka ${RR}, zaoblenie ${ROCK_SMOOTH}×"
              # Skaly sú bonus nad vrstevnicami: keby ich výpočet zlyhal (alebo
              # v rovine nič nenašiel), nemá to zhodiť hodinový build.
              # Exit 2 = „toto sa nedá spočítať" (plán nad stropom alebo
              # pamäť). To nie je bonus, ktorý sa dá preskočiť – je to zlé
              # zadanie a build sa má zastaviť hneď, nie nasadiť mapu bez
              # skál po hodine práce. Iný nenulový kód je skutočné zlyhanie
              # výpočtu a tam prázdna vrstva stačí.
              set +e
              python3 workers/rock-areas.py --dem="$ROCK_VRT" --bbox="$AREA_BBOX" \
                --res="$RR" --slope="$ROCK_SLOPE" --cliff="$ROCK_CLIFF" \
                --min-area=-1 --simplify="$ROCK_SIMPLIFY" \
                --smooth="$ROCK_SMOOTH" \
                --stats=contours-out/rock-stats.txt \
                --chunk-cells="$ROCK_CHUNK_CELLS" --budget-min="$ROCK_BUDGET_MIN" \
                --max-rss-gb="$ROCK_MAX_RSS_GB" --heartbeat="$ROCK_HEARTBEAT_S" \
                --out=data/rock.gpkg
              RC=$?
              set -e
              if [ "$RC" -eq 2 ]; then
                echo "::endgroup::"
                echo "::error::Výpočet skál sa nezačal – zadanie je nad možnosti runnera (viď hlášky vyššie). Uprav rock_res alebo area a spusti znova."
                exit 1
              fi
              if [ "$RC" -eq 0 ]; then
                ls -lh data/rock.gpkg
                # Ulož ich, nech ich nabudúce netreba počítať znova.
                zstd -q -19 -T0 -f -o "/tmp/$ROCK_ASSET" data/rock.gpkg
                gh release view "$ROCK_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
                  gh release create "$ROCK_RELEASE" --repo "$GITHUB_REPOSITORY" \
                    --title "Skalné plochy z DEM" \
                    --notes "Vektorové skaly počítané zo sklonu výškového modelu. Meno assetu nesie región, výrez, model a nastavenia (prah sklonu, mriežka obrysu)." || true
                gh release upload "$ROCK_RELEASE" "/tmp/$ROCK_ASSET" \
                  --repo "$GITHUB_REPOSITORY" --clobber \
                  && echo "Uložené do releasu $ROCK_RELEASE ako $ROCK_ASSET" \
                  || echo "::warning::Skaly sa nepodarilo uložiť do releasu."
              else
                echo "::warning::Skalné plochy sa nevygenerovali – vrstva bude prázdna."
                make_empty_rock
              fi
              echo "::endgroup::"
            fi

            # Štatistika ide do contours-out, takže ju nesie aj cache – pri
            # cache hite sa tento krok vôbec nespustí, ale súhrn čísla má.
            ROCK_N=$(ogrinfo -so data/rock.gpkg rock 2>/dev/null \
              | awk -F': ' '/^Feature Count/ {print $2}')
            # Skaly z tieňovania nemajú ani sklon, ani mriežku – písať ich do
            # merania by bolo číslo, ktoré nikde nevzniklo.
            if [ '${{ needs.plan.outputs.opt_rock_source }}' = 'tienovanie' ]; then
              ROCK_HOW="tmavé plochy v tieňovaní"
            else
              ROCK_HOW="$ROCK_DEM_USED, sklon ≥ ${ROCK_SLOPE}°, mriežka ${RR} m"
            fi
            printf '%s\t%s\t%s\t%s\n' "40" "Skalné plochy" "$(( $(date +%s) - T_ROCK ))" \
              "${ROCK_N:-0} plôch, $AREA_NAME, ${ROCK_HOW} ($ROCK_SRC)" \
              >> steps-out/contours.tsv
            # Keď skaly prišli z releasu, script nebežal a štatistiku nemá kto
            # napísať – aspoň to základné, nech súhrn nie je plný otáznikov.
            if [ ! -s contours-out/rock-stats.txt ]; then
              # `min_area_m2` sa tu nedopĺňa: dopočítava ho rock-areas.py
              # z vybranej mriežky a ten práve nebežal. Súhrn si s chýbajúcou
              # hodnotou poradí (`${min_area_m2:-?}`) – dosadiť sem premennú,
              # ktorá nikde nevzniká, by pri `set -u` zhodilo celý build.
              if [ '${{ needs.plan.outputs.opt_rock_source }}' = 'tienovanie' ]; then
                # Skaly z tieňovania sú z iného sveta – ani sklon, ani mriežka
                # pre ne neexistujú. Súhrn podľa `source` vypíše inú tabuľku.
                { echo "source=tienovanie"; echo "count=${ROCK_N:-0}"
                  printf "asset='%s'\n" "$ROCK_SRC"
                } > contours-out/rock-stats.txt
              else
                { echo "source=dem"; echo "count=${ROCK_N:-0}"; echo "grid_m=$RR"
                  echo "slope_deg=$ROCK_SLOPE"; echo "cliff_deg=$ROCK_CLIFF"
                } > contours-out/rock-stats.txt
              fi
            fi
            # Z ktorého modelu sú skaly – do súhrnu. Pri `tienovanie` je
            # prázdny, lebo tam žiadny výškový model nefiguruje.
            printf "rock_dem='%s'\n" "$ROCK_DEM_USED" >> contours-out/rock-stats.txt
            # Výrez do štatistiky, nech je v súhrne vidieť, že skaly nie sú
            # všade – aj keď sa tento krok nabudúce vezme z cache.
            # Hodnoty v apostrofoch: súhrn si súbor načíta cez `.` a meno
            # výrezu má medzeru („celý región").
            { printf "area_key='%s'\n" "$AREA_KEY"
              printf "area_name='%s'\n" "$AREA_NAME"
              printf "area_bbox='%s'\n" "$AREA_BBOX"; } >> contours-out/rock-stats.txt
          else
            make_empty_rock
            echo "Skaly: vypnuté (prázdna vrstva)."
          fi

          CZ='${{ needs.plan.outputs.opt_contour_maxzoom }}'
          case "$CZ" in ''|*[!0-9]*) CZ=14 ;; esac
          if [ "$CZ" -gt 16 ]; then CZ=16; fi

          # Vrstevnice a mapa idú na tú istú stránku, takže si rozpočet delia.
          # Viac než ~40 % naň nesmú zobrať, inak by na mapu ostalo tak málo,
          # že by sa musela orezať o niekoľko zoomov. Prepočet z hotového GPKG
          # je lacný (sekundy), na rozdiel od sťahovania DEM.
          LIMIT_MB='${{ needs.plan.outputs.opt_size_limit_mb }}'
          case "$LIMIT_MB" in ''|*[!0-9]*) LIMIT_MB=900 ;; esac
          CBUDGET_MB=$(( LIMIT_MB * BUDGET_CONTOURS_PCT / 100 ))

          T_PM=$(date +%s)
          while : ; do
            java -Xmx5g -jar planetiler.jar generate-custom \
              --schema=workers/contours.yml \
              --output=contours-out/contours.pmtiles \
              --maxzoom="$CZ" --render_maxzoom="$CZ" \
              --simplify_tolerance_at_max_zoom=0 \
              --min_feature_size_at_max_zoom=0 \
              --force

            CMB=$(( $(stat -c%s contours-out/contours.pmtiles) / 1048576 ))
            echo "Vrstevnice maxzoom $CZ → ${CMB} MB (strop ${CBUDGET_MB} MB)"
            [ "$CMB" -le "$CBUDGET_MB" ] && break

            if [ "$CZ" -le 10 ]; then
              echo "::warning::Vrstevnice majú ${CMB} MB ani pri maxzoome 10 – zvýš contour_interval (napr. 20 m) alebo ich pre toto územie vypni."
              break
            fi
            CZ=$(( CZ - 1 ))
            echo "::warning::Vrstevnice sú nad stropom ${CBUDGET_MB} MB – skúšam maxzoom ${CZ}."
          done

          # Skutočne použitý maxzoom si odloží aj cache, nech štýl vie, po
          # ktorý zoom vrstevnice naozaj existujú. To isté platí pre zdroj
          # výšok (ide do atribúcie mapy) a prah sklonu skál (do manifestu).
          echo "$CZ" > contours-out/maxzoom.txt
          # Do atribúcie ide model, z ktorého sú vrstevnice; keď sú vypnuté,
          # ten, z ktorého sú skaly – v tej vrstve je aj tak len jedno z nich.
          echo "${CONTOUR_DEM:-${ROCK_DEM_USED:-}}" > contours-out/dem-source.txt
          # Prah sklonu má zmysel len pri skalách z DEM. Pri `tienovanie` žiadny
          # sklon neexistuje, takže do manifestu ide `off` a namiesto neho
          # sa tam píše zdroj skál.
          if [ '${{ needs.plan.outputs.opt_rocks }}' = 'true' ] \
             && [ '${{ needs.plan.outputs.opt_rock_source }}' != 'tienovanie' ]; then
            echo "$ROCK_SLOPE" > contours-out/rock-slope.txt
          else
            echo "off" > contours-out/rock-slope.txt
          fi
          if [ '${{ needs.plan.outputs.opt_rocks }}' = 'true' ]; then
            echo '${{ needs.plan.outputs.opt_rock_source }}' > contours-out/rock-source.txt
          else
            echo "off" > contours-out/rock-source.txt
          fi
          ls -lh contours-out/
          printf '%s\t%s\t%s\t%s\n' "50" "Vrstevnice a skaly → PMTiles" "$(( $(date +%s) - T_PM ))" \
            "maxzoom $CZ, $(du -h contours-out/contours.pmtiles | cut -f1)" \
            >> steps-out/contours.tsv

      # Uloží sa hneď, ako vrstevnice a skaly existujú – aj keď by build ďalej
      # spadol, hodiny výpočtu ostanú v cache.
      - name: Cache vrstevníc a skál (save)
        if: ${{ always() && needs.plan.outputs.opt_contours == 'true' && steps.contours-cache.outputs.cache-hit != 'true' && hashFiles('contours-out/**') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: contours-out
          key: ${{ needs.keys.outputs.contours }}

      - name: Cache DEM dlaždíc (save)
        if: ${{ always() && needs.plan.outputs.opt_contours == 'true' && steps.demtiles-cache.outputs.cache-hit != 'true' && hashFiles('dem/**') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: dem
          key: ${{ needs.keys.outputs.demtiles_contours }}

      - name: Zaraď vrstevnice do webu
        id: contours
        if: ${{ needs.plan.outputs.opt_contours == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p _site/tiles
          SRC=contours-out/contours.pmtiles
          if [ ! -s "$SRC" ]; then
            echo "::warning::Vrstevnice sa nevygenerovali – mapa pôjde bez nich."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp "$SRC" "_site/tiles/${{ needs.plan.outputs.key }}-contours.pmtiles"
          # Maxzoom berieme z toho, čo sa naozaj vygenerovalo (mohol sa znížiť
          # kvôli veľkosti); ak súbor chýba, padáme späť na vstup.
          CZ=$(cat contours-out/maxzoom.txt 2>/dev/null || echo '')
          case "$CZ" in ''|*[!0-9]*) CZ='${{ needs.plan.outputs.opt_contour_maxzoom }}' ;; esac
          case "$CZ" in ''|*[!0-9]*) CZ=14 ;; esac
          if [ "$CZ" -gt 16 ]; then CZ=16; fi
          # Zdroj výšok a prah sklonu skál si nesie cache spolu s dlaždicami –
          # pri cache hite sa krok s DEM vôbec nespustí.
          DEM_USED=$(cat contours-out/dem-source.txt 2>/dev/null || echo '')
          # Kľúče musia sedieť s workers/dem-sources.json – čo tu neprejde,
          # spadne na Sonnyho a mapa by potom v atribúcii tvrdila iný model,
          # než z ktorého naozaj je. (`dmr35` a `dmr5` tu kedysi chýbali.)
          case "$DEM_USED" in sonny|dmr35|dmr5|ugkk) ;; *) DEM_USED=sonny ;; esac
          RSLOPE=$(cat contours-out/rock-slope.txt 2>/dev/null || echo off)
          RSRC=$(cat contours-out/rock-source.txt 2>/dev/null || echo off)
          case "$RSRC" in sonny|dmr35|dmr5|ugkk|tienovanie) ;; *) RSRC=off ;; esac
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "maxzoom=$CZ" >> "$GITHUB_OUTPUT"
          echo "dem_source=$DEM_USED" >> "$GITHUB_OUTPUT"
          echo "rock_slope=$RSLOPE" >> "$GITHUB_OUTPUT"
          echo "rock_source=$RSRC" >> "$GITHUB_OUTPUT"
          echo "size_mb=$(( $(stat -c%s "$SRC") / 1048576 ))" >> "$GITHUB_OUTPUT"
          echo "Vrstevnice do z$CZ, výšky: $DEM_USED, skaly: $RSLOPE"
          ls -lh "_site/tiles/${{ needs.plan.outputs.key }}-contours.pmtiles"
          # Keď cache trafila, celý výpočet vyššie sa preskočil – v súhrne to
          # má byť vidieť ako riadok, nie ako chýbajúce kroky.
          if [ '${{ steps.contours-cache.outputs.cache-hit }}' = 'true' ]; then
            printf '%s\t%s\t%s\t%s\n' "50" "Vrstevnice a skaly" "0" \
              "z cache (nič sa nepočítalo), maxzoom $CZ, $(du -h "$SRC" | cut -f1)" \
              >> steps-out/contours.tsv
          fi

      # Hotové skaly a vrstevnice ako artefakt – na stiahnutie a prezretie
      # v QGISe, bez čakania na ďalší build. 90 dní je maximum, ktoré GitHub
      # pre artefakty dovolí.
      - name: Odlož skaly a vrstevnice ako artefakt
        if: ${{ needs.plan.outputs.opt_contours == 'true' && hashFiles('data/rock.gpkg') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: teren-${{ needs.plan.outputs.key }}-s${{ inputs.rock_slope }}-g${{ inputs.rock_res }}
          path: |
            data/rock.gpkg
            data/contours.gpkg
            contours-out/contours.pmtiles
            contours-out/rock-stats.txt
          retention-days: 90
          compression-level: 9
          if-no-files-found: ignore

      # Časti stránky si joby posielajú artefaktom – každý vyrobí svoj kus
      # `_site` a `deploy` ich zlepí dokopy. compression-level 0: .pmtiles
      # aj .png sú už komprimované, balenie by len ukradlo minúty.
      - name: Odlož časť stránky
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: site-contours
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      # Štatistika skál ide k meraniu krokov, nie na stránku – súhrn ju
      # potrebuje, prehliadač nie.
      - name: Pribal štatistiku skál k meraniu
        if: ${{ always() }}
        run: cp contours-out/rock-stats.txt steps-out/ 2>/dev/null || true

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: steps-contours
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

